Gruen.natur({ id: 'philodendron-hederaceum', ort: 'Wälder Mittelamerikas und der Karibik',
  text: 'Als Hemiepiphyt wächst er an Baumstämmen und hält sich mit Luftwurzeln fest. Sein Name „Philodendron“ bedeutet „Baumfreund“.',
  fakten: ['Junge Triebe wachsen zum dunklen Stamm hin, ältere zum Licht.', 'Mit Halt bilden sich größere Blätter als bei der Hängeform.'] });

Gruen.natur({ id: 'monstera-adansonii', ort: 'Regenwälder Mittel- und Südamerikas',
  text: 'Die Durchlöcherte Monstera klettert an Stämmen und kommt oft in Wäldern mit Feuchtigkeit vor. Ihre Blätter sind kleiner als bei der Deliciosa, haben aber viel mehr Löcher.',
  fakten: ['Sie kann sehr weit klettern und bildet zahlreiche Luftwurzeln.', 'Sie wird oft mit Monstera obliqua verwechselt, die noch zarter und lochreicher ist.'] });

Gruen.natur({ id: 'rhaphidophora-tetrasperma', ort: 'Regenwälder Südthailands und Malaysias',
  text: 'Als Kletterpflanze wächst sie an Baumstämmen. Mit Halt entwickeln sich aus kleinen, ungelochten Blättern die geschlitzten Altersblätter.',
  fakten: ['Sie wird oft „Mini-Monstera“ genannt, ist aber eine eigene Gattung.', 'Mit Halt und Licht wächst sie im Zimmer erstaunlich schnell.'] });

Gruen.natur({ id: 'zamioculcas', ort: 'Trockenwälder und Savannen Ostafrikas (Kenia bis Südafrika)',
  text: 'Die Glücksfeder kommt mit langen Trockenzeiten klar. Er speichert Wasser in seinen dicken Rhizomen und kann in der Dürre Blätter abwerfen, um später wieder auszutreiben.',
  fakten: ['Das Rhizom ist ein Wasserspeicher und erklärt, warum die Pflanze Vergessen so gut verzeiht.', 'In der Natur wächst sie oft im Schatten kleiner Bäume und Felsen.'] });

Gruen.natur({ id: 'geigenfeige', ort: 'Regenwälder Westafrikas',
  text: 'Die Geigenfeige wächst am Naturstandort als Baum, der als Epiphyt in anderen Bäumen keimen kann. Sie bildet Luftwurzeln, umschlingt den Wirt und kann bis über zehn Meter hoch werden.',
  fakten: ['Manche Feigen werden „Würgefeigen“ genannt, weil sie ihren Wirtsbaum umwachsen.', 'Die großen Blätter sind ein Hinweis auf viel Licht und Feuchte im Kronenbereich.'] });

Gruen.natur({ id: 'gummibaum', ort: 'Wälder Indiens und Südostasiens',
  text: 'Der Gummibaum (Ficus elastica) wird in der Natur zu einem riesigen Baum mit mächtigen Luftwurzeln. In Nordostindien (Meghalaya) leiten Menschen die Luftwurzeln über Flüsse und lassen daraus lebende Brücken wachsen.',
  fakten: ['Die „Living Root Bridges“ der Khasi bestehen aus Gummibaum-Wurzeln und halten über Jahrhunderte.', 'Der Milchsaft war früher eine Kautschuk-Quelle, heute wird dafür meist ein anderer Baum genutzt.'] });

Gruen.natur({ id: 'bogenhanf', ort: 'Trockene Wälder und Buschland Westafrikas',
  text: 'Der Bogenhanf wächst in Gegenden mit langen Trockenzeiten. Seine festen Blätter speichern Wasser, und seine Fasern wurden früher zu Seilen und Bogensehnen verarbeitet – daher der englische Name „Bowstring Hemp“.',
  fakten: ['Er betreibt eine besondere Fotosynthese (CAM), bei der er Spaltöffnungen nachts öffnet und so Wasser spart.'] });

Gruen.natur({ id: 'venusfliegenfalle', ort: 'Küstenebene von North und South Carolina (USA)',
  text: 'Die Venusfliegenfalle wächst natürlich nur in einem kleinen Gebiet in den USA, in feuchten, nährstoffarmen Kiefernsavannen. Feuer hält dort die Konkurrenz klein, und die Pflanze kommt durch das Fangen von Insekten an Nährstoffe.',
  fakten: ['In der Natur ist sie gefährdet, vor allem durch Verlust ihres Lebensraums und Wilderei.', 'Eine Falle schließt sich nur, wenn innerhalb kurzer Zeit zwei Haare berührt werden.'] });

Gruen.natur({ id: 'nepenthes-ventrata', ort: 'Tropisches Südostasien (Elternarten von den Philippinen)',
  text: 'Kannenpflanzen wachsen als Lianen oder Büsche in Wäldern und Mooren Südostasiens. Aus den Blattspitzen hängen Kannen, in denen Verdauungssaft Insekten zersetzt.',
  fakten: ['Einige sehr große Arten (zum Beispiel Nepenthes rajah) können Kleinsäuger fangen.', 'Nepenthes ventrata ist eine natürliche Hybride und besonders robust.'] });

Gruen.natur({ id: 'phalaenopsis', ort: 'Wälder Südostasiens (Philippinen, Indonesien, Taiwan)',
  text: 'Phalaenopsis wächst als Epiphyt auf Ästen. Ihre dicken, grünen Luftwurzeln nehmen Regen und Luftfeuchte auf und betreiben selbst Fotosynthese – deshalb gedeihen sie gut in durchsichtigen Töpfen.',
  fakten: ['Der Name bedeutet „Schmetterlingsähnlich“.', 'Die Pflanzen haben keine Speicherknollen und trocknen zwischen den Güssen ab.'] });

Gruen.natur({ id: 'hoya-carnosa', ort: 'Wälder in Südchina, Südostasien und Australien',
  text: 'Die Wachsblume wächst als Epiphyt oder Kletterer an Bäumen und Felsen. Ihre dicken Blätter speichern Wasser, damit sie kurze Trockenzeiten überstehen.',
  fakten: ['Die Blüten duften besonders nachts und werden dann von Nachtfaltern besucht.', 'Blütenstiele bleiben stehen: Die Pflanze blüht daran jedes Jahr wieder.'] });

Gruen.natur({ id: 'lithops', ort: 'Wüsten und Halbwüsten im südlichen Afrika (Namibia, Südafrika)',
  text: 'Lebende Steine wachsen fast ganz im Boden, zwischen Kieseln und Quarz, und sind von ihnen kaum zu unterscheiden. Nur die Oberseite der Blätter ist sichtbar, durch durchscheinende „Fenster“ gelangt Licht ins Innere.',
  fakten: ['Die Farbe passt sich oft dem Gestein ihrer Umgebung an.', 'Sie wachsen im Herbst, blühen und ruhen im Sommer.'] });

Gruen.natur({ id: 'kentia', ort: 'Lord-Howe-Insel (Australien)',
  text: 'Die Kentia-Palme stammt ursprünglich nur von der kleinen Lord-Howe-Insel im Pazifik. Der Export von Samen und Setzlingen ist dort ein wichtiger Wirtschaftszweig.',
  fakten: ['Sie wurde im 19. Jahrhundert eine Modepalme in Wintergärten und Salons.', 'Sie wächst langsam und gilt als besonders schattenverträglich.'] });

Gruen.natur({ id: 'anthurium-warocqueanum', ort: 'Regenwälder Kolumbiens',
  text: 'Das Königs-Anthurium wächst dort an Baumstämmen und im Unterwuchs. Seine Blätter werden mit der Zeit sehr lang und hängen herab.',
  fakten: ['Die Blätter erreichen mit Alter gut über einen Meter Länge.', 'Es ist im Handel gefragt und teuer; Nachzuchten sind der Wildentnahme vorzuziehen.'] });

Gruen.natur({ id: 'anthurium-crystallinum', ort: 'Wälder Kolumbiens und Panamas',
  text: 'Das Kristall-Anthurium wächst als Epiphyt im feuchten Unterwuchs. Die samtigen Blätter mit weißen Adern bleiben dort im Schatten und entwickeln ihre Zeichnung bei guten Bedingungen.',
  fakten: ['Hohe Luftfeuchte und eine durchlässige Humusschicht am Wuchsort sind typisch.'] });

Gruen.natur({ id: 'philodendron-gloriosum', ort: 'Wälder Kolumbiens',
  text: 'Anders als viele Philodendren klettert der Gloriosum nicht, sondern kriecht auf dem Waldboden. Die dicken Rhizome liegen auf der Oberfläche, die Blätter stehen aufrecht dazu.',
  fakten: ['Wegen des Kriechwuchses braucht er im Zimmer Platz und keinen Moosstab.'] });

Gruen.natur({ id: 'philodendron-verrucosum', ort: 'Bergwälder von Costa Rica bis Ecuador',
  text: 'Der Verrucosum wächst als Epiphyt in feuchten Bergwäldern. Charakteristisch sind die borstig-warzigen Blattstiele, an denen Wasser abperlen kann.',
  fakten: ['Er wird in höheren, kühleren Lagen gefunden und braucht im Zimmer viel Luftfeuchte.'] });

Gruen.natur({ id: 'nephrolepis', ort: 'Tropische Regionen weltweit',
  text: 'Der Schwertfarn wächst am Boden oder als Epiphyt auf Bäumen in feuchten Tropenwäldern. Er breitet sich mit Ausläufern aus und bildet dichte Bestände.',
  fakten: ['Er gehört zu den am weitesten verbreiteten Farnen der Tropen.'] });

Gruen.natur({ id: 'schlumbergera', ort: 'Küstenwälder im Südosten Brasiliens',
  text: 'Der Weihnachtskaktus ist ein Epiphyt, der im Bergregenwald auf Bäumen und Felsen wächst. Er blüht in der kürzer werdenden Tageslänge – daher im Spätherbst.',
  fakten: ['Er ist eine Kurztagspflanze: Er bildet Knospen bei langen Nächten und kühleren Temperaturen.', 'Er hat keine Dornen und wächst hängend von Ästen herab.'] });

Gruen.natur({ id: 'ficus-benjamina', ort: 'Wälder Südostasiens bis Nordaustralien',
  text: 'Die Birkenfeige wird in der Natur zu einem großen Baum mit ausladender Krone. Sie wächst häufig als Würgefeige auf anderen Bäumen.',
  fakten: ['In Tropenstädten wird sie als Straßenbaum gepflanzt.', 'Früchte werden von Vögeln und Fledermäusen verbreitet.'] });

Gruen.natur({ id: 'pachira-aquatica', ort: 'Sümpfe und Flussufer Mittel- und Südamerikas',
  text: 'Die Glückskastanie wächst dort als Baum in nassen Böden. Die großen Samen sind essbar und werden geröstet gegessen.',
  fakten: ['Ihre Hand-förmig geteilten Blätter erinnern an die Rosskastanie, mit der sie nicht verwandt ist.'] });

Gruen.natur({ id: 'strelitzia-reginae', ort: 'Küstenregionen im Osten Südafrikas',
  text: 'Die Paradiesvogelblume wächst im Buschland und in Küstenwäldern. Ihre Blüten werden von Nektarvögeln bestäubt, die auf dem blauen „Landeplatz“ sitzen und dabei Pollen aufnehmen.',
  fakten: ['Sie ist ein Wahrzeichen Südafrikas und ziert dort eine Münze.'] });

Gruen.natur({ id: 'rhipsalis-baccifera', ort: 'Tropisches Amerika, Afrika und Sri Lanka',
  text: 'Der Binsenkaktus ist ein Epiphyt in Regenwäldern. Er ist eine der wenigen Kakteen, die auch außerhalb Amerikas natürlich vorkommen – vermutlich haben Vögel die Samen verbreitet.',
  fakten: ['Er hat keine Dornen und trägt kleine, weiße Beeren.'] });

Gruen.natur({ id: 'dendrobium-nobile', ort: 'Himalaya bis Südostasien',
  text: 'Die Edle Dendrobie wächst auf Bäumen und Felsen in Bergwäldern. Dort herrscht eine trockene, kühle Jahreszeit, die die Pflanze zum Blühen anregt.',
  fakten: ['Die Kältereize im Winter lösen die Blütenknospen aus – ohne sie bleibt sie oft ohne Blüten.'] });

Gruen.natur({ id: 'clivia-miniata', ort: 'Küstenwälder und Dünen in Südafrika',
  text: 'Das Riemenblatt wächst im Unterwuchs schattiger Wälder und bildet dichte Horste. Es braucht eine trockene, kühlere Ruhezeit, um zu blühen.',
  fakten: ['Die roten Beeren werden von Vögeln verbreitet.'] });

Gruen.natur({ id: 'tillandsia-ionantha', ort: 'Mexiko, Mittelamerika',
  text: 'Die kleine Luftpflanze wächst auf Ästen und Felsen. Sie nimmt Wasser aus Tau, Nebel und Regen über Schuppen (Trichome) auf.',
  fakten: ['Wurzeln dienen nur zum Festhalten, nicht zum Trinken.', 'Vor der Blüte färbt sie sich rot.'] });

Gruen.natur({ id: 'platycerium-bifurcatum', ort: 'Wälder Australiens und Neuguineas',
  text: 'Der Geweihfarn wächst auf Baumästen. Seine runden Schildwedel fangen herabfallendes Laub und Regenwasser und halten so Nährstoffe, die die Pflanze aufnimmt.',
  fakten: ['Die braunen, trockenen Schildwedel sind normal und wichtig.'] });

Gruen.natur({ id: 'coffea-arabica', ort: 'Bergwälder in Äthiopien',
  text: 'Der Arabische Kaffee ist ein Strauch oder kleiner Baum im schattigen Unterwuchs der Bergwälder. Dort wächst auch die Wildform, aus der alle Kaffeesorten gezüchtet wurden.',
  fakten: ['Die Samen sind die „Kaffeebohnen“.', 'Er bevorzugt gleichmäßig feuchte Böden und gemäßigte Temperaturen.'] });

Gruen.natur({ id: 'echinocactus-grusonii', ort: 'Zentralmexiko',
  text: 'Der Goldkugelkaktus wächst auf trockenen Hängen. In der Natur ist er stark gefährdet; Teile seines Lebensraums liegen heute unter Stauseen.',
  fakten: ['Er kann sehr alt und über einen Meter breit werden.', 'Gekaufte Pflanzen stammen aus Kultur.'] });

Gruen.natur({ id: 'ceropegia-woodii', ort: 'Südliches Afrika (unter anderem Südafrika, Eswatini)',
  text: 'Die Leuchterblume wächst als dünne Ranke zwischen Büschen und Felsen. Entlang der Triebe bilden sich kleine Knöllchen, die Wasser speichern und neue Pflanzen entstehen lassen.',
  fakten: ['Die herzförmigen Blätter sind marmoriert und gaben ihr den Namen „Rosenkranzpflanze“.'] });

Gruen.natur({ id: 'maranta', ort: 'Regenwälder Brasiliens',
  text: 'Die Pfeilwurz wächst am schattigen Waldboden. Ihre Blätter heben sich abends und senken sich morgens – deshalb heißt sie auch Gebetspflanze.',
  fakten: ['Die Bewegung folgt einem inneren Rhythmus und dem Licht.'] });

Gruen.natur({ id: 'aloe-vera', ort: 'Ursprünglich vermutlich die Arabische Halbinsel',
  text: 'Die Echte Aloe wächst nicht mehr wild an einem sicher bekannten Ort, sie wird seit Jahrtausenden kultiviert. Sie speichert Wasser in den fleischigen Blättern und überlebt lange Trockenzeiten.',
  fakten: ['Das Gel in den Blättern wird traditionell für die Haut verwendet.', 'Der gelbe Saft unter der Blatthaut kann Magenprobleme verursachen.'] });

Gruen.natur({ id: 'geldbaum', ort: 'Trockene Hänge in Südafrika',
  text: 'Der Geldbaum wächst auf steinigen Hängen und speichert Wasser in den dicken Blättern. Er bildet im Alter einen kleinen, verholzten Stamm.',
  fakten: ['Abgefallene Blätter wurzeln und bilden neue Pflanzen.'] });

Gruen.natur({ id: 'cebu-blue', ort: 'Insel Cebu (Philippinen)',
  text: 'Der Cebu Blue klettert an Baumstämmen und Felsen. Junge Blätter sind schmal und blau-silbrig, erst mit Kletterhilfe bildet er größere, am Rand eingeschnittene Altersblätter.',
  fakten: ['Seine silbrige Farbe entsteht durch Wachs auf der Blattoberfläche.'] });

Gruen.natur({ id: 'syngonium-podophyllum', ort: 'Wälder Mittelamerikas',
  text: 'Als Kletterer wächst die Purpurtute an Stämmen empor. Die Blätter verändern sich dabei: Junge sind pfeilförmig, ältere gelappt.',
  fakten: ['Die Form der Blätter ändert sich mit der Wuchsphase.'] });

Gruen.natur({ id: 'einblatt', ort: 'Regenwaldboden in Kolumbien und Venezuela',
  text: 'Das Einblatt (Spathiphyllum wallisii) wächst im schattigen Unterwuchs, wo es feucht und warm ist. Es kommt mit wenig Licht aus und bildet dichte Horste.',
  fakten: ['Die weiße „Blüte“ ist ein Hochblatt; die eigentlichen Blüten sitzen am Kolben.'] });

Gruen.natur({ id: 'ficus-audrey', ort: 'Indien',
  text: 'Die Bengalische Feige (Ficus benghalensis) wird in Indien zu einem gewaltigen Baum, dessen Luftwurzeln zu Stützstämmen werden. Einzelne Bäume überspannen als „Banyan“ große Flächen.',
  fakten: ['Banyan-Bäume gehören zu den Bäumen mit der größten Kronenfläche.', 'In Indien gilt sie als heiliger Baum.'] });

Gruen.natur({ id: 'alocasia-macrorrhizos', ort: 'Tropisches Asien und Pazifik',
  text: 'Die Riesen-Alocasia wächst in feuchten Wäldern und an Gewässern, bis mehrere Meter hoch. Ihre Stammknolle speichert Stärke und wurde in manchen Regionen als Notnahrung genutzt, nachdem sie sorgfältig gegart wurde.',
  fakten: ['Roh ist sie wegen Calciumoxalat giftig.'] });

</script>
<script>
/* GRUENZEUG – Kunst: alle gezeichneten Bilder der App als SVG (kein Bild wird geladen, alles läuft offline).
   - Himmel/Tageszeit, Zauberfenster-Szene mit Topf, Gesicht, Pflanzenstufen, Deko (für den Sprouty)
   - Ornamente, Zeichnungen für leere Seiten, Start-Bild
   - Fx: kleine Partikel-Effekte (Tropfen, Funken, Herzen, Laub, Tau), die über der Oberfläche fliegen
   Alles hier ist statischer Text – Nutzereingaben (Name des Sprouty) gehen nur durch `Kunst.esc`. */
const Kunst = {
  _n: 0,
  uid() { return 'k' + (++Kunst._n); },
  esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  r1(x) { return Math.round(x * 10) / 10; },
  hex(h) { return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); },
  mix(a, b, t) { const A = Kunst.hex(a), B = Kunst.hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); },
  klemme(x, a, b) { return Math.max(a, Math.min(b, x)); },
  /** SVG-Text → Element */
  el(svg) { const t = document.createElement('template'); t.innerHTML = svg.trim(); return t.content.firstChild; },

  /* ---------- Tageszeit ---------- */
  /** 0 = heller Tag, 1 = tiefe Nacht (weicher Übergang um Dämmerung) */
  nacht(h) {
    if (h >= 8 && h <= 18) return 0;
    if (h > 18 && h < 21) return (h - 18) / 3;
    if (h >= 21 || h <= 5) return 1;
    return (8 - h) / 3;
  },
  /** Himmelsfarben und Sternenhelligkeit für die Uhrzeit (Kommazahl, 0–24) */
  himmel(h) {
    const K = [[0, '#0a1230', '#1c2a57', 1], [5, '#101a3d', '#2c3a6b', .9], [6.5, '#5b5a9a', '#f2a27c', .35], [8, '#7fb6e6', '#f7dca8', 0],
      [12, '#5aa5e8', '#bfe3f7', 0], [17, '#6fb0e4', '#f6e0b0', 0], [19, '#8a6aa8', '#f5946c', .15], [20.5, '#2b2a63', '#8a4f7e', .6], [22, '#0e1636', '#233162', 1], [24, '#0a1230', '#1c2a57', 1]];
    h = ((h % 24) + 24) % 24;
    let i = 0;
    while (i < K.length - 2 && h > K[i + 1][0]) i++;
    const a = K[i], b = K[i + 1], t = Kunst.klemme((h - a[0]) / (b[0] - a[0]), 0, 1);

/* =====================================================================================================

Kunst.Pflanze = {
  /** Blatt als Pfad, Spitze oben, Stiel im Ursprung. L = Länge, w = halbe Breite */
  blattPfad(typ, L, w) {

      halb: 'M0 0C' + a[0] + ' ' + a[1] + ' ' + a[2] + ' ' + a[3] + ' 0 ' + (-L) + 'Z' };
  },
  /** Ein Blatt an Stelle (x, y), Winkel in Grad (0 = senkrecht nach oben). welk senkt es ab. */

        s += '<ellipse cx="' + Kunst.r1(xx + ll * .5) + '" cy="' + Kunst.r1(yy) + '" rx="' + Kunst.r1(ll * .55) + '" ry="' + Kunst.r1(ll * .2) + '" transform="rotate(28 ' + Kunst.r1(xx) + ' ' + Kunst.r1(yy) + ')" fill="' + b + '"/>';

  /** Stern aus vier Spitzen (Funkeln) */
  funke(x, y, r, farbe, klasse, delay) {

      + '<path d="M0 ' + R(r * .5) + 'C' + R(-r * .45) + ' ' + R(r * .3) + ' ' + R(-r * .55) + ' ' + R(-r * .1) + ' ' + R(-r * .5) + ' ' + R(-r * .2) + 'M0 ' + R(r * .5) + 'C' + R(r * .45) + ' ' + R(r * .3) + ' ' + R(r * .55) + ' ' + R(-r * .1) + ' ' + R(r * .5) + ' ' + R(-r * .2) + '" stroke="' + p.stiel + '" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>';

    } else if (typ === 'glocke') {
      const glocke = (x, y, k) => '<path d="M' + R(x - r * .12 * k) + ' ' + R(y - r * .55 * k) + 'C' + R(x - r * .85 * k) + ' ' + R(y - r * .3 * k) + ' ' + R(x - r * .7 * k) + ' ' + R(y + r * .5 * k) + ' ' + R(x - r * .9 * k) + ' ' + R(y + r * .75 * k) + 'Q' + x + ' ' + R(y + r * 1.1 * k) + ' ' + R(x + r * .9 * k) + ' ' + R(y + r * .75 * k) + 'C' + R(x + r * .7 * k) + ' ' + R(y + r * .5 * k) + ' ' + R(x + r * .85 * k) + ' ' + R(y - r * .3 * k) + ' ' + R(x + r * .12 * k) + ' ' + R(y - r * .55 * k) + 'Z" fill="' + p.ba + '"/>'
        + '<path d="M' + R(x - r * .9 * k) + ' ' + R(y + r * .75 * k) + 'Q' + x + ' ' + R(y + r * 1.1 * k) + ' ' + R(x + r * .9 * k) + ' ' + R(y + r * .75 * k) + '" stroke="' + p.bb + '" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="' + x + '" cy="' + R(y + r * 1 * k) + '" r="' + R(r * .14 * k) + '" fill="' + p.mitte + '"/>';
      s += glocke(cx, cy - r * .1, .8) + glocke(R(cx + r * .95), R(cy + r * .55), .5);
    } else if (typ === 'tulpe') {
      s += '<path d="M' + R(cx - r * .72) + ' ' + R(cy - r * .1) + 'C' + R(cx - r * .8) + ' ' + R(cy + r * .75) + ' ' + R(cx + r * .8) + ' ' + R(cy + r * .75) + ' ' + R(cx + r * .72) + ' ' + R(cy - r * .1) + 'L' + R(cx + r * .4) + ' ' + R(cy - r * .95) + 'L' + cx + ' ' + R(cy - r * .35) + 'L' + R(cx - r * .4) + ' ' + R(cy - r * .95) + 'Z" fill="' + p.ba + '"/>'
        + '<path d="M' + cx + ' ' + R(cy - r * .35) + 'C' + R(cx - r * .2) + ' ' + R(cy + r * .2) + ' ' + R(cx - r * .1) + ' ' + R(cy + r * .5) + ' ' + cx + ' ' + R(cy + r * .62) + 'C' + R(cx + r * .1) + ' ' + R(cy + r * .5) + ' ' + R(cx + r * .2) + ' ' + R(cy + r * .2) + ' ' + cx + ' ' + R(cy - r * .35) + 'Z" fill="' + p.bb + '"/>';
    } else if (typ === 'kugel') {
      s += '<circle class="atmen" cx="' + cx + '" cy="' + cy + '" r="' + R(r * 1.5) + '" fill="' + p.ba + '" opacity=".16"/><circle class="atmen" cx="' + cx + '" cy="' + cy + '" r="' + R(r * 1.05) + '" fill="' + p.ba + '" opacity=".28"/>'

  },

  /** Die ganze Pflanze oben auf dem Topf (Ursprung (180, 202)). stufe 0–5, p = Farbschema, welk 0–1 */
  zeichne(stufe, p, welk) {
    const R = Kunst.r1, X = 180, Y = 202, P = Kunst.Pflanze;
    welk = welk || 0;
    const stiel = Kunst.mix(p.stiel, '#8a8450', welk * .7);

    if (p.typ === 'kaktus') return P.kaktus(stufe, p, welk);
    if (p.typ === 'pilz') return P.pilz(stufe, p, welk);

    const lean = (welk * 22);

    const sw = [0, 3, 4, 4.8, 5.4, 5.6][stufe];
    let s = '<path d="M' + X + ' ' + Y + 'C' + X + ' ' + R(Y - H * .5) + ' ' + R(X + lean * .3) + ' ' + R(Y - H * .8) + ' ' + R(topX) + ' ' + R(topY) + '" stroke="' + stiel + '" stroke-width="' + sw + '" fill="none" stroke-linecap="round"/>';

  kaktus(stufe, p, welk) {

  pilz(stufe, p, welk) {

  deko(st) {
    const n = Kunst.nacht(st.stunde);
    let s = '';
    for (const slot of ['fenster', 'hang']) {
      const id = st.deko && st.deko[slot], f = id && Kunst.Szene.DEKO[id];
      if (f) s += '<g transform="translate(' + Kunst.Szene.DEKO_ORT[slot].join(' ') + ')">' + f(n) + '</g>';
    }
    return s;
  },
  dekoBank(st) {
    const n = Kunst.nacht(st.stunde);
    let s = '';
    for (const slot of ['sill_l', 'sill_r']) {
      const id = st.deko && st.deko[slot], f = id && Kunst.Szene.DEKO[id];
      if (f) s += '<g transform="translate(' + Kunst.Szene.DEKO_ORT[slot].join(' ') + ')">' + f(n) + '</g>';
    }
    return s;
  },

  /** Lampe, Lichtkegel und Dämmerungston */
  licht(st) {
    const n = Kunst.nacht(st.stunde), an = !!st.lampe, id = st.id;
    let s = '<defs><radialGradient id="' + id + 'g" cx="322" cy="56" r="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd36e" stop-opacity=".5"/><stop offset=".45" stop-color="#ffd36e" stop-opacity=".14"/><stop offset="1" stop-color="#ffd36e" stop-opacity="0"/></radialGradient>'

  /** Besucher: Läuse auf den Blättern, Falter, Fee */
  ereignis(st) {
    const e = st.ereignis;
    if (!e) return '';
    if (e.typ === 'laus') {
      const H = [0, 24, 52, 82, 108, 112][st.stufe] || 24;
      const pos = [[-26, .55], [24, .5], [-34, .85], [30, .8], [0, 1.02]];
      return pos.map((q, i) => {
        if (!(e.laeuse || [1, 1, 1, 1, 1])[i]) return '';
        const x = 180 + q[0] * (.6 + st.stufe * .1), y = 202 - H * q[1];
        return '<g class="laus" data-tap="laus" data-i="' + i + '" transform="translate(' + Kunst.r1(x) + ' ' + Kunst.r1(y) + ')"><circle r="17" fill="#000" opacity="0"/><ellipse rx="5.500" ry="4" fill="#79c46a" stroke="#2f6b45" stroke-width="1.200"/><circle cx="-3" cy="-2" r="1.200" fill="#2a1c15"/><circle cx="1" cy="-2.500" r="1.200" fill="#2a1c15"/><path d="M-4 3l-3 3M0 4v4M4 3l3 3M-5 0l-4-1M5 0l4-1" stroke="#2f6b45" stroke-width="1" stroke-linecap="round"/><path d="M3-4l3-3" stroke="#2f6b45" stroke-width="1"/></g>';

    return '';
  },

  /* ---- Zusammenbau ---- */
  EBENEN: [['himmel', 'himmel'], ['deko', 'deko'], ['tisch', 'tisch'], ['bank', 'dekoBank'], ['figur', 'figur'], ['licht', 'licht'], ['ereignis', 'ereignis']],

  /** Szene erzeugen. opt.nah: Ausschnitt um Topf und Pflanze (für Karten). → {el, set(st), gruppe(name)} */
  bauen(opt) {
    opt = opt || {};
    const id = Kunst.uid();
    const svg = Kunst.el('<svg class="szene' + (opt.nah ? ' nah' : '') + '" viewBox="' + (opt.nah ? '20 46 320 228' : '0 0 360 340') + '" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dein Sprouty im Zauberfenster" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sschw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient></defs></svg>');
    const g = {};
    for (const [name] of Kunst.Szene.EBENEN) { g[name] = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g[name].setAttribute('data-g', name); svg.append(g[name]); }
    const letzte = {};
    const schluessel = {
      himmel: (st) => Math.round(st.stunde * 4) + ':' + (st.lampe ? 1 : 0),
      deko: (st) => JSON.stringify([st.deko && st.deko.fenster, st.deko && st.deko.hang, Math.round(Kunst.nacht(st.stunde) * 8)]),
      tisch: (st) => (st.name || '') + ':' + Math.round(Kunst.nacht(st.stunde) * 4),
      bank: (st) => JSON.stringify([st.deko && st.deko.sill_l, st.deko && st.deko.sill_r, Math.round(Kunst.nacht(st.stunde) * 8)]),
      figur: (st) => JSON.stringify([st.stufe, st.pal && st.pal.id, Math.round((st.welk || 0) * 10), st.gesicht, st.topf, st.zub]),
      licht: (st) => (st.lampe ? 1 : 0) + ':' + Math.round(Kunst.nacht(st.stunde) * 8),
      ereignis: (st) => JSON.stringify([st.ereignis, st.stufe]),
    };
    return {
      el: svg,
      gruppe: (name) => g[name],
      set(st) {
        st = Object.assign({ id }, st);
        for (const [name, fn] of Kunst.Szene.EBENEN) {
          const k = schluessel[name](st);
          if (letzte[name] === k) continue;
          letzte[name] = k;
          g[name].innerHTML = Kunst.Szene[fn](st);
        }
      },
    };
  },
};

  burst(x, y, art, n) {

  /** Partikel aus der Mitte eines Elements (oder eines Klicks) */
  von(el, art, n) {

  feier(el) {

  },

<script>
/* GRUENZEUG – Sprouty: Spiel-Logik (kein Bildschirm hier, der steht in js/spielui.js).
   Ein kleines Pflanzen-Tamagotchi: Der Sprouty braucht Wasser, Nährstoffe, Licht (Lampe an am Tag, aus in der Nacht)
   und Zuneigung. Er wächst nur, wenn alles halbwegs stimmt, und wird je nach Pflege zu einer von zehn Arten, die ins
   Herbarium kommen. Er stirbt nie – wer ein paar Tage weg war, findet ihn welk, aber heilbar.
   Zeit: Der Zustand wird in Stunden-Schritten nachgerechnet (`tick`), auch wenn die App tagelang zu war (höchstens 96 h).
   Der Zustand liegt in Data.meta.spiel (wird mit Cloud und Sicherung mitgenommen), Änderung → `speichern()`.
   Läuft in Node (tools/selftest.js prüft die Rechnung); Zugriffe auf Data/Sync/U sind dort abgesichert. */
const Spiel = {
  STUFEN: [0, 6, 24, 54, 96, 150],               // Wachstumspunkte (≈ Stunden guter Pflege) je Stufe
  STUFEN_NAMEN: ['Samen', 'Keimling', 'Spross', 'Jungpflanze', 'Blattpracht', 'Blüte'],
  stand: null,
  meldungen: [],                                  // Texte, die die Oberfläche als Toast zeigt

  /* ---------- Arten (Herbarium) ---------- */
  ARTEN: [

      pal: { blatt: 'oval', a: '#6fae6a', b: '#3f7d4a', stiel: '#4a7d3f', bluete: 'rund', ba: '#ffe38a', bb: '#ffc861', mitte: '#c9742e' } },

    { id: 'mondfarn', name: 'Mondfarn', stufe: 'besonders', tipp: 'Wenig Licht, aber viel Wasser.', text: 'Silbrige Wedel, die im Dunkeln leise nach Regen duften. Seine Blüte ist ein kleiner, kühler Mond.',

    { id: 'gluehbeere', name: 'Glühbeere', stufe: 'besonders', tipp: 'Viel Dünger, nicht zu viel Licht.', text: 'Wer sie gut füttert, bekommt eine Beere, die von innen glüht. Man erzählt, sie wärme kalte Hände.',

    { id: 'leuchtpilz', name: 'Leuchtpilz', stufe: 'selten', tipp: 'Fast nur im Dunkeln halten – Lampe selten an.', text: 'Eigentlich gar keine Pflanze, aber wer fragt schon. Seine Flecken schimmern in der Nacht mintgrün.',

    { id: 'honigranke', name: 'Honigranke', stufe: 'selten', tipp: 'Gut düngen, aber nur mäßig gießen.', text: 'Klebt ein bisschen, riecht nach Sommer und wird von Hummeln heimlich verehrt.',
      pal: { blatt: 'herz', a: '#9bb83f', b: '#6f8a22', stiel: '#6f8a22', bluete: 'glocke', ba: '#ffcf5a', bb: '#e8a21f', mitte: '#fff' } },
    { id: 'sternorchidee', name: 'Sternenorchidee', stufe: 'legendär', tipp: 'Perfekte Pflege: Wasser, Dünger, Licht und Liebe – alles stimmt.', text: 'Gibt es nur bei makelloser Pflege. Ihre Blüte hat die Farbe von Mondlicht, und sie weiß, dass du dich gekümmert hast.',
      pal: { blatt: 'spitz', a: '#2f8a6a', b: '#17594a', stiel: '#1f6f58', bluete: 'stern', ba: '#ffffff', bb: '#d9b8ff', mitte: '#ffd95e' } },
  ],
  art(id) { return Spiel.ARTEN.find((a) => a.id === id) || Spiel.ARTEN[0]; },
  /** Farbschema (mit Kennung, damit die Szene weiß, wann sie neu zeichnen muss) */
  pal(id) { const a = Spiel.art(id); return Object.assign({ id: a.id }, a.pal); },

  /** Welche Art wird aus dieser Pflege? avg = {l, w, n, f} (Mittelwerte 0–100 von Licht, Wasser, Nahrung, Laune) */
  bestimme(v) {
    if (v.l >= 75 && v.w >= 70 && v.n >= 60 && v.f >= 70) return 'sternorchidee';
    if (v.w < 48 && v.l >= 60) return 'zauberkaktus';
    if (v.l < 42) return 'leuchtpilz';
    if (v.l < 60 && v.w >= 62) return 'mondfarn';
    if (v.w >= 78) return 'traenenfarn';
    if (v.n >= 72 && v.l < 72) return 'gluehbeere';
    if (v.n >= 60 && v.w <= 70) return 'honigranke';

  },
  mittel(s) {
    const t = s.stat || {}, n = t.n || 0;
    return n ? { l: t.l / n, w: t.w / n, n: t.d / n, f: t.f / n } : { l: 50, w: 50, n: 50, f: 50 };
  },
  /** Art, auf die es gerade hinausläuft (vor der Blüte nur eine Tendenz) */
  neigung(s) { return s.art || ((s.stat && s.stat.n >= 8) ? Spiel.bestimme(Spiel.mittel(s)) : 'moosbaer'); },

  /* ---------- Laden ---------- */
  SLOTS: { sill_l: 'Fensterbank links', sill_r: 'Fensterbank rechts', hang: 'Hängend', fenster: 'Im Fenster' },
  DEKO: [
    { id: 'pilze', slot: 'sill_l', name: 'Leuchtpilze', preis: 12, text: 'Drei Pilze, die nachts schimmern.' },

    { id: 'moosstein', slot: 'sill_l', name: 'Moosstein', preis: 14, text: 'Ein Stück Wald zum Mitnehmen.' },
    { id: 'teich', slot: 'sill_l', name: 'Mini-Teich', preis: 28, text: 'Mit Seerose und einem Frosch.' },

    { id: 'glas', slot: 'sill_r', name: 'Glühwürmchen-Glas', preis: 26, text: 'Leuchtet, sobald es dunkel wird.' },

    { id: 'mond', name: 'Mondblau', preis: 30 }, { id: 'beere', name: 'Beere', preis: 30 }, { id: 'gold', name: 'Gold', preis: 60 },
  ],
  ZUBEHOER: [

    { id: 'kroenchen', name: 'Krönchen', preis: 40, text: 'Königin des Fensterbretts.' },
  ],

  /* ---------- Zustand ---------- */
  neu(jetzt) {
    jetzt = jetzt || Date.now();
    return {
      v: 1, u: 0, t: jetzt, seit: jetzt, name: 'Sprouty', stufe: 0, wachs: 0, gekeimt: false, art: null,
      wasser: 30, nahrung: 60, licht: 50, laune: 60, lampe: false,
      stat: { n: 0, l: 0, w: 0, d: 0, f: 0 },
      tau: 10, deko: { besitz: [], platz: {} }, topf: 'terra', toepfe: ['terra'], zub: null, zubBesitz: [],
      herbar: {}, serie: { n: 0, letzte: null, beste: 0 }, tag: null, ereignis: null, feier: null,
      beste: { jagd: 0 }, gesamt: { giessen: 0, duengen: 0, streicheln: 0, jagd: 0, samen: 0 },
    };
  },
  /** Fremde Daten (Cloud, Sicherung, Speicher) prüfen: nur bekannte Felder, Zahlen begrenzt, Listen gefiltert → Zustand oder null */
  saeubern(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
    const zahl = (x, a, b, d) => (typeof x === 'number' && isFinite(x) ? Math.max(a, Math.min(b, x)) : d);
    const txt = (x, n, d) => (typeof x === 'string' ? x.slice(0, n) : d);
    const iso = (x) => (typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x) ? x : null);
    const jetzt = Date.now(), s = Spiel.neu(jetzt);
    s.u = zahl(raw.u, 0, 8e15, 0); s.t = zahl(raw.t, 0, jetzt + 36e5, jetzt); s.seit = zahl(raw.seit, 0, jetzt, jetzt);
    s.name = txt(raw.name, 16, 'Sprouty').trim() || 'Sprouty';
    if (s.name === 'Sprössling') s.name = 'Sprouty'; // alter Standardname
    s.stufe = Math.round(zahl(raw.stufe, 0, 5, 0)); s.wachs = zahl(raw.wachs, 0, 200, 0); s.gekeimt = !!raw.gekeimt;
    s.art = Spiel.ARTEN.some((a) => a.id === raw.art) ? raw.art : null;
    for (const k of ['wasser', 'nahrung', 'licht', 'laune']) s[k] = zahl(raw[k], 0, 100, s[k]);
    s.lampe = !!raw.lampe;
    const st = raw.stat && typeof raw.stat === 'object' ? raw.stat : {};
    s.stat = { n: zahl(st.n, 0, 1000, 0), l: zahl(st.l, 0, 1e5, 0), w: zahl(st.w, 0, 1e5, 0), d: zahl(st.d, 0, 1e5, 0), f: zahl(st.f, 0, 1e5, 0) };
    s.tau = Math.round(zahl(raw.tau, 0, 1e6, 0));
    const ids = (arr, liste) => (Array.isArray(arr) ? arr.filter((x, i) => typeof x === 'string' && liste.some((l) => l.id === x) && arr.indexOf(x) === i) : []);
    const d = raw.deko && typeof raw.deko === 'object' ? raw.deko : {};
    s.deko.besitz = ids(d.besitz, Spiel.DEKO);
    for (const slot in Spiel.SLOTS) { const id = d.platz && d.platz[slot]; if (typeof id === 'string' && s.deko.besitz.includes(id) && Spiel.DEKO.find((x) => x.id === id).slot === slot) s.deko.platz[slot] = id; }
    s.toepfe = ids(raw.toepfe, Spiel.TOEPFE); if (!s.toepfe.includes('terra')) s.toepfe.unshift('terra');
    s.topf = s.toepfe.includes(raw.topf) ? raw.topf : 'terra';
    s.zubBesitz = ids(raw.zubBesitz, Spiel.ZUBEHOER); s.zub = s.zubBesitz.includes(raw.zub) ? raw.zub : null;
    if (raw.herbar && typeof raw.herbar === 'object') for (const a of Spiel.ARTEN) { const h = raw.herbar[a.id]; if (h && typeof h === 'object') s.herbar[a.id] = { n: Math.round(zahl(h.n, 1, 9999, 1)), erst: iso(h.erst) || '2026-01-01' }; }
    const se = raw.serie && typeof raw.serie === 'object' ? raw.serie : {};
    s.serie = { n: Math.round(zahl(se.n, 0, 99999, 0)), letzte: iso(se.letzte), beste: Math.round(zahl(se.beste, 0, 99999, 0)) };
    if (raw.tag && typeof raw.tag === 'object' && iso(raw.tag.d)) {
      const t = raw.tag, n = (x) => Math.round(zahl(x, 0, 999, 0));
      s.tag = { d: t.d, quests: Array.isArray(t.quests) ? t.quests.filter((q) => Spiel.AUFGABEN[q]).slice(0, 3) : [], giessen: n(t.giessen), duengen: n(t.duengen), streicheln: n(t.streicheln), spiele: n(t.spiele), licht: n(t.licht), echt: n(t.echt), fakt: !!t.fakt, besuch: !!t.besuch, ereignisse: n(t.ereignisse),
        belohnt: t.belohnt && typeof t.belohnt === 'object' ? Object.keys(t.belohnt).filter((k) => Spiel.AUFGABEN[k] || k === 'alle').reduce((o, k) => { o[k] = true; return o; }, {}) : {} };
    }
    const e = raw.ereignis;
    if (e && typeof e === 'object' && ['laus', 'falter', 'fee'].includes(e.typ)) s.ereignis = { typ: e.typ, bis: zahl(e.bis, 0, 8e15, 0), laeuse: Array.isArray(e.laeuse) ? e.laeuse.slice(0, 5).map((x) => (x ? 1 : 0)) : [1, 1, 1, 1, 1] };
    const b = raw.beste && typeof raw.beste === 'object' ? raw.beste : {}; s.beste.jagd = Math.round(zahl(b.jagd, 0, 9999, 0));
    const g = raw.gesamt && typeof raw.gesamt === 'object' ? raw.gesamt : {};
    for (const k of Object.keys(s.gesamt)) s.gesamt[k] = Math.round(zahl(g[k], 0, 1e6, 0));
    return s;
  },
  /** Der Zustand (aus dem Speicher geladen, falls noch nicht geschehen) */
  s() {
    if (!Spiel.stand) {
      const roh = typeof Data !== 'undefined' && Data.meta ? Data.meta.spiel : null;
      Spiel.stand = Spiel.saeubern(roh) || Spiel.neu();
      Spiel.tagWechsel(Spiel.stand, Date.now());
    }
    return Spiel.stand;
  },
  _sp: null,
  /** Speichern (kurz verzögert, damit viele Tipps nacheinander nur einmal schreiben) */
  speichern(sofort) {
    clearTimeout(Spiel._sp);
    const tun = async () => {
      const s = Spiel.stand;
      if (!s || typeof Data === 'undefined' || !Data.db) return;
      s.u = Math.max(Date.now(), (s.u || 0) + 1);
      await Data.setMeta('spiel', JSON.parse(JSON.stringify(s)));
      await Data.setMeta('spielU', s.u);
      if (typeof Sync !== 'undefined') await Sync.nachMeta('spiel');
    };
    if (sofort) return tun();
    Spiel._sp = setTimeout(() => { tun().catch((e) => console.error(e)); }, 600);
    return Promise.resolve();
  },
  /** Neu laden (nach Cloud-Abgleich, Wiederherstellen, Löschen) */
  vergessen() { Spiel.stand = null; },

  /* ---------- Zeit ---------- */
  stundeVon(ts) { const d = new Date(ts); return d.getHours() + d.getMinutes() / 60; },
  istNacht(h) { return h >= 22 || h < 7; },
  heute(ts) { return typeof U !== 'undefined' ? U.iso(ts ? new Date(ts) : new Date()) : new Date(ts || Date.now()).toISOString().slice(0, 10); },
  stufeFuer(w) { let n = 0; for (let i = 1; i < Spiel.STUFEN.length; i++) if (w >= Spiel.STUFEN[i]) n = i; return n; },
  klemme(x) { return Math.max(0, Math.min(100, x)); },

  /** Eine Stunde Spielzeit (ts = Mitte der Stunde, bestimmt Tag/Nacht) */
  stunde(s, ts) {
    const nacht = Spiel.istNacht(Spiel.stundeVon(ts)), k = Spiel.klemme;
    s.wasser = k(s.wasser - (nacht ? 2 : 4));
    s.nahrung = k(s.nahrung - (nacht ? .6 : 1.2));
    if (s.lampe) s.licht = k(nacht ? s.licht - 1 : s.licht + 10); else s.licht = k(s.licht - (nacht ? 1 : 3));
    let laune = -1;
    const knapp = (s.wasser < 20 ? 1 : 0) + (s.nahrung < 15 ? 1 : 0) + (!nacht && s.licht < 20 ? 1 : 0);
    laune -= knapp * 1.5;
    if (s.lampe && nacht) laune -= 2.5;
    if (!knapp && !(s.lampe && nacht) && s.wasser > 50 && s.nahrung > 40 && s.licht > 40) laune += .6;
    s.laune = k(s.laune + laune);
    if (s.gekeimt && s.stufe < 5 || (s.gekeimt && s.stufe === 5)) {
      const gut = s.wasser >= 25 && s.nahrung >= 15 && s.licht >= 30 && s.laune >= 20;
      if (gut && s.stufe < 5) {
        s.wachs += s.laune >= 70 ? 1.25 : 1;
        s.stat.n++; s.stat.l += s.licht; s.stat.w += s.wasser; s.stat.d += s.nahrung; s.stat.f += s.laune;
        const neu = Spiel.stufeFuer(s.wachs);
        if (neu > s.stufe) Spiel.stufeHoch(s, neu);
      } else if (s.wasser <= 0 && s.stufe < 5) s.wachs = Math.max(Spiel.STUFEN[s.stufe], s.wachs - .3);
    }
  },
  stufeHoch(s, neu) {
    s.stufe = neu;
    s.tau += 3 + neu * 2;
    if (neu === 5) { s.art = Spiel.bestimme(Spiel.mittel(s)); s.feier = { typ: 'bluete', art: s.art }; }
    else s.feier = { typ: 'stufe', stufe: neu };
  },

  /** Zustand bis `jetzt` nachrechnen. → Anzahl gerechneter Stunden */
  tick(jetzt) {
    const s = Spiel.s();
    jetzt = jetzt || Date.now();
    if (jetzt < s.t) { s.t = jetzt; }
    let n = Math.floor((jetzt - s.t) / 36e5);
    if (n > 96) { s.t = jetzt - 96 * 36e5; n = 96; }
    for (let i = 0; i < n; i++) { Spiel.stunde(s, s.t + 18e5); s.t += 36e5; }
    Spiel.tagWechsel(s, jetzt);
    Spiel.ereignisPruefen(s, jetzt);
    Spiel.echtePflege(s);
    Spiel.aufgabenPruefen(s);
    if (n) Spiel.speichern();
    return n;
  },

  /* ---------- Tagesaufgaben, Serie ---------- */
  AUFGABEN: {
    giessen: { text: 'Gieße deinen Sprouty', ziel: 1, wert: (t) => t.giessen },
    streicheln: { text: 'Streichle ihn dreimal', ziel: 3, wert: (t) => t.streicheln },
    jagd: { text: 'Fang Glühwürmchen', ziel: 1, wert: (t) => t.spiele },
    fakt: { text: 'Lies den Tagesfakt', ziel: 1, wert: (t) => (t.fakt ? 1 : 0) },
    licht: { text: 'Schalte die Lampe um', ziel: 1, wert: (t) => t.licht },
    duengen: { text: 'Gib Nährstoffe', ziel: 1, wert: (t) => t.duengen },
    echt: { text: 'Pflege eine echte Pflanze', ziel: 1, wert: (t) => t.echt },
  },
  hash(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return Math.abs(h); },
  tagWechsel(s, jetzt) {
    const d = Spiel.heute(jetzt);
    if (s.tag && s.tag.d === d) return;
    const hatEcht = typeof Data !== 'undefined' && Data.plants && [...Data.plants.values()].some((p) => p.kind === 'zimmer' && p.status === 'aktiv');
    const pool = Object.keys(Spiel.AUFGABEN).filter((k) => hatEcht || k !== 'echt');
    const h = Spiel.hash(d), q = [];
    for (let i = 0; q.length < 3; i++) { const k = pool[(h + i * 3 + (i * i)) % pool.length]; if (!q.includes(k)) q.push(k); if (i > 40) break; }
    for (const k of pool) { if (q.length >= 3) break; if (!q.includes(k)) q.push(k); }
    s.tag = { d, quests: q, giessen: 0, duengen: 0, streicheln: 0, spiele: 0, licht: 0, echt: 0, fakt: false, besuch: false, ereignisse: 0, belohnt: {} };
  },
  /** Serie fortführen (jede Pflege-Handlung zählt) */
  markiere(s) {
    const d = Spiel.heute(), se = s.serie;
    if (se.letzte === d) return;
    const gestern = typeof U !== 'undefined' ? U.plusTage(d, -1) : new Date(Date.parse(d) - 864e5).toISOString().slice(0, 10);
    se.n = se.letzte === gestern ? se.n + 1 : 1;
    se.letzte = d; se.beste = Math.max(se.beste, se.n);
    const bonus = { 3: 5, 7: 10, 14: 20, 30: 40, 60: 80, 100: 150 }[se.n];
    if (bonus) { s.tau += bonus; Spiel.meldungen.push(se.n + ' Tage in Folge! +' + bonus + ' Tau'); }
  },
  /** Aktuelle Serie (0, wenn gestern keine Pflege war) */
  serieJetzt(s) {
    const d = Spiel.heute(), se = s.serie;
    if (!se.letzte) return 0;
    const gestern = typeof U !== 'undefined' ? U.plusTage(d, -1) : new Date(Date.parse(d) - 864e5).toISOString().slice(0, 10);
    return se.letzte === d || se.letzte === gestern ? se.n : 0;
  },
  aufgabenPruefen(s) {
    const t = s.tag;
    if (!t) return;
    let alle = true;
    for (const k of t.quests) {
      const a = Spiel.AUFGABEN[k];
      if (a.wert(t) >= a.ziel) { if (!t.belohnt[k]) { t.belohnt[k] = true; s.tau += 3; Spiel.meldungen.push('Aufgabe geschafft: ' + a.text + ' +3 Tau'); Spiel.markiere(s); } } else alle = false;
    }
    if (alle && !t.belohnt.alle) { t.belohnt.alle = true; s.tau += 5; Spiel.meldungen.push('Alle Tagesaufgaben erledigt! +5 Tau'); }
  },
  /** Echte Pflege (Gießen/Düngen im Logbuch) bringt Tau: 1 je Eintrag, höchstens 8 am Tag */
  echtePflege(s) {
    if (typeof Data === 'undefined' || !Data.entries || !s.tag) return;
    let n = 0;
    for (const e of Data.entries.values()) if (e.datum === s.tag.d && (e.typ === 'giessen' || e.typ === 'duengen') && (Data.plants.get(e.plantId) || {}).kind === 'zimmer') n++;
    n = Math.min(8, n);
    if (n > s.tag.echt) { const plus = n - s.tag.echt; s.tag.echt = n; s.tau += plus; s.laune = Spiel.klemme(s.laune + plus * 3); Spiel.meldungen.push('Echte Pflege zahlt sich aus: +' + plus + ' Tau'); }
  },

  /* ---------- Besucher ---------- */
  ereignisPruefen(s, jetzt) {
    if (s.ereignis && jetzt > s.ereignis.bis) {
      if (s.ereignis.typ === 'laus' && s.ereignis.laeuse.some((x) => x)) { s.laune = Spiel.klemme(s.laune - 10); Spiel.meldungen.push('Die Läuse haben genascht … Laune −10'); }
      s.ereignis = null;
    }
    if (s.ereignis || !s.tag || s.tag.ereignisse >= 1 || s.stufe < 1) return;
    const h = Spiel.stundeVon(jetzt);
    if (h < 8 || h > 21) return;
    const z = Spiel.hash(s.tag.d + 'e') % 100;
    if (z >= 55) return;
    const typ = z < 28 ? 'laus' : z < 50 ? 'falter' : 'fee';
    s.tag.ereignisse++;
    s.ereignis = { typ, bis: jetzt + 5 * 36e5, laeuse: [1, 1, 1, 1, 1] };
  },

  /* ---------- Aktionen (geben {ok, text, fx} zurück) ---------- */
  giessen() {
    const s = Spiel.s();
    if (s.wasser >= 88) { s.laune = Spiel.klemme(s.laune - 8); Spiel.speichern(); return { ok: false, text: 'Zu viel Wasser! Die Wurzeln mögen keine nassen Füße.', gesicht: 'traurig' }; }
    s.wasser = Spiel.klemme(s.wasser + 55); s.tag.giessen++; s.gesamt.giessen++;
    s.laune = Spiel.klemme(s.laune + 2);
    if (!s.gekeimt) { s.gekeimt = true; if (s.stufe === 0) s.wachs = Math.max(s.wachs, .1); }
    Spiel.markiere(s); Spiel.aufgabenPruefen(s); Spiel.speichern();
    return { ok: true, text: 'Ahh, das tut gut!', fx: 'tropfen' };
  },
  duengen() {
    const s = Spiel.s();
    if (s.nahrung >= 72) { s.laune = Spiel.klemme(s.laune - 8); Spiel.speichern(); return { ok: false, text: 'Das reicht für heute – zu viel Dünger verbrennt die Wurzeln.', gesicht: 'traurig' }; }
    s.nahrung = Spiel.klemme(s.nahrung + 45); s.tag.duengen++; s.gesamt.duengen++;
    s.laune = Spiel.klemme(s.laune + 2);
    Spiel.markiere(s); Spiel.aufgabenPruefen(s); Spiel.speichern();
    return { ok: true, text: 'Mhm, lecker!', fx: 'funken' };
  },
  lampe(an) {
    const s = Spiel.s();
    s.lampe = an == null ? !s.lampe : !!an;
    s.tag.licht++;
    Spiel.markiere(s); Spiel.aufgabenPruefen(s); Spiel.speichern();
    const nacht = Spiel.istNacht(Spiel.stundeVon(Date.now()));
    return { ok: true, text: s.lampe ? (nacht ? 'Hell … mitten in der Nacht?' : 'Es werde Licht!') : (nacht ? 'Gute Nacht …' : 'Pause vom Licht.'), fx: s.lampe ? 'funken' : null };
  },
  streicheln() {
    const s = Spiel.s();
    s.tag.streicheln++; s.gesamt.streicheln++;
    let tau = 0;
    if (s.laune >= 99) { Spiel.aufgabenPruefen(s); Spiel.speichern(); return { ok: true, text: 'Genug gekuschelt – ich platze gleich vor Glück.', fx: 'herzen', tau }; }
    s.laune = Spiel.klemme(s.laune + 7);
    if (s.tag.streicheln % 3 === 0 && s.tag.streicheln <= 9) { s.tau += 1; tau = 1; }
    Spiel.markiere(s); Spiel.aufgabenPruefen(s); Spiel.speichern();
    return { ok: true, text: 'Hihi!', fx: 'herzen', tau };
  },
  /** Ergebnis der Glühwürmchen-Jagd (Punkte): Belohnung für die ersten drei Runden am Tag */
  jagdFertig(punkte) {
    const s = Spiel.s();
    s.tag.spiele++; s.gesamt.jagd++;
    const neuerRekord = punkte > s.beste.jagd; if (neuerRekord) s.beste.jagd = punkte;
    let tau = 0, laune = 0;
    if (s.tag.spiele <= 3) { tau = Math.min(8, Math.floor(punkte / 3)); laune = Math.min(20, Math.max(0, punkte)); s.tau += tau; s.laune = Spiel.klemme(s.laune + laune); }
    Spiel.markiere(s); Spiel.aufgabenPruefen(s); Spiel.speichern();
    return { tau, laune, neuerRekord, belohnt: s.tag.spiele <= 3 };
  },
  /** Ergebnis des Blatt-Memorys (Züge): zählt wie eine Jagd-Runde, die ersten drei am Tag bringen Tau */
  memoryFertig(zuege, paare) {
    const s = Spiel.s();
    s.tag.spiele++;
    const extra = Math.max(0, zuege - paare);
    const punkte = Math.max(2, 12 - extra);
    let tau = 0, laune = 0;
    if (s.tag.spiele <= 3) { tau = Math.min(6, Math.ceil(punkte / 2)); laune = Math.min(15, punkte); s.tau += tau; s.laune = Spiel.klemme(s.laune + laune); }
    Spiel.markiere(s); Spiel.aufgabenPruefen(s); Spiel.speichern();
    return { tau, laune, belohnt: s.tag.spiele <= 3 };
  },
  /** Rang nach Herbarium und Glückssträhne (nichts Gespeichertes, wird immer neu gerechnet) */
  rang(s) {
    const n = Object.keys(s.herbar).length, b = s.serie.beste;
    const R = [[0, 'Samenträger'], [1, 'Grünschnabel'], [3, 'Blattflüsterer'], [5, 'Wurzelkenner'], [8, 'Dschungelwächter'], [10, 'Meistergärtner']];
    let i = 0; for (let k = 0; k < R.length; k++) if (n >= R[k][0] && (k === 0 || b >= k)) i = k;
    return { name: R[i][1], stufe: i, naechst: R[i + 1] ? R[i + 1][1] + ': ' + R[i + 1][0] + ' Pflanzen im Herbarium und ' + (i + 1) + ' Tage Bestmarke' : null };
  },
  fakt() { const s = Spiel.s(); if (!s.tag.fakt) { s.tag.fakt = true; Spiel.aufgabenPruefen(s); Spiel.speichern(); } },
  besuch() {
    const s = Spiel.s();
    if (s.tag.besuch) return false;
    s.tag.besuch = true; s.tau += 3; Spiel.meldungen.push('Schön, dass du da bist! +3 Tau');
    Spiel.speichern();
    return true;
  },
  /** Besucher auf dem Fensterbrett: laus (Index 0–4 wegwischen), falter, fee */
  ereignisTippen(typ, i) {
    const s = Spiel.s(), e = s.ereignis;
    if (!e || e.typ !== typ) return null;
    if (typ === 'laus') {
      if (!e.laeuse[i]) return null;
      e.laeuse[i] = 0;
      if (e.laeuse.some((x) => x)) { Spiel.speichern(); return { fertig: false }; }
      s.ereignis = null; s.tau += 4; s.laune = Spiel.klemme(s.laune + 4); Spiel.markiere(s); Spiel.speichern();
      return { fertig: true, tau: 4, text: 'Alle Läuse weg! +4 Tau' };
    }
    s.ereignis = null;
    const tau = typ === 'fee' ? 8 : 2; s.tau += tau; Spiel.markiere(s); Spiel.speichern();
    return { fertig: true, tau, text: typ === 'fee' ? 'Die Fee hat Tau dagelassen: +8' : 'Der Falter bedankt sich: +2 Tau' };
  },
  umbenennen(name) { const s = Spiel.s(); s.name = (name || '').trim().slice(0, 16) || 'Sprouty'; Spiel.speichern(); },
  /** Blüte pressen: ins Herbarium, neuer Samen */
  ernten(neuerName) {
    const s = Spiel.s();
    if (s.stufe < 5 || !s.art) return null;
    const art = s.art, bekannt = !!s.herbar[art];
    const h = s.herbar[art] || (s.herbar[art] = { n: 0, erst: Spiel.heute() });
    h.n++;
    const a = Spiel.art(art);
    const tau = 25 + (a.stufe === 'legendär' ? 25 : a.stufe === 'selten' ? 10 : 0);
    s.tau += tau; s.gesamt.samen++;
    const alle = Object.keys(s.herbar).length === Spiel.ARTEN.length;
    if (alle && !bekannt) { s.tau += 100; Spiel.meldungen.push('Herbarium komplett! +100 Tau'); }
    const jetzt = Date.now(), neu = Spiel.neu(jetzt);
    for (const k of ['tau', 'deko', 'topf', 'toepfe', 'zub', 'zubBesitz', 'herbar', 'serie', 'tag', 'beste', 'gesamt', 'lampe']) neu[k] = s[k];
    neu.tau = s.tau; neu.name = (neuerName || '').trim().slice(0, 16) || s.name; neu.u = s.u;
    neu.wasser = 40; neu.nahrung = 60; neu.licht = 50; neu.laune = Math.max(60, s.laune);
    Object.assign(s, neu);
    Spiel.markiere(s); Spiel.speichern();
    return { art, neu: !bekannt, tau };
  },
  kaufen(art, id) {
    const s = Spiel.s();
    const liste = art === 'deko' ? Spiel.DEKO : art === 'topf' ? Spiel.TOEPFE : Spiel.ZUBEHOER;
    const it = liste.find((x) => x.id === id);
    const besitz = art === 'deko' ? s.deko.besitz : art === 'topf' ? s.toepfe : s.zubBesitz;
    if (!it || besitz.includes(id)) return { ok: false, text: 'Das hast du schon.' };
    if (s.tau < it.preis) return { ok: false, text: 'Dafür fehlen dir noch ' + (it.preis - s.tau) + ' Tau.' };
    s.tau -= it.preis; besitz.push(id);
    if (art === 'deko') s.deko.platz[it.slot] = id; else if (art === 'topf') s.topf = id; else s.zub = id;
    Spiel.speichern();
    return { ok: true, text: it.name + ' ist da!' };
  },
  /** Besitz aufstellen oder wegräumen */
  stellen(art, id) {
    const s = Spiel.s();
    if (art === 'deko') { const it = Spiel.DEKO.find((x) => x.id === id); if (!it || !s.deko.besitz.includes(id)) return; if (s.deko.platz[it.slot] === id) delete s.deko.platz[it.slot]; else s.deko.platz[it.slot] = id; }
    else if (art === 'topf') { if (s.toepfe.includes(id)) s.topf = id; }
    else if (art === 'zub') { if (!s.zubBesitz.includes(id)) return; s.zub = s.zub === id ? null : id; }
    Spiel.speichern();
  },

  /* ---------- Darstellung: Zustand → Szene ---------- */
  gesicht(s, h, kurz) {
    const nacht = Spiel.istNacht(h);
    if (kurz === 'verliebt') return { augen: 'verliebt', mund: 'offen' };
    if (kurz === 'froh') return { augen: 'froh', mund: 'offen' };
    if (kurz === 'traurig') return { augen: 'traurig', mund: 'traurig' };
    if (nacht && !s.lampe) return { augen: 'schlaf', mund: 'schlaf' };
    if (nacht && s.lampe) return { augen: 'genervt', mund: 'flach' };
    if (s.wasser < 15) return { augen: 'durstig', mund: 'wellig' };
    if (s.laune < 25 || s.nahrung < 8) return { augen: 'traurig', mund: 'traurig' };
    if (s.laune >= 70) return { augen: 'froh', mund: 'laecheln' };
    return { augen: 'normal', mund: s.laune >= 40 ? 'laecheln' : 'flach' };
  },
  /** Wie welk ist die Pflanze (0–1)? */
  welk(s) { return Math.max(0, Math.min(1, ((18 - Math.min(s.wasser, 18)) / 18) * .8 + (s.laune < 20 ? .2 : 0))); },
  /** Zustand für Kunst.Szene.set() */
  szene(s, jetzt, kurz) {
    jetzt = jetzt || Date.now();
    const h = Spiel.stundeVon(jetzt);
    return { stunde: h, lampe: s.lampe, deko: s.deko.platz, topf: s.topf, zub: s.zub, stufe: s.stufe, pal: Spiel.pal(Spiel.neigung(s)), welk: Spiel.welk(s), gesicht: Spiel.gesicht(s, h, kurz), name: s.name, ereignis: s.ereignis };
  },
  /** Fortschritt zur nächsten Stufe 0–1 (bei Blüte 1) */
  fortschritt(s) { if (s.stufe >= 5) return 1; const a = Spiel.STUFEN[s.stufe], b = Spiel.STUFEN[s.stufe + 1]; return Math.max(0, Math.min(1, (s.wachs - a) / (b - a))); },
  /** Braucht der Sprouty gerade Aufmerksamkeit? (Punkt am Tab) */
  braucht(s, jetzt) {
    const h = Spiel.stundeVon(jetzt || Date.now()), nacht = Spiel.istNacht(h);
    if (s.stufe === 5 && s.art) return true;
    if (s.ereignis) return true;
    if (s.wasser < 30 || s.nahrung < 20 || s.laune < 30) return true;
    if (s.lampe && nacht) return true;
    if (!s.lampe && !nacht && s.licht < 40) return true;
    return !!(s.tag && !s.tag.besuch);
  },
  /** Was sagt der Sprouty? Wichtigstes zuerst */
  spruch(s, jetzt) {
    const h = Spiel.stundeVon(jetzt || Date.now()), nacht = Spiel.istNacht(h);
    if (s.stufe === 5 && s.art) return 'Ich blühe! Willst du mich ins Herbarium pressen?';
    if (nacht && !s.lampe) return 'Zzz … schlaf gut …';
    if (nacht && s.lampe) return 'Mach bitte das Licht aus … ich kann nicht schlafen.';
    if (s.ereignis && s.ereignis.typ === 'laus') return 'Da krabbelt etwas auf meinen Blättern!';
    if (s.ereignis && s.ereignis.typ === 'falter') return 'Schau mal, ein Falter ist zu Besuch!';
    if (s.ereignis && s.ereignis.typ === 'fee') return 'Pst … da hinten schimmert etwas.';
    if (!s.gekeimt) return 'Ich bin noch ein Samen. Gießt du mich?';
    if (s.wasser < 25) return 'Ich habe Durst …';
    if (s.nahrung < 20) return 'Mein Bauch knurrt. Ein bisschen Dünger?';
    if (!s.lampe && s.licht < 30) return 'Es ist so dunkel hier. Machst du die Lampe an?';
    if (s.laune < 30) return 'Kuschelst du mit mir? Nur kurz.';
    if (h < 10 && !s.lampe) return 'Guten Morgen! Machst du das Licht an?';
    const lose = ['Ich spüre, wie ich wachse.', 'Hast du heute schon deine echten Pflanzen gegossen?', 'Wusstest du? Pflanzen wachsen auch nachts.', 'Hier ist es gemütlich.', 'Ich träume von Regen.', 'Das Fenster hat heute ein schönes Licht.',
      'Wenn du lächelst, wachse ich schneller. Vielleicht.', 'Psst, die Pilze tuscheln wieder.', 'Danke, dass du dich kümmerst.', 'Ob Wurzeln kitzlig sind?'];
    return lose[Spiel.hash(Spiel.heute() + Math.floor(h / 3)) % lose.length];
  },
};
if (typeof module !== 'undefined') module.exports = Spiel;
//# sourceURL=js/spiel.js
</script>

  /* ---------- Sheet (Formulare, Auswahl) ---------- */
  /** opt: {titel, inhalt: Node, speichern: 'Text'|null, onSpeichern: async()=>false|undefined, extra: [Buttons], onZu} → {zu} */
  sheet(opt) {
    const bg = U.el('div', { class: 'sheet-bg' });

    const schliessen = () => { if (zu) return; zu = true; bg.remove(); if (opt.onZu) opt.onZu(); };

  /** Einfaches Liniendiagramm. punkte: [{x: iso-Datum, y: Zahl}] */
  diagramm(punkte, einheit) {

    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const ya = y0 === y1 ? y0 - 1 : y0 - (y1 - y0) * 0.1, yb = y0 === y1 ? y1 + 1 : y1 + (y1 - y0) * 0.1;
    const X = (v) => L + (x1 === x0 ? (W - L - R) / 2 : ((v - x0) / (x1 - x0)) * (W - L - R));
    const Y = (v) => T + (1 - (v - ya) / (yb - ya)) * (H - T - B);
    const NS = 'http://www.w3.org/2000/svg';
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 ' + W + ' ' + H); s.setAttribute('class', 'diagramm'); s.setAttribute('role', 'img');
    const add = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; s.append(e); return e; };
    for (let i = 0; i <= 2; i++) {
      const v = ya + ((yb - ya) * i) / 2, y = Y(v);
      add('line', { x1: L, x2: W - R, y1: y, y2: y, class: 'gitter-l' });
      add('text', { x: L - 5, y: y + 4, 'text-anchor': 'end' }, U.fmt(v, 0));
    }
    const d = punkte.map((p, i) => (i ? 'L' : 'M') + X(U.num(p.x)).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join('');
    if (punkte.length > 1) add('path', { d: d + 'L' + X(x1).toFixed(1) + ' ' + (H - B) + 'L' + X(x0).toFixed(1) + ' ' + (H - B) + 'Z', class: 'flaeche' });
    add('path', { d, class: 'linie' });
    punkte.forEach((p) => add('circle', { cx: X(U.num(p.x)), cy: Y(p.y), r: 3.6 }));
    add('text', { x: L, y: H - 5, 'text-anchor': 'start' }, U.datum(punkte[0].x, true));
    add('text', { x: W - R, y: H - 5, 'text-anchor': 'end' }, U.datum(punkte[punkte.length - 1].x, true));
    return s;
  },

  /** Tab-Leiste (Segment) → Node; opt: [{id,label}] */
  segment(opt, aktiv, fn) {
    const w = U.el('div', { class: 'segment', role: 'tablist' });
    for (const o of opt) w.append(U.el('button', { class: o.id === aktiv ? 'on' : '', role: 'tab', text: o.label, onclick: () => fn(o.id) }));
    return w;
  },
};

<script>
/* GRUENZEUG – Design: Theme, Hell/Dunkel, Akzentfarbe, Ecken, Schrift, Tab-Leiste, Kachel-Spalten.
   Die Wahl liegt in Einst 'design' (localStorage) und wird als data-Attribute auf <html> gesetzt; die Farben stehen
   in css/style.css. Ein kleines Skript in app.html setzt die Attribute schon vor dem ersten Zeichnen (kein Aufblitzen). */
const Design = {
  STANDARD: { theme: 'feld', modus: 'auto', akzent: 'standard', ecken: 'rund', schrift: 'buch', tabs: 'klassisch', spalten: 2 },
  /* Vorschau-Farben je Theme: [Hintergrund, Karte, Akzent] hell / dunkel */
  THEMES: [
    { id: 'feld', label: 'Feldbuch', t: 'Papierton, Moosgrün', hell: ['#f2eee4', '#fbf9f3', '#2f5a3d'], dunkel: ['#121912', '#1a231c', '#86bb92'] },
    { id: 'dschungel', label: 'Dschungel', t: 'Satt, tiefgrün', hell: ['#e6f2ea', '#f5fbf7', '#0f7a47'], dunkel: ['#0b1a14', '#12261d', '#4fd08a'] },
    { id: 'bluete', label: 'Blüte', t: 'Zart, rosé', hell: ['#fbf0f1', '#fffafa', '#a63d62'], dunkel: ['#1d1318', '#271a21', '#f08aab'] },
    { id: 'ozean', label: 'Ozean', t: 'Kühl, blaugrau', hell: ['#eaf1f6', '#f8fbfd', '#1f6f9c'], dunkel: ['#0d1822', '#14232f', '#5db4e6'] },
    { id: 'zauber', label: 'Zauberwald', t: 'Mintgrün, Gold, verwunschen', hell: ['#eceee6', '#f8f9f2', '#2f6b5a'], dunkel: ['#0e1819', '#152325', '#8fe0c0'] },
    { id: 'tinte', label: 'Tinte', t: 'Schwarz-weiß, klar', hell: ['#f4f4f2', '#ffffff', '#111111'], dunkel: ['#000000', '#111111', '#f2f2f2'] },
  ],
  /* Akzentfarben: Farbton (h) → Farben für Hell und Dunkel werden daraus gerechnet */
  AKZENTE: [
    { id: 'standard', label: 'Passend zum Theme' },
    { id: 'moos', label: 'Moos', h: 140, s: 38 }, { id: 'limette', label: 'Limette', h: 85, s: 55 }, { id: 'gold', label: 'Gold', h: 42, s: 70 },
    { id: 'terrakotta', label: 'Terrakotta', h: 15, s: 62 }, { id: 'beere', label: 'Beere', h: 335, s: 50 }, { id: 'flieder', label: 'Flieder', h: 275, s: 40 },
    { id: 'ozean', label: 'Ozean', h: 205, s: 60 }, { id: 'petrol', label: 'Petrol', h: 180, s: 55 },
  ],
  ECKEN: [['rund', 'Rund'], ['weich', 'Weich'], ['kantig', 'Kantig']],
  SCHRIFTEN: [['buch', 'Buch'], ['sans', 'Modern'], ['rund', 'Rund'], ['mono', 'Mono']],
  TABS: [['klassisch', 'Klassisch'], ['schwebend', 'Schwebend'], ['kompakt', 'Nur Symbole']],

  get() {
    const g = Einst.get('design', {});
    const d = Object.assign({}, Design.STANDARD);
    for (const k in d) if (g && g[k] != null && typeof g[k] === typeof d[k]) d[k] = g[k];
    return d;
  },
  setzen(k, v) {
    const d = Design.get(); d[k] = v;
    Einst.set('design', d);
    Design.anwenden();
  },
  dunkel(d) { d = d || Design.get(); return d.modus === 'dunkel' || (d.modus === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); },

  anwenden() {
    const d = Design.get(), r = document.documentElement, dunkel = Design.dunkel(d);
    const attr = (k, v, aus) => { if (v === aus) r.removeAttribute('data-' + k); else r.setAttribute('data-' + k, v); };
    attr('theme', d.theme, 'feld'); attr('ecken', d.ecken, 'rund'); attr('schrift', d.schrift, 'buch'); attr('tabs', d.tabs, 'klassisch');
    if (dunkel) r.setAttribute('data-mode', 'dark'); else r.removeAttribute('data-mode');
    r.style.setProperty('--spalten', String(d.spalten));
    const a = Design.AKZENTE.find((x) => x.id === d.akzent);
    for (const v of ['--accent', '--accent-text', '--accent-bg', '--on-accent']) r.style.removeProperty(v);
    if (a && a.h != null) {
      const hsl = (h, s, l) => 'hsl(' + h + ' ' + s + '% ' + l + '%)';
      if (dunkel) {
        r.style.setProperty('--accent', hsl(a.h, Math.min(a.s + 10, 70), 66)); r.style.setProperty('--accent-text', hsl(a.h, Math.min(a.s + 12, 75), 74));
        r.style.setProperty('--accent-bg', hsl(a.h, 28, 19)); r.style.setProperty('--on-accent', hsl(a.h, 40, 9));
      } else {
        r.style.setProperty('--accent', hsl(a.h, a.s, 30)); r.style.setProperty('--accent-text', hsl(a.h, a.s, 28));
        r.style.setProperty('--accent-bg', hsl(a.h, 38, 91)); r.style.setProperty('--on-accent', '#fff');
      }
    }
    const meta = document.getElementById('themeColor');
    if (meta) meta.setAttribute('content', getComputedStyle(r).getPropertyValue('--bg').trim() || '#f2eee4');
  },
  init() {
    Design.anwenden();
    if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (Design.get().modus === 'auto') Design.anwenden(); });
  },

  /** Seite „Design“ (Mehr → Design) */
  seite() {
    const d = Design.get(), dunkel = Design.dunkel(d);
    const w = U.el('div');
    const aendern = (k, v) => { Design.setzen(k, v); App.neu(); };
    const auswahl = (opt, aktiv, k) => App.segment(opt.map(([id, label]) => ({ id, label })), aktiv, (id) => aendern(k, id));

    // Vorschau
    const vor = U.el('div', { class: 'card', style: { marginTop: '4px' } },
      U.el('div', { class: 'etikett', text: 'Vorschau' }),
      U.el('h3', { text: 'Monstera Albo', style: { marginTop: '4px' } }),
      U.el('div', { class: 'pillen', style: { marginBottom: '12px' } }, App.pille('Sammlerstück', 'sun', 'stern'), App.pille('Wohnzimmer', 'grau'), App.pille('Gießen', 'clay', 'tropfen')),
      U.el('div', { class: 'btnreihe' }, U.el('button', { class: 'btn' }, App.icon('tropfen'), 'Gegossen'), U.el('button', { class: 'btn sekundaer', text: 'Foto' })),
      U.el('div', { class: 'chips', style: { marginTop: '12px', paddingBottom: 0 } }, U.el('span', { class: 'chip on', text: 'Alle' }), U.el('span', { class: 'chip', text: 'Raritäten' }), U.el('span', { class: 'chip', text: 'Favoriten' })));
    w.append(vor);

    // Theme
    w.append(App.abschnitt('Theme'));
    const th = U.el('div', { class: 'themen' });
    for (const t of Design.THEMES) {
      const f = dunkel ? t.dunkel : t.hell;
      const k = U.el('button', { class: 'thema' + (d.theme === t.id ? ' an' : ''), 'aria-pressed': d.theme === t.id ? 'true' : 'false', onclick: () => aendern('theme', t.id) },
        U.el('span', { class: 'probe', style: { background: f[0] } }, U.el('i', { style: { background: f[1] } }), U.el('b', { style: { background: f[2] } })),
        U.el('span', { class: 'n', text: t.label }), U.el('span', { class: 'b', text: t.t }));
      th.append(k);
    }
    w.append(th);

    w.append(App.abschnitt('Hell oder dunkel'), auswahl([['auto', 'Wie das Gerät'], ['hell', 'Hell'], ['dunkel', 'Dunkel']], d.modus, 'modus'));

    // Akzent
    w.append(App.abschnitt('Akzentfarbe'));
    const ak = U.el('div', { class: 'akzente' });
    for (const a of Design.AKZENTE) {
      const farbe = a.h == null ? 'conic-gradient(#2f5a3d, #1f6f9c, #a63d62, #b98a1f, #2f5a3d)' : 'hsl(' + a.h + ' ' + a.s + '% ' + (dunkel ? 62 : 36) + '%)';
      ak.append(U.el('button', { class: 'akzent' + (d.akzent === a.id ? ' an' : ''), 'aria-label': a.label, 'aria-pressed': d.akzent === a.id ? 'true' : 'false', title: a.label, style: { background: farbe }, onclick: () => aendern('akzent', a.id) }, d.akzent === a.id ? App.icon('haken') : null));
    }
    w.append(ak, U.el('p', { class: 'hinweis', text: (Design.AKZENTE.find((a) => a.id === d.akzent) || {}).label || '' }));

    w.append(App.abschnitt('Formen'), auswahl(Design.ECKEN, d.ecken, 'ecken'));
    w.append(App.abschnitt('Schrift'), auswahl(Design.SCHRIFTEN, d.schrift, 'schrift'));
    w.append(App.abschnitt('Menüleiste'), auswahl(Design.TABS, d.tabs, 'tabs'));
    w.append(App.abschnitt('Sammlung'), App.segment([{ id: 2, label: '2 Spalten' }, { id: 3, label: '3 Spalten (klein)' }], d.spalten, (n) => aendern('spalten', n)));

    w.append(U.el('div', { style: { marginTop: '22px' } }, U.el('button', { class: 'btn ghost voll', text: 'Auf Standard zurücksetzen', onclick: () => { Einst.del('design'); Design.anwenden(); App.neu(); App.toast('Standard-Design'); } })));
    return { titel: 'Design', sub: 'So soll es aussehen', zurueck: true, inhalt: w };
  },
};
if (typeof document !== 'undefined') Design.init();

<script>
/* GRUENZEUG – Formulare: Feld-Bausteine (F), Pflege-Rechnung (Pflege), Pflanzen- und Eintragsformulare (Formen). */
const F = {
  _feld(label, kind, ...inh) { return U.el('div', { class: 'feld' }, label ? U.el('label', null, label) : null, ...inh); },
  text(label, wert, o) {
    o = o || {};
    const i = o.mehrzeilig ? U.el('textarea', { rows: o.zeilen || 3, placeholder: o.platz || '' }) : U.el('input', { type: o.typ || 'text', placeholder: o.platz || '', autocomplete: 'off', inputmode: o.inputmode || null, list: o.liste || null });
    i.value = wert == null ? '' : wert;
    return { el: F._feld(label, 'text', i), input: i, wert: () => i.value.trim() };
  },
  zahl(label, wert, einheit, o) {
    const i = U.el('input', { type: 'text', inputmode: 'decimal', placeholder: (o && o.platz) || '', autocomplete: 'off' });
    i.value = wert == null ? '' : String(wert).replace('.', ',');
    const el = F._feld(label, 'zahl', einheit ? U.el('div', { class: 'mit-einheit' }, i, U.el('span', { class: 'einheit', text: einheit })) : i);
    return { el, input: i, wert: () => U.zahl(i.value) };
  },
  datum(label, wert) {
    const i = U.el('input', { type: 'date', max: '2100-01-01' });
    i.value = wert || '';
    return { el: F._feld(label, 'datum', i), input: i, wert: () => i.value || null };
  },
  /** Einzelauswahl als Chips. opt: ['A','B'] */
  wahl(label, opt, wert, o) {
    let aktuell = wert == null ? null : wert;
    const w = U.el('div', { class: 'wahlliste' });
    const upd = () => [...w.children].forEach((b, i) => b.classList.toggle('on', opt[i] === aktuell));
    opt.forEach((x) => w.append(U.el('button', { type: 'button', class: 'chip', text: x, onclick: () => { aktuell = aktuell === x && !(o && o.pflicht) ? null : x; upd(); } })));
    upd();
    return { el: F._feld(label, 'wahl', w), wert: () => aktuell, setze: (v) => { aktuell = v; upd(); } };
  },
  /** Fotos wählen. Neue Fotos landen sofort in der Datenbank; bei Abbruch werden sie wieder entfernt. */
  fotos(start, o) {
    o = o || {};
    let ids = (start || []).slice();
    const neue = [];
    const leiste = U.el('div', { class: 'fotoleiste' });
    const datei = U.el('input', { type: 'file', accept: 'image/*', class: 'verb' });
    if (!o.einzeln) datei.multiple = true;
    const zeichne = () => {
      leiste.replaceChildren();
      ids.forEach((id) => {
        leiste.append(U.el('div', { class: 'f' }, App.bild(id, true), U.el('button', { type: 'button', 'aria-label': 'Foto entfernen', onclick: () => { ids = ids.filter((x) => x !== id); zeichne(); } }, App.icon('x'))));
      });
      if (!(o.einzeln && ids.length)) leiste.append(U.el('button', { type: 'button', class: 'neu', 'aria-label': 'Foto hinzufügen', onclick: () => datei.click() }, App.icon('kamera')));
    };
    datei.onchange = async () => {
      const dateien = [...datei.files];
      datei.value = '';
      for (const f of dateien) {
        try { const id = await Data.addFoto(f); ids.push(id); neue.push(id); zeichne(); }
        catch (e) { App.toast('Foto nicht lesbar: ' + (e && e.message || 'unbekanntes Format')); }
      }
    };
    zeichne();
    return {
      el: F._feld(o.label === undefined ? 'Fotos' : o.label, 'fotos', leiste, datei),
      ids: () => ids.slice(),
      /** Nach Abbruch: nicht übernommene neue Fotos löschen */
      verwerfen: async () => { for (const id of neue) if (!Data.benutzteFotos().has(id)) await Data.delFoto(id); },
      /** Nach Speichern: entfernte, bisher gespeicherte Fotos löschen, wenn niemand sie mehr braucht */
      aufraeumen: async () => { for (const id of (start || [])) if (!ids.includes(id) && !Data.benutzteFotos().has(id)) await Data.delFoto(id); },
    };
  },
  /** Art aus dem Lexikon wählen oder frei tippen. → {el, wert(): {artId, art}} */
  art(startArtId, startText, onWahl) {
    let artId = startArtId || null;
    const i = U.el('input', { type: 'text', placeholder: 'Art suchen oder selbst eintragen', autocomplete: 'off' });
    i.value = startText || '';
    const liste = U.el('div', { class: 'treffer', style: { display: 'none' } });
    const hinweis = U.el('div', { class: 'hinweis' });
    const zeigeHinweis = () => { hinweis.replaceChildren(); const a = artId && Gruen.artById(artId); if (a) hinweis.append(App.icon('haken', 14), ' Mit dem Lexikon verknüpft: ', a.name); };
    i.addEventListener('input', () => {
      artId = null; zeigeHinweis();
      const q = i.value.trim();
      liste.replaceChildren();
      if (q.length < 2) { liste.style.display = 'none'; return; }
      const t = Gruen.arten.filter((a) => U.trifft(a.name + ' ' + a.latein + ' ' + (a.alias || []).join(' '), q)).slice(0, 8);
      t.forEach((a) => liste.append(U.el('button', { type: 'button', onclick: () => { artId = a.id; i.value = a.name; liste.style.display = 'none'; zeigeHinweis(); if (onWahl) onWahl(a); } }, a.name, U.el('small', { text: a.latein }))));
      liste.style.display = t.length ? '' : 'none';
    });
    zeigeHinweis();
    return { el: F._feld('Art', 'art', i, liste, hinweis), wert: () => ({ artId, art: i.value.trim() }) };
  },
};

/** Pflege-Rechnung: wann ist Gießen/Düngen wieder dran? */
const Pflege = {
  /** typ 'giessen' | 'duengen' → {letzte, faellig, in} oder null ohne Intervall. in < 0 = überfällig */
  naechste(p, typ) {
    const iv = typ === 'giessen' ? p.giessTage : p.duengerTage;
    if (!iv || p.status !== 'aktiv') return null;
    const l = Data.letzter(p.id, typ);
    const start = l ? l.datum : (p.erworben && p.erworben <= U.heute() ? p.erworben : U.iso(new Date(p.erstellt || Date.now())));
    const faellig = U.plusTage(start, iv);
    return { letzte: l ? l.datum : null, faellig, in: U.tageZwischen(U.heute(), faellig) };
  },
  text(n) {
    if (!n) return '';
    if (n.in < 0) return 'seit ' + U.plural(-n.in, 'Tag', 'Tagen') + ' überfällig';
    if (n.in === 0) return 'heute fällig';
    if (n.in === 1) return 'morgen fällig';
    return 'in ' + n.in + ' Tagen';
  },
  async schnell(p, typ, datum) {
    const e = Data.neuerEintrag(p.id, typ, { datum: datum || U.heute() });
    await Data.saveEntry(e);
    App.toast(typ === 'giessen' ? p.name + ' gegossen' : p.name + ' gedüngt', 5000, { text: 'Rückgängig', fn: async () => { await Data.delEntry(e.id); App.neu(); } });
    return e;
  },
  phase(p) {
    const e = Data.letzter(p.id, 'phase');
    return e && e.werte && e.werte.phase ? e.werte.phase : null;
  },
};

const Formen = {
  /** Auswahl der Eintragsart → Formular. nachher() wird nach dem Speichern aufgerufen. */
  eintragWaehlen(p, nachher) {
    const typen = Gruen.KINDER[p.kind].typen;
    const raster = U.el('div', { class: 'typen' });
    let s;
    for (const k in typen) raster.append(U.el('button', { onclick: () => { s.zu(); Formen.eintrag(p, k, null, nachher); } }, App.icon(typen[k].icon), typen[k].label));
    s = App.sheet({ titel: 'Neuer Eintrag', inhalt: raster });
  },

  eintrag(p, typ, e, nachher) {
    const def = Gruen.KINDER[p.kind].typen[typ];
    const neu = !e;
    e = e || Data.neuerEintrag(p.id, typ);
    const datum = F.datum('Datum', e.datum);
    const felder = (def.felder || []).map((f) => {
      const w = e.werte ? e.werte[f.k] : null;
      return f.typ === 'zahl' ? F.zahl(f.label, w, f.einheit) : f.typ === 'wahl' ? F.wahl(f.label, f.opt, w, { pflicht: true }) : F.text(f.label, w, { platz: f.platz });
    });
    const text = F.text(typ === 'foto' ? 'Beschreibung' : 'Notiz', e.text, { mehrzeilig: true, zeilen: 3, platz: typ === 'notiz' ? 'Was ist dir aufgefallen?' : 'optional' });
    const fotos = F.fotos(e.fotos);
    const inh = U.el('div');
    const zweiSpaltig = (def.felder || []).length > 1 && (def.felder || []).every((f) => f.typ === 'zahl');
    if (zweiSpaltig) {
      inh.append(datum.el, U.el('div', { class: (def.felder.length >= 3 ? 'drei' : 'zwei') }, felder.map((f) => f.el)));
    } else inh.append(datum.el, felder.map((f) => f.el));
    inh.append(text.el, fotos.el);
    const knoepfe = [];
    if (!neu) {
      knoepfe.push(U.el('button', { class: 'btn gefahr', text: 'Löschen', onclick: async () => {
        if (await App.bestaetigen('Eintrag löschen?', 'Der Eintrag und seine Fotos werden entfernt.', { ok: 'Löschen', gefahr: true })) {
          s.zu(); await Data.delEntry(e.id); App.toast('Gelöscht'); if (nachher) nachher(); else App.neu();
        }
      } }));
    }
    const s = App.sheet({
      titel: def.label, inhalt: inh, extra: knoepfe, speichern: neu ? 'Speichern' : 'Übernehmen',
      onSpeichern: async () => {
        if (typ === 'foto' && !fotos.ids().length && !text.wert()) { App.toast('Bitte ein Foto oder Text hinzufügen'); return false; }
        if (!datum.wert()) { App.toast('Bitte ein Datum wählen'); return false; }
        e.datum = datum.wert(); e.text = text.wert(); e.fotos = fotos.ids();
        e.werte = {};
        (def.felder || []).forEach((f, i) => { const v = felder[i].wert(); if (v != null && v !== '') e.werte[f.k] = v; });
        await Data.saveEntry(e);
        await fotos.aufraeumen();
        if (nachher) nachher(e); else App.neu();
      },
      onZu: () => fotos.verwerfen(),
    });
  },

  /** Pflanze anlegen oder bearbeiten. vorgabe: {artId, art, name} aus dem Lexikon */
  pflanze(kind, p, nachher, vorgabe) {
    const neu = !p;
    vorgabe = vorgabe || {};
    p = p || Data.neuePflanze(kind, vorgabe);
    const cfg = Gruen.KINDER[p.kind];
    const name = F.text('Name', p.name, { platz: p.kind === 'cannabis' ? 'z. B. Nr. 1, Lady in Green' : 'z. B. Monty, Monstera Nr. 2' });
    const intervalle = [];
    const giess = F.zahl('Gießen alle', p.giessTage, 'Tage', { platz: 'z. B. 7' });
    const duenger = F.zahl('Düngen alle', p.duengerTage, 'Tage', { platz: 'optional' });
    const art = p.kind === 'cannabis' ? null : F.art(p.artId, p.art, (a) => { if (giess.wert() == null && a.giessTage) giess.input.value = String(a.giessTage); if (!name.wert()) name.input.value = a.name; });
    const ort = F.text('Standort', p.standort, { platz: 'z. B. Wohnzimmer, Fenster Süd', liste: 'gz-orte' });
    const orte = U.el('datalist', { id: 'gz-orte' });
    [...new Set([...Gruen.ORTE, ...[...Data.plants.values()].map((x) => x.standort).filter(Boolean)])].forEach((o) => orte.append(U.el('option', { value: o })));
    const erworben = F.datum(p.kind === 'cannabis' ? 'Start (Keimung)' : 'Erworben am', p.erworben);
    const quelle = F.text('Woher', p.quelle, { platz: 'Shop, Tauschbörse, Geschenk …' });
    const preis = F.zahl('Preis', p.preis, '€');
    const notiz = F.text('Notizen', p.notiz, { mehrzeilig: true, platz: 'Besonderheiten, Geschichte, Wünsche …' });
    const foto = neu ? F.fotos([], { einzeln: true, label: 'Erstes Foto' }) : null;
    let sorte, typ, medium, phase;
    if (p.kind === 'cannabis') {
      sorte = F.text('Sorte', p.sorte, { platz: 'Name / Genetik' });
      typ = F.wahl('Typ', ['Photoperiodisch', 'Autoflower', 'Unbekannt'], p.typ);
      medium = F.wahl('Medium', ['Erde', 'Coco', 'Hydro', 'Sonstiges'], p.medium);
      phase = neu ? F.wahl('Aktuelle Phase', Gruen.PHASEN.slice(0, 5), 'Keimung', { pflicht: true }) : null;
    }
    const inh = U.el('div');

    if (marken.children.length) k.append(marken);
    if (p.favorit) k.append(U.el('span', { class: 'herz' }, App.icon('herz')));
    const unter = p.kind === 'cannabis' ? [p.sorte, p.erworben ? 'Tag ' + (U.tageZwischen(p.erworben, U.heute()) + 1) : ''].filter(Boolean).join(' · ') : (p.art || p.standort || '');
    k.append(U.el('div', { class: 'info' }, U.el('span', { class: 'name', text: p.name }), U.el('span', { class: 'art' + (p.kind === 'cannabis' ? '' : ' latein'), text: unter || ' ' })));
    return k;
  },

  seite(kind) {
    const z = Sammlung.zustand[kind];
    const cfg = Gruen.KINDER[kind];
    const alle = Data.liste(kind);
    const w = U.el('div');
    const si = U.el('input', { type: 'search', placeholder: 'Suchen …', 'aria-label': 'Suchen', value: z.q, autocomplete: 'off' });
    const chips = U.el('div', { class: 'chips', role: 'toolbar' });
    const raster = U.el('div');
    const zeichne = () => {
      let l = alle.filter((p) => (z.f === 'archiv' ? p.status !== 'aktiv' : p.status === 'aktiv'));
      if (z.f === 'favoriten') l = l.filter((p) => p.favorit);
      if (z.f.startsWith('ort:')) l = l.filter((p) => p.standort === z.f.slice(4));
      if (z.f === 'faellig') l = l.filter((p) => { const n = Pflege.naechste(p, 'giessen'); return n && n.in <= 0; });
      if (z.q) l = l.filter((p) => U.trifft([p.name, p.art, p.standort, p.sorte, p.quelle, p.notiz].join(' '), z.q));
      Sammlung.sortieren(l, Einst.get('sort', 'name'));
      raster.replaceChildren();
      if (!l.length) {
        raster.append(alle.length
          ? App.leer('suche', 'Nichts gefunden', z.f === 'archiv' ? 'Hier landen verkaufte oder eingegangene Pflanzen.' : 'Andere Suche oder anderer Filter?')
          : App.leer('sammlung', 'Noch keine Pflanze', kind === 'cannabis' ? 'Lege deine erste Pflanze im Grow-Logbuch an.' : 'Tippe auf +, um deine erste Pflanze zu dokumentieren.'));
        return;
      }
      const g = U.el('div', { class: 'gitter' });
      l.forEach((p) => g.append(Sammlung.kachel(p)));
      raster.append(U.el('div', { class: 'muted klein', style: { margin: '2px 2px 8px' }, text: U.plural(l.length, 'Pflanze', 'Pflanzen') }), g);
    };
    const filter = [{ id: 'alle', l: 'Alle' }, { id: 'favoriten', l: 'Favoriten' }];
    if (kind === 'zimmer') filter.push({ id: 'faellig', l: 'Gießen fällig' });
    const orte = [...new Set(alle.filter((p) => p.status === 'aktiv' && p.standort).map((p) => p.standort))].sort((a, b) => a.localeCompare(b, 'de'));
    if (orte.length > 1) orte.forEach((o) => filter.push({ id: 'ort:' + o, l: o }));
    filter.push({ id: 'archiv', l: 'Archiv' });
    const zeichneChips = () => { chips.replaceChildren(...filter.map((f) => U.el('button', { class: 'chip' + (z.f === f.id ? ' on' : ''), text: f.l, onclick: () => { z.f = f.id; zeichneChips(); zeichne(); } }))); };
    si.addEventListener('input', () => { z.q = si.value; zeichne(); });
    if (kind === 'cannabis') w.append(Privat.hinweis(alle));
    w.append(U.el('div', { class: 'suche' }, App.icon('suche'), si), chips, raster);
    if (kind === 'cannabis') {
      const t = Gruen.wissen.filter((x) => x.privat);
      if (t.length) w.append(App.abschnitt('Grow-Wissen'), U.el('div', { class: 'card flach' }, t.map((x) => App.zeile(x.titel, x.kurz, x.icon || 'wissen', () => App.oeffne(() => Wissen.thema(x.id))))));
    }
    zeichneChips(); zeichne();
    return {
      privat: kind === 'cannabis',
      titel: kind === 'cannabis' ? 'Grow-Logbuch' : 'Meine Sammlung', sub: alle.filter((p) => p.status === 'aktiv').length + ' aktiv',
      inhalt: w,
      aktionen: [{ icon: 'filter', label: 'Sortieren', fn: Sammlung.sortWahl }, ...(kind === 'cannabis' ? [{ icon: 'schloss', label: 'Sperren', fn: () => Privat.sperren() }] : [])],
      fab: { label: 'Neue Pflanze', fn: () => Formen.pflanze(kind, null, (p) => App.oeffne(() => Detail.seite(p.id))) },
      ohneTab: false,
    };
  },

  sortWahl() {
    const opt = [['name', 'Name A–Z'], ['neu', 'Zuletzt hinzugefügt'], ['alt', 'Älteste zuerst'], ['ort', 'Nach Standort']];
    const l = U.el('div', { class: 'card flach' });
    let s;
    opt.forEach(([k, t]) => l.append(U.el('button', { class: 'zeile', onclick: () => { Einst.set('sort', k); s.zu(); App.neu(); } }, U.el('div', { class: 't' }, U.el('b', { text: t })), Einst.get('sort', 'name') === k ? App.icon('haken') : null)));
    s = App.sheet({ titel: 'Sortieren', inhalt: l });
  },
};

App.tabBauer.heute = () => Heute.seite();
App.tabBauer.sammlung = () => Sammlung.seite('zimmer');
