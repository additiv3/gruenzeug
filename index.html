</script>
<script>
/* GRUENZEUG – Pflanzen-Detailseite: Kopf, Schnellaktionen, Pflege, Wachstum, Vorher/Nachher, Steckbrief, Galerie, Verlauf. */
const Detail = {
  zeigeAlle: false,

  /** Alle Fotos einer Pflanze, neueste zuerst: [{id, datum, text}] */
  fotos(p) {
    const out = [], gesehen = new Set();
    for (const e of Data.eintraege(p.id)) for (const f of e.fotos || []) if (!gesehen.has(f)) { gesehen.add(f); out.push({ id: f, datum: e.datum, text: e.text }); }
    if (p.titelFoto && !gesehen.has(p.titelFoto)) out.push({ id: p.titelFoto, datum: p.erworben || U.iso(new Date(p.erstellt)), text: '' });
    return out;
  },

  seite(id) {
    const p = Data.plants.get(id);
    if (!p) return { titel: 'Nicht gefunden', zurueck: true, inhalt: App.leer('info', 'Diese Pflanze gibt es nicht mehr', '') };
    const cfg = Gruen.KINDER[p.kind];
    const art = p.artId ? Gruen.artById(p.artId) : null;
    const eintraege = Data.eintraege(p.id);
    const fotos = Detail.fotos(p);
    const neu = () => App.neu();
    const w = U.el('div');

    /* Kopfbild */
    const hero = U.el('div', { class: 'hero' }, U.el('div', { class: 'verlauf' }));
    hero.prepend(App.titelbild(p, false));
    if (fotos.length) hero.firstChild.style.cursor = 'zoom-in';
    if (!p.titelFoto && art && Gruen.bild(art.id) && p.kind !== 'cannabis') hero.append(U.el('span', { class: 'bsp-tag', text: 'Beispielfoto' }));
    hero.addEventListener('click', (ev) => { if (!ev.target.closest('.foto-knopf') && fotos.length) Detail.lupe(p, fotos, 0); });
    hero.append(U.el('button', { class: 'foto-knopf', onclick: () => Detail.schnellFoto(p) }, App.icon('kamera'), fotos.length ? 'Foto hinzufügen' : 'Erstes Foto'));
    w.append(hero);

    /* Name und Eckdaten */
    const pillen = U.el('div', { class: 'pillen', style: { marginTop: '10px' } });
    if (p.kind === 'cannabis') {
      const ph = Pflege.phase(p);
      if (ph) pillen.append(App.pille(ph, 'clay', 'stern'));
      if (p.erworben) pillen.append(App.pille('Tag ' + (U.tageZwischen(p.erworben, U.heute()) + 1) + ' · Woche ' + (Math.floor(U.tageZwischen(p.erworben, U.heute()) / 7) + 1)));
    } else if (p.erworben) pillen.append(App.pille('seit ' + U.alter(p.erworben), '', 'heute'));
    if (p.standort) pillen.append(App.pille(p.standort, 'grau'));
    if (p.status !== 'aktiv') pillen.append(App.pille(Gruen.STATUS[p.status] || p.status, 'rot'));
    if (art && art.selten >= 3) pillen.append(App.pille(Gruen.SELTEN[art.selten], 'sun', 'stern'));
    w.append(U.el('div', { class: 'kopf' }, U.el('h1', { text: p.name }), p.kind === 'cannabis' ? (p.sorte ? U.el('div', { class: 'muted', text: [p.sorte, p.typ, p.medium].filter(Boolean).join(' · ') }) : null) : (p.art ? U.el('div', { class: 'latein', text: p.art }) : null), pillen));

    /* Schnellaktionen */
    const gn = Pflege.naechste(p, 'giessen');
    const schnell = U.el('div', { class: 'schnell' });
    schnell.append(U.el('button', { class: gn && gn.in <= 0 ? 'klar' : '', onclick: async () => { if (p.kind === 'cannabis') Formen.eintrag(p, 'giessen', null, neu); else { await Pflege.schnell(p, 'giessen'); neu(); } } },
      App.icon('tropfen'), 'Gegossen', gn ? U.el('span', { class: 'muted', style: { fontWeight: 600, fontSize: '11.5px' }, text: Pflege.text(gn) }) : null));
    schnell.append(U.el('button', { onclick: () => Detail.schnellFoto(p) }, App.icon('kamera'), 'Foto'));
    schnell.append(U.el('button', { onclick: () => Formen.eintragWaehlen(p, neu) }, App.icon('plus'), 'Eintrag'));
    if (p.status === 'aktiv') w.append(schnell);

    /* Cannabis: Phasen und Kennzahlen */
    if (p.kind === 'cannabis') w.append(Detail.cannabisKarte(p, eintraege));

    /* Pflege-Rhythmus */
    if (p.kind === 'zimmer') {
      const dn = Pflege.naechste(p, 'duengen');
      if (gn || dn) {
        const f = U.el('div', { class: 'fakten' });
        if (gn) f.append(U.el('div', null, U.el('dt', { text: 'Gießen alle ' + p.giessTage + ' Tage' }), U.el('dd', { text: Pflege.text(gn) + (gn.letzte ? ' · zuletzt ' + U.rel(gn.letzte) : '') })));
        if (dn) f.append(U.el('div', null, U.el('dt', { text: 'Düngen alle ' + p.duengerTage + ' Tage' }), U.el('dd', { text: Pflege.text(dn) + (dn.letzte ? ' · zuletzt ' + U.rel(dn.letzte) : '') })));
        if (!gn || !dn) f.lastChild.classList.add('breit');
        w.append(App.abschnitt('Pflege'), f);
      }
    }

    /* Wachstum */
    const [ht, hk] = cfg.hoehe;
    const punkte = eintraege.filter((e) => e.typ === ht && e.werte && e.werte[hk] != null).map((e) => ({ x: e.datum, y: e.werte[hk] })).sort((a, b) => (a.x < b.x ? -1 : 1));
    if (punkte.length >= 2) {
      const d = punkte[punkte.length - 1].y - punkte[0].y;
      w.append(App.abschnitt('Wachstum'), U.el('div', { class: 'card' }, App.diagramm(punkte, 'cm'), U.el('div', { class: 'muted klein', style: { marginTop: '6px' }, text: (d >= 0 ? '+' : '') + U.fmt(d) + ' cm seit ' + U.datum(punkte[0].x) })));
    }

    /* Vorher / Nachher */
    if (fotos.length >= 2) {
      const aeltest = fotos[fotos.length - 1], neuest = fotos[0];
      w.append(App.abschnitt('Vorher / Nachher'), Detail.vergleich(aeltest, neuest));
    }

    /* Steckbrief */
    w.append(App.abschnitt('Steckbrief', { text: 'Bearbeiten', fn: () => Formen.pflanze(p.kind, p, neu) }), Detail.steckbrief(p, art, neu));

    /* Lexikon-Hinweis */
    if (art) {
      w.append(U.el('div', { class: 'card flach', style: { marginTop: '12px' } },
        U.el('div', { style: { padding: '14px 14px 4px' } }, U.el('div', { class: 'etikett', text: 'Aus dem Lexikon' }), U.el('p', { style: { margin: '6px 0 2px' }, text: art.kurz })),
        U.el('div', { class: 'fakten', style: { margin: '10px 14px 0', fontSize: '14px' } },
          U.el('div', null, U.el('dt', { text: 'Licht' }), U.el('dd', { text: art.licht })), U.el('div', null, U.el('dt', { text: 'Wasser' }), U.el('dd', { text: art.wasser }))),
        U.el('button', { class: 'zeile', onclick: () => App.oeffne(() => Lexikon.detail(art.id)) }, U.el('div', { class: 't' }, U.el('b', { text: 'Alles über ' + art.name })), (() => { const i = App.icon('weiter'); i.setAttribute('class', 'pfeil'); return i; })())));
    }

    /* Galerie */
    if (fotos.length) {
      const g = U.el('div', { class: 'galerie' });
      fotos.slice(0, 9).forEach((f, i) => g.append(U.el('button', { 'aria-label': 'Foto ansehen', onclick: () => Detail.lupe(p, fotos, i) }, App.bild(f.id, true))));
      w.append(App.abschnitt('Fotos (' + fotos.length + ')', fotos.length > 9 ? { text: 'Alle', fn: () => Detail.lupe(p, fotos, 0) } : null), g);
    }

    /* Verlauf */
    w.append(App.abschnitt('Verlauf', { text: '+ Eintrag', fn: () => Formen.eintragWaehlen(p, neu) }), Detail.verlauf(p, eintraege, neu));

    return {
      titel: '', kleinTitel: true, ohneTab: true, zurueck: true, privat: p.kind === 'cannabis', inhalt: w,
      aktionen: [{ icon: 'herz', label: p.favorit ? 'Favorit entfernen' : 'Favorit', fn: async () => { p.favorit = !p.favorit; await Data.savePlant(p); neu(); } }, { icon: 'mehr', label: 'Menü', fn: () => Detail.menue(p) }],
    };
  },

  async schnellFoto(p) {
    const f = Formen.schnellFotoEingabe || (Formen.schnellFotoEingabe = U.el('input', { type: 'file', accept: 'image/*', multiple: true, class: 'verb' }));
    document.body.append(f);
    f.onchange = async () => {
      const dateien = [...f.files]; f.value = ''; f.remove();
      if (!dateien.length) return;
      const ids = [];
      for (const d of dateien) { try { ids.push(await Data.addFoto(d)); } catch (e) { App.toast('Foto nicht lesbar'); } }
      if (!ids.length) return;
      await Data.saveEntry(Data.neuerEintrag(p.id, 'foto', { fotos: ids }));
      if (!p.titelFoto) { p.titelFoto = ids[0]; await Data.savePlant(p); }
      App.toast(ids.length === 1 ? 'Foto gespeichert' : ids.length + ' Fotos gespeichert');
      App.neu();
    };
    f.click();
  },

  lupe(p, fotos, start) {
    App.lupe(fotos.map((f) => f.id), start, {
      text: (i) => U.datum(fotos[i].datum) + (fotos[i].text ? ' · ' + fotos[i].text : ''),
      aktion: { label: 'Als Titelbild', fn: async (id) => { p.titelFoto = id; await Data.savePlant(p); App.toast('Titelbild geändert'); App.neu(); } },
    });
  },

  /** Vorher/Nachher-Schieber: links altes, rechts neues Foto */
  vergleich(alt, neu) {
    // unten das neue Foto (voll), darüber das alte (rechts abgeschnitten) → links alt, rechts neu
    const w = U.el('div', { class: 'vn' });
    const unten = App.bild(neu.id, false), oben = App.bild(alt.id, false, 'oben');
    oben.style.clipPath = 'inset(0 50% 0 0)';
    const griff = U.el('div', { class: 'griff' });
    const r = U.el('input', { type: 'range', min: 0, max: 100, value: 50, 'aria-label': 'Vergleich: alt links, neu rechts' });
    r.addEventListener('input', () => { oben.style.clipPath = 'inset(0 ' + (100 - r.value) + '% 0 0)'; griff.style.left = r.value + '%'; });
    w.append(unten, oben, griff,
      U.el('span', { class: 'tag', style: { left: '8px' }, text: U.datum(alt.datum, true) }), U.el('span', { class: 'tag', style: { right: '8px' }, text: U.datum(neu.datum, true) }), r);
    return w;
  },

  steckbrief(p, art, neu) {
    const f = U.el('dl', { class: 'fakten', style: { margin: 0 } });
    const add = (k, v, breit) => { if (v != null && v !== '') f.append(U.el('div', { class: breit ? 'breit' : '' }, U.el('dt', { text: k }), U.el('dd', { text: v }))); };
    if (p.kind === 'zimmer') add('Art', p.art || 'unbekannt');
    add('Standort', p.standort);
    add(p.kind === 'cannabis' ? 'Start' : 'Erworben', p.erworben ? U.datum(p.erworben) + ' (' + U.alter(p.erworben) + ')' : '');
    add('Woher', p.quelle);
    add('Preis', p.preis != null ? U.euro(p.preis) : '');
    if (p.status !== 'aktiv') add('Status', (Gruen.STATUS[p.status] || p.status) + (p.statusDatum ? ' · ' + U.datum(p.statusDatum) : ''));
    (p.fakten || []).forEach((x, i) => {
      const d = U.el('div', { class: 'breit' }, U.el('dt', { text: x.k }), U.el('dd', { text: x.v }));
      d.style.cursor = 'pointer'; d.onclick = () => Detail.faktBearbeiten(p, i, neu);
      f.append(d);
    });
    const w = U.el('div');
    w.append(f);
    const mutter = p.mutter && Data.plants.get(p.mutter);
    const ableger = [...Data.plants.values()].filter((q) => q.mutter === p.id);
    if (mutter || ableger.length) {
      const k = U.el('div', { class: 'card flach', style: { marginTop: '10px' } });
      if (mutter) k.append(U.el('button', { class: 'zeile', onclick: () => App.oeffne(() => Detail.seite(mutter.id)) }, App.icon('sammlung'), U.el('div', { class: 't' }, U.el('b', { text: 'Ableger von ' + mutter.name }))));
      ableger.forEach((q) => k.append(U.el('button', { class: 'zeile', onclick: () => App.oeffne(() => Detail.seite(q.id)) }, App.icon('blatt'), U.el('div', { class: 't' }, U.el('b', { text: 'Ableger: ' + q.name })))));
      w.append(k);
    }
    if (p.notiz) w.append(U.el('div', { class: 'card prose', style: { marginTop: '10px' } }, U.md(p.notiz)));
    w.append(U.el('button', { class: 'btn klein ghost', style: { marginTop: '10px' }, onclick: () => Detail.faktBearbeiten(p, -1, neu) }, App.icon('plus'), 'Eigener Fakt'));
    return w;
  },

  faktBearbeiten(p, i, neu) {
    const ex = i >= 0 ? p.fakten[i] : { k: '', v: '' };
    const k = F.text('Was', ex.k, { platz: 'z. B. Topfgröße, Variante, Blattzahl' });
    const v = F.text('Wert', ex.v, { mehrzeilig: true, zeilen: 2 });
    const inh = U.el('div', null, k.el, v.el);
    const knoepfe = i >= 0 ? [U.el('button', { class: 'btn gefahr', text: 'Löschen', onclick: async () => { p.fakten.splice(i, 1); await Data.savePlant(p); s.zu(); neu(); } })] : [];
    const s = App.sheet({ titel: 'Fakt', inhalt: inh, extra: knoepfe, speichern: 'Speichern', onSpeichern: async () => {
      if (!k.wert() || !v.wert()) { App.toast('Bitte beides ausfüllen'); return false; }
      p.fakten = p.fakten || [];
      if (i >= 0) p.fakten[i] = { k: k.wert(), v: v.wert() }; else p.fakten.push({ k: k.wert(), v: v.wert() });
      await Data.savePlant(p); neu();
    } });
  },

  verlauf(p, eintraege, neu) {
    if (!eintraege.length) return U.el('div', { class: 'card' }, U.el('p', { class: 'muted', style: { margin: 0 }, text: 'Noch keine Einträge. Halte Gießen, Fotos, Wachstum und Besonderheiten fest – so entsteht die Geschichte deiner Pflanze.' }));
    const typen = Gruen.KINDER[p.kind].typen;
    const wrap = U.el('div');
    const liste = U.el('ol', { class: 'verlaufsliste' });
    const sicht = Detail.zeigeAlle ? eintraege : eintraege.slice(0, 15);
    let monat = '';
    sicht.forEach((e) => {
      const m = U.MONATE[Number(e.datum.slice(5, 7)) - 1] + ' ' + e.datum.slice(0, 4);
      if (m !== monat) { monat = m; liste.append(U.el('li', { class: 'monat' }, m)); }
      const d = typen[e.typ] || { label: e.typ, icon: 'stift', felder: [] };
      const werte = (d.felder || []).map((f) => (e.werte && e.werte[f.k] != null ? (f.typ === 'zahl' ? f.label + ' ' + U.fmt(e.werte[f.k], 2) + (f.einheit ? ' ' + f.einheit : '') : e.werte[f.k]) : null)).filter(Boolean).join(' · ');
      const li = U.el('li');
      li.append(U.el('span', { class: 'punkt' }, App.icon(d.icon)));
      const b = U.el('button', { class: 'e', onclick: () => Formen.eintrag(p, e.typ, e, neu) }, U.el('b', { text: d.label }), U.el('span', { class: 'd', text: U.datum(e.datum, true) + (e.datum >= U.plusTage(U.heute(), -30) ? ' · ' + U.rel(e.datum) : '') }),
        werte ? U.el('div', { class: 'w', text: werte }) : null, e.text ? U.el('p', { text: e.text }) : null);
      li.append(b);
      if (e.fotos && e.fotos.length) {
        const mini = U.el('div', { class: 'mini' });
        const alle = Detail.fotos(p);
        e.fotos.slice(0, 4).forEach((id) => mini.append(U.el('button', { 'aria-label': 'Foto ansehen', onclick: () => Detail.lupe(p, alle, Math.max(0, alle.findIndex((x) => x.id === id))) }, App.bild(id, true))));
        if (e.fotos.length > 4) mini.append(U.el('span', { class: 'muted klein', text: '+' + (e.fotos.length - 4) }));
        li.append(mini);
      }
      liste.append(li);
    });
    wrap.append(liste);
    if (eintraege.length > 15) wrap.append(U.el('button', { class: 'btn klein ghost', style: { marginTop: '12px' }, text: Detail.zeigeAlle ? 'Weniger anzeigen' : 'Alle ' + eintraege.length + ' Einträge anzeigen', onclick: () => { Detail.zeigeAlle = !Detail.zeigeAlle; neu(); } }));
    return U.el('div', { class: 'card' }, wrap);
  },

  cannabisKarte(p, eintraege) {
    const w = U.el('div', { class: 'card' });
    const ph = Pflege.phase(p);
    const idx = Gruen.PHASEN.indexOf(ph);
    const balken = U.el('div', { class: 'phasen' });
    Gruen.PHASEN.forEach((x, i) => balken.append(U.el('i', { class: idx >= 0 && i < idx ? 'an' : i === idx ? 'jetzt' : '', title: x })));
    w.append(U.el('div', { class: 'etikett', text: 'Phase' }), U.el('div', { style: { fontFamily: 'var(--serif)', fontSize: '22px', fontWeight: 600 }, text: ph || 'Noch keine Phase' }), balken);
    const f = U.el('div', { class: 'fakten', style: { marginTop: '10px' } });
    if (p.erworben) f.append(U.el('div', null, U.el('dt', { text: 'Gesamt' }), U.el('dd', { text: 'Tag ' + (U.tageZwischen(p.erworben, U.heute()) + 1) })));
    const bl = eintraege.filter((e) => e.typ === 'phase' && e.werte && e.werte.phase === 'Blüte').pop();
    if (bl) f.append(U.el('div', null, U.el('dt', { text: 'Blütetag' }), U.el('dd', { text: 'Tag ' + (U.tageZwischen(bl.datum, U.heute()) + 1) })));
    const ernte = eintraege.find((e) => e.typ === 'ernte');
    if (ernte && ernte.werte && (ernte.werte.trocken || ernte.werte.nass)) f.append(U.el('div', null, U.el('dt', { text: ernte.werte.trocken ? 'Ertrag (trocken)' : 'Ertrag (nass)' }), U.el('dd', { text: U.fmt(ernte.werte.trocken || ernte.werte.nass, 1) + ' g' })));
    const h = eintraege.find((e) => e.typ === 'messung' && e.werte && e.werte.hoehe != null);
    if (h) f.append(U.el('div', null, U.el('dt', { text: 'Höhe' }), U.el('dd', { text: U.fmt(h.werte.hoehe) + ' cm · ' + U.rel(h.datum) })));
    if (f.children.length) { if (f.children.length % 2) f.lastChild.classList.add('breit'); w.append(f); }
    w.append(U.el('button', { class: 'btn klein sekundaer', style: { marginTop: '10px' }, onclick: () => Formen.eintrag(p, 'phase', null, () => App.neu()) }, App.icon('stern'), 'Phase wechseln'));
    return w;
  },

  menue(p) {
    const l = U.el('div', { class: 'card flach' });
    let s;
    const z = (titel, icon, fn, gefahr) => l.append(U.el('button', { class: 'zeile', onclick: () => { s.zu(); fn(); } }, App.icon(icon), U.el('div', { class: 't' }, U.el('b', { text: titel, style: gefahr ? { color: 'var(--danger)' } : null }))));
    z('Bearbeiten', 'stift', () => Formen.pflanze(p.kind, p, () => App.neu()));
    if (p.kind === 'zimmer') z('Ableger anlegen', 'blatt', () => Formen.pflanze('zimmer', null, (n) => App.oeffne(() => Detail.seite(n.id)), { name: p.name + ' (Ableger)', artId: p.artId, art: p.art, mutter: p.id, giessTage: p.giessTage, duengerTage: p.duengerTage, standort: p.standort }));
    z('Status ändern', 'ordner', () => Detail.status(p));
    z('Pflanze löschen', 'trash', async () => {
      if (await App.bestaetigen('Pflanze löschen?', '„' + p.name + '“ mit allen Einträgen und Fotos wird dauerhaft gelöscht. Tipp: Statt zu löschen kannst du den Status auf „Eingegangen“ setzen – dann bleibt die Geschichte erhalten.', { ok: 'Endgültig löschen', gefahr: true })) {
        await Data.delPlant(p.id); App.toast('Gelöscht'); App.zurueck();
        setTimeout(() => App.neu(), 30);
      }
    }, true);
    s = App.sheet({ titel: p.name, inhalt: l });
  },

  status(p) {
    const opt = p.kind === 'cannabis' ? ['aktiv', 'geerntet', 'eingegangen'] : ['aktiv', 'verkauft', 'verschenkt', 'eingegangen'];
    const st = F.wahl('Status', opt.map((k) => Gruen.STATUS[k]), Gruen.STATUS[p.status], { pflicht: true });
    const dat = F.datum('Datum', p.statusDatum || U.heute());
    const nt = F.text('Notiz (z. B. Grund)', '', { mehrzeilig: true, zeilen: 2 });
    App.sheet({ titel: 'Status ändern', inhalt: U.el('div', null, st.el, dat.el, nt.el), speichern: 'Speichern', onSpeichern: async () => {
      const k = opt.find((x) => Gruen.STATUS[x] === st.wert()) || 'aktiv';
      if (k !== p.status) {
        p.status = k; p.statusDatum = k === 'aktiv' ? null : dat.wert();
        await Data.savePlant(p);
        if (k !== 'aktiv') await Data.saveEntry(Data.neuerEintrag(p.id, 'notiz', { datum: dat.wert() || U.heute(), text: Gruen.STATUS[k] + (nt.wert() ? ': ' + nt.wert() : '') }));
      }
      App.neu();
    } });
  },
};

<script>
/* GRUENZEUG – Lexikon: Arten mit Seltenheit, Pflege und Besonderheiten. Inhalte stehen in content/arten.js. */
const Lexikon = {
  zustand: { q: '', f: 'alle' },
  FARBEN: { 'Aronstabgewächse': ['#3f6b4c', '#2a4a35'], 'Sukkulenten & Kakteen': ['#8a8a4a', '#5f6030'], 'Farne': ['#4f7a52', '#35573a'], 'Palmen': ['#5c7f4a', '#3d5a30'],
    'Orchideen': ['#a35a7a', '#74395a'], 'Fleischfresser': ['#9a4a3c', '#6e2f27'], 'Blühpflanzen': ['#b0643f', '#7e4228'], 'Feigen & Bäume': ['#5b7a5e', '#3b543f'],
    'Hängepflanzen': ['#3f7a72', '#2a5650'], 'Buntblatt': ['#7a5a8a', '#52386a'] },
  farbe(kat) { return Lexikon.FARBEN[kat] || ['#4d7a58', '#2f5a3d']; },

  besitz(artId) { return [...Data.plants.values()].filter((p) => p.artId === artId && p.status === 'aktiv'); },

  zeile(a) {
    const [c1, c2] = Lexikon.farbe(a.kat);
    const kachel = U.el('div', { class: 'kachel-k' }, Gruen.bild(a.id) ? App.artBild(a.id, '', a.name) : App.icon(ICON_LEXIKON_KAT[a.kat] || 'blatt'));
    kachel.style.background = 'linear-gradient(135deg,' + c1 + ',' + c2 + ')'; kachel.style.color = '#fff';
    const r = U.el('div', { class: 'r' }, App.punkte(a.selten));
    const n = Lexikon.besitz(a.id).length;
    if (n) r.append(U.el('span', { class: 'eigen', text: n + '× bei dir' }));
    else if (Data.wunsch().includes(a.id)) r.append(U.el('span', { class: 'eigen', text: '♥ Wunschliste' }));
    return U.el('button', { class: 'lex', onclick: () => App.oeffne(() => Lexikon.detail(a.id)) }, kachel,
      U.el('div', { class: 't' }, U.el('b', { text: a.name }), U.el('i', { text: a.latein === a.name ? a.kat : a.latein })), r);
  },

  /** Kachel für die Rasteransicht: großes Foto, Name, Seltenheit */
  kachel(a) {
    const [c1, c2] = Lexikon.farbe(a.kat);
    const bild = Gruen.bild(a.id) ? App.artBild(a.id, '', a.name) : (() => { const d = U.el('div', { class: 'ph' }, App.icon(ICON_LEXIKON_KAT[a.kat] || 'blatt')); d.style.background = 'linear-gradient(135deg,' + c1 + ',' + c2 + ')'; d.style.color = '#fff'; return d; })();
    const k = U.el('button', { class: 'kachel lexk', onclick: () => App.oeffne(() => Lexikon.detail(a.id)) }, bild);
    const n = Lexikon.besitz(a.id).length;
    if (n || Data.wunsch().includes(a.id)) k.append(U.el('span', { class: 'marke pillen' }, App.pille(n ? 'Du hast' : 'Wunsch', n ? '' : 'clay', n ? 'haken' : 'herz')));
    k.append(U.el('div', { class: 'info' }, U.el('span', { class: 'name', text: a.name }), U.el('span', { class: 'art' }, App.punkte(a.selten), ' ' + Gruen.SELTEN[a.selten])));
    return k;
  },

  /** Gattung = erstes Wort des lateinischen Namens (ohne Zuchtform-Zusätze) */
  gattung(a) { return String(a.latein).split(/[ ×]/)[0]; },
  /** Gattungen mit mindestens vier Arten, als Schnellfilter */
  gattungen() {
    const n = {};
    for (const a of Gruen.arten) { const g = Lexikon.gattung(a); n[g] = (n[g] || 0) + 1; }
    return Object.keys(n).filter((g) => n[g] >= 4).sort((x, y) => n[y] - n[x] || x.localeCompare(y, 'de'));
  },

  filtern() {
    const z = Lexikon.zustand;
    let l = Gruen.arten.slice();
    if (z.f === 'rar') l = l.filter((a) => a.selten >= 3);
    else if (z.f === 'anfaenger') l = l.filter((a) => a.schwer === 1);
    else if (z.f === 'tiere') l = l.filter((a) => !a.giftig);
    else if (z.f === 'wunsch') l = l.filter((a) => Data.wunsch().includes(a.id));
    else if (z.f.startsWith('k:')) l = l.filter((a) => a.kat === z.f.slice(2));
    else if (z.f.startsWith('g:')) l = l.filter((a) => Lexikon.gattung(a) === z.f.slice(2));
    if (z.q) l = l.filter((a) => U.trifft([a.name, a.latein, (a.alias || []).join(' '), a.kat, a.kurz, (a.sorten || []).map((s) => s.n).join(' ')].join(' '), z.q));
    return l.sort((a, b) => (z.f === 'rar' ? b.selten - a.selten : 0) || a.name.localeCompare(b.name, 'de'));
  },

  seite() {
    const z = Lexikon.zustand;
    const w = U.el('div');
    const si = U.el('input', { type: 'search', placeholder: 'Name, Art, Sorte …', 'aria-label': 'Lexikon durchsuchen', value: z.q, autocomplete: 'off' });
    const chips = U.el('div', { class: 'chips', role: 'toolbar' });
    const out = U.el('div');
    const filter = [['alle', 'Alle'], ['rar', 'Raritäten'], ['anfaenger', 'Für Anfänger'], ['tiere', 'Tierfreundlich'], ['wunsch', 'Wunschliste ♥'], ...Gruen.KATEGORIEN.map((k) => ['k:' + k, k]), ...Lexikon.gattungen().map((g) => ['g:' + g, g])];
    const zeichneChips = () => { chips.replaceChildren(...filter.map(([id, l]) => U.el('button', { class: 'chip' + (z.f === id ? ' on' : ''), text: l, onclick: () => { z.f = id; zeichneChips(); zeichne(); } }))); };
    const zeichne = () => {
      const l = Lexikon.filtern();
      out.replaceChildren();
      if (!l.length) { out.append(App.leer(z.f === 'wunsch' ? 'herz' : 'suche', z.f === 'wunsch' ? 'Wunschliste ist leer' : 'Nichts gefunden', z.f === 'wunsch' ? 'Tippe in einem Lexikon-Eintrag auf das Herz.' : 'Andere Schreibweise oder lateinischer Name?')); return; }
      out.append(U.el('div', { class: 'muted klein', style: { margin: '2px 2px 8px' }, text: U.plural(l.length, 'Art', 'Arten') }),
        Einst.get('lexAnsicht', 'liste') === 'raster' ? U.el('div', { class: 'gitter' }, l.map((a) => Lexikon.kachel(a))) : U.el('div', { class: 'card flach' }, l.map((a) => Lexikon.zeile(a))));
    };
    si.addEventListener('input', () => { z.q = si.value; zeichne(); });
    w.append(U.el('div', { class: 'suche' }, App.icon('suche'), si), chips, out);
    zeichneChips(); zeichne();
    const raster = Einst.get('lexAnsicht', 'liste') === 'raster';
    return { titel: 'Lexikon', sub: Gruen.arten.length + ' Pflanzen', inhalt: w, aktionen: [
      { icon: 'stern', label: 'Zufällige Pflanze', fn: () => { const a = Gruen.arten[Math.floor(Math.random() * Gruen.arten.length)]; App.oeffne(() => Lexikon.detail(a.id)); } },
      { icon: raster ? 'lexikon' : 'bild', label: raster ? 'Als Liste zeigen' : 'Als Fotos zeigen', fn: () => { Einst.set('lexAnsicht', raster ? 'liste' : 'raster'); App.neu(); } }] };
  },

  detail(id) {
    const a = Gruen.artById(id);
    if (!a) return { titel: 'Nicht gefunden', zurueck: true, inhalt: App.leer('info', 'Eintrag nicht gefunden', '') };
    const [c1, c2] = Lexikon.farbe(a.kat);
    const w = U.el('div');
    const hero = U.el('div', { class: 'lexhero' }, U.el('h1', { text: a.name }), U.el('div', { class: 'latein', text: a.latein }),
      U.el('div', { class: 'pillen' }, U.el('span', { class: 'pille' }, App.punkte(a.selten), ' ' + Gruen.SELTEN[a.selten]), U.el('span', { class: 'pille', text: a.kat }), U.el('span', { class: 'pille', text: Gruen.SCHWER[a.schwer] })));
    hero.style.background = 'linear-gradient(150deg,' + c1 + ',' + c2 + ')';
    const foto = Gruen.bild(a.id);
    if (foto) {
      hero.classList.add('mitfoto');
      hero.prepend(App.artBild(a.id, 'lexfoto', a.name), U.el('div', { class: 'schleier' }));
    } else { const gross = App.icon(ICON_LEXIKON_KAT[a.kat] || 'blatt'); gross.setAttribute('class', 'gross'); hero.prepend(gross); }
    w.append(hero);
    if (foto) w.append(U.el('div', { class: 'bildnachweis muted klein' }, foto.ersatz ? 'Foto zeigt die Art ' + foto.ersatz + ' · ' : null, 'Foto: ' + foto.urheber + ' · ', U.el('a', { href: foto.lizenzUrl || foto.seite, target: '_blank', rel: 'noopener noreferrer', text: foto.lizenz }), ' · ', U.el('a', { href: foto.seite, target: '_blank', rel: 'noopener noreferrer', text: 'Wikimedia Commons' })));
    w.append(U.el('p', { class: 'lead', text: a.kurz }));
    if (a.alias && a.alias.length) w.append(U.el('p', { class: 'muted klein', style: { margin: '0 2px 8px' }, text: 'Auch: ' + a.alias.join(', ') }));
    if (a.selten >= 3) w.append(U.el('div', { class: 'box warn' }, U.el('b', { text: Gruen.SELTEN[a.selten] }), Gruen.SELTEN_INFO[a.selten]));

    const nutzer = Lexikon.besitz(a.id);
    const wunsch = Data.wunsch().includes(a.id);
    w.append(U.el('div', { class: 'btnreihe', style: { margin: '12px 0' } },
      U.el('button', { class: 'btn', onclick: () => Formen.pflanze('zimmer', null, (p) => { App.tab('sammlung'); App.oeffne(() => Detail.seite(p.id)); }, { name: a.name, artId: a.id, art: a.name, giessTage: a.giessTage || null }) }, App.icon('plus'), 'Zur Sammlung'),
      U.el('button', { class: 'btn ' + (wunsch ? 'clay' : 'ghost'), onclick: async () => { await Data.wunschSetzen(a.id, !wunsch); App.toast(wunsch ? 'Von der Wunschliste entfernt' : 'Auf der Wunschliste'); App.neu(); } }, App.icon('herz'), wunsch ? 'Wunschliste ✓' : 'Wunschliste')));
    if (nutzer.length) {
      const k = U.el('div', { class: 'card flach' });
      nutzer.forEach((p) => k.append(U.el('button', { class: 'zeile', onclick: () => App.oeffne(() => Detail.seite(p.id)) }, App.icon('sammlung'), U.el('div', { class: 't' }, U.el('b', { text: 'Du hast: ' + p.name }), U.el('span', { text: p.standort || 'in deiner Sammlung' })))));
      w.append(k);
    }

    const f = U.el('dl', { class: 'fakten', style: { margin: '0 0 4px' } });
    const add = (k, v, breit) => { if (v) f.append(U.el('div', { class: breit ? 'breit' : '' }, U.el('dt', { text: k }), U.el('dd', { text: v }))); };
    add('Licht', a.licht); add('Wasser', a.wasser); add('Luftfeuchte', a.feuchte); add('Temperatur', a.temp); add('Substrat', a.substrat, true);
    add('Vermehrung', a.vermehrung, true); add('Herkunft', a.herkunft, true);
    add('Haustiere & Kinder', a.giftig ? 'Giftig' + (a.giftHinweis ? ': ' + a.giftHinweis : '') : 'Gilt als ungiftig' + (a.giftHinweis ? ' (' + a.giftHinweis + ')' : ''), true);
    w.append(App.abschnitt('Pflege auf einen Blick'), f);

    const mehr = Gruen.mehrBilder(a.id);
    if (mehr.length) {
      w.append(App.abschnitt('Weitere Fotos'), U.el('div', { class: 'foto-streifen' }, mehr.map((b, i) => U.el('figure', null,
        App.artBild(a.id + '_' + (i + 2), 'streifenfoto', a.name), U.el('figcaption', { class: 'muted klein', text: b.urheber + ' · ' + b.lizenz })))));
    }
    if (a.text) w.append(App.abschnitt('Über die Pflanze'), U.el('div', { class: 'card prose' }, U.md(a.text)));
    const nat = Gruen.naturById(a.id), natFoto = Gruen.bild(a.id + '_natur');
    if (nat || natFoto) {
      const k = U.el('div', { class: 'card flach natur' });
      if (natFoto) k.append(U.el('div', { class: 'natur-bild' }, App.artBild(a.id + '_natur', '', a.name)), U.el('div', { class: 'bildnachweis muted klein', style: { padding: '6px 14px 0' } }, 'Foto: ' + natFoto.urheber + ' · ', U.el('a', { href: natFoto.lizenzUrl || natFoto.seite, target: '_blank', rel: 'noopener noreferrer', text: natFoto.lizenz }), ' · ', U.el('a', { href: natFoto.seite, target: '_blank', rel: 'noopener noreferrer', text: 'Wikimedia Commons' })));
      if (nat) {
        const t = U.el('div', { class: 'natur-text' });
        if (nat.ort) t.append(U.el('div', { class: 'etikett', text: nat.ort }));
        if (nat.text) t.append(U.el('div', { class: 'prose' }, U.md(nat.text)));
        if (nat.fakten && nat.fakten.length) t.append(U.el('ul', { class: 'liste' }, nat.fakten.map((f) => U.el('li', { text: f }))));
        k.append(t);
      }
      w.append(App.abschnitt('In der Natur'), k);
    }
    if (a.besonders && a.besonders.length) w.append(App.abschnitt('Besonderheiten'), U.el('div', { class: 'card' }, U.el('ul', { class: 'liste' }, a.besonders.map((b) => U.el('li', { text: b })))));
    if (a.sorten && a.sorten.length) w.append(App.abschnitt('Sorten & Varianten'), U.el('div', { class: 'card flach' }, a.sorten.map((s) => U.el('div', { class: 'zeile', style: { cursor: 'default', alignItems: 'flex-start' } }, U.el('div', { class: 't' }, U.el('b', { text: s.n }), U.el('span', { text: s.t }))))));
    if (a.tipps && a.tipps.length) w.append(App.abschnitt('Tipps'), U.el('div', { class: 'card' }, U.el('ul', { class: 'liste' }, a.tipps.map((b) => U.el('li', { text: b })))));
    if (a.probleme && a.probleme.length) w.append(App.abschnitt('Typische Probleme'), U.el('div', { class: 'card' }, U.el('ul', { class: 'liste' }, a.probleme.map((b) => U.el('li', { text: b }))), U.el('button', { class: 'btn klein ghost', style: { marginTop: '10px' }, text: 'Zur Diagnose', onclick: () => { Wissen.zustand.tab = 'diagnose'; App.tab('wissen'); } })));
    return { titel: a.name, kleinTitel: true, zurueck: true, ohneTab: true, inhalt: w };
  },
};
App.tabBauer.lexikon = () => Lexikon.seite();

<script>
/* GRUENZEUG – Zusatzfunktionen: Pflegeplan (+ Kalender-Erinnerungen als .ics), Pflege-Serie, Erfolge, Pflanzen-Quiz,
   „Wusstest du?“, Bildnachweis. Alles wird aus den vorhandenen Daten gerechnet; gespeichert wird nur der Quiz-Stand
   in Einst ('quizBest', 'quizRichtig'). */
const Plan = {
  /** Fälligkeiten der nächsten `tage` Tage: [{d: 'YYYY-MM-DD', items: [{p, typ}]}]. Überfälliges landet auf heute. */
  tage(tage) {
    const aus = [];
    for (let i = 0; i < tage; i++) aus.push({ d: U.plusTage(U.heute(), i), items: [] });
    for (const p of Data.liste('zimmer', 'aktiv')) {
      for (const typ of ['giessen', 'duengen']) {
        const n = Pflege.naechste(p, typ);
        if (!n) continue;
        const iv = typ === 'giessen' ? p.giessTage : p.duengerTage;
        for (let t = Math.max(n.in, 0); t < tage; t += iv) aus[t].items.push({ p, typ, ueber: n.in < 0 && t === 0 });
      }
    }
    return aus;
  },

  /** Eine Zeile je Pflanze und Aufgabe */
  zeile(x) {
    return U.el('button', { class: 'zeile', onclick: () => App.oeffne(() => Detail.seite(x.p.id)) },
      U.el('span', { class: 'mini-thumb' }, App.titelbild(x.p, true)),
      U.el('div', { class: 't' }, U.el('b', { text: x.p.name }), U.el('span', { text: (x.typ === 'giessen' ? 'Gießen' : 'Düngen') + (x.ueber ? ' · überfällig' : '') })),
      App.icon(x.typ === 'giessen' ? 'tropfen' : 'flasche'));
  },

  /** Streifen für „Heute“: 7 Tage mit Anzahl der Aufgaben */
  streifen() {
    const t = Plan.tage(7);
    if (!t.some((x) => x.items.length)) return null;
    const w = U.el('div', { class: 'woche' });
    t.forEach((x, i) => {
      const n = x.items.length;
      const [y, m, d] = x.d.split('-').map(Number);
      w.append(U.el('button', { class: 'tag' + (i === 0 ? ' heute' : '') + (n ? ' voll' : ''), 'aria-label': U.wochentag(x.d) + ', ' + n + ' Aufgaben',
        onclick: () => { if (!n) { App.toast(U.wochentag(x.d) + ': nichts zu tun'); return; } App.sheet({ titel: i === 0 ? 'Heute' : U.wochentag(x.d) + ', ' + U.datum(x.d, true), inhalt: U.el('div', { class: 'card flach' }, x.items.map(Plan.zeile)) }); } },
        U.el('span', { class: 'wt', text: U.WOCHENTAGE[new Date(y, m - 1, d).getDay()].slice(0, 2) }),
        U.el('span', { class: 'dn', text: String(d) }),
        U.el('span', { class: 'zl' }, n ? App.icon('tropfen') : null, n ? String(n) : '·')));
    });
    return U.el('div', { class: 'card' }, w);
  },

  seite() {
    const w = U.el('div');
    const t = Plan.tage(14);
    const nix = !t.some((x) => x.items.length);
    if (nix) w.append(App.leer('heute', 'Noch kein Pflegeplan', 'Trage bei deinen Pflanzen ein, wie oft sie gegossen oder gedüngt werden – dann entsteht hier dein Plan.'));
    else {
      w.append(U.el('div', { class: 'btnreihe', style: { margin: '4px 0 6px' } }, U.el('button', { class: 'btn sekundaer', onclick: () => Plan.ics() }, App.icon('teilen'), 'Als Kalender-Erinnerungen')));
      w.append(U.el('p', { class: 'hinweis', style: { margin: '0 2px 10px' }, text: 'Die Erinnerungen landen im Kalender deines Handys und melden sich morgens um 9 Uhr – auch ohne geöffnete App.' }));
      for (const x of t) {
        if (!x.items.length) continue;
        w.append(App.abschnitt(x.d === U.heute() ? 'Heute' : x.d === U.plusTage(U.heute(), 1) ? 'Morgen' : U.wochentag(x.d) + ', ' + U.datum(x.d, true)), U.el('div', { class: 'card flach' }, x.items.map(Plan.zeile)));
      }
    }
    return { titel: 'Pflegeplan', sub: 'Die nächsten 14 Tage', zurueck: true, inhalt: w };
  },

  /** iCalendar-Datei: je Pflanze eine wiederkehrende Gieß- (und Dünge-)Erinnerung, Alarm um 9 Uhr */
  async ics() {
    const esc = (s) => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    const kompakt = (iso) => iso.replace(/-/g, '');
    const jetzt = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const z = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Gruenzeug//Pflegeplan//DE', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Gruenzeug Pflege'];
    let n = 0;
    for (const p of Data.liste('zimmer', 'aktiv')) {
      for (const typ of ['giessen', 'duengen']) {
        const f = Pflege.naechste(p, typ);
        if (!f) continue;
        const iv = typ === 'giessen' ? p.giessTage : p.duengerTage;
        const start = U.plusTage(U.heute(), Math.max(f.in, 0));
        z.push('BEGIN:VEVENT', 'UID:' + p.id + '-' + typ + '@gruenzeug', 'DTSTAMP:' + jetzt, 'DTSTART;VALUE=DATE:' + kompakt(start), 'DTEND;VALUE=DATE:' + kompakt(U.plusTage(start, 1)),
          'RRULE:FREQ=DAILY;INTERVAL=' + iv, 'SUMMARY:' + esc((typ === 'giessen' ? 'Gießen: ' : 'Düngen: ') + p.name), 'TRANSP:TRANSPARENT',
          'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc(p.name), 'TRIGGER;RELATED=START:PT9H', 'END:VALARM', 'END:VEVENT');
        n++;
      }
    }
    z.push('END:VCALENDAR');
    if (!n) { App.toast('Keine Pflanze mit Pflege-Rhythmus'); return; }
    const blob = new Blob([z.join('\r\n') + '\r\n'], { type: 'text/calendar' });
    const r = await Sicherung.speichern(blob, 'gruenzeug-pflege.ics', 'text/calendar');
    if (r !== 'abgebrochen') App.toast(n + ' Erinnerungen exportiert – in „Kalender“ öffnen und hinzufügen', 5000);
  },
};

const Serie = {
  /** Tage mit mindestens einem Eintrag (Zimmerpflanzen) */
  tage() {
    const s = new Set();
    for (const e of Data.entries.values()) if ((Data.plants.get(e.plantId) || {}).kind === 'zimmer') s.add(e.datum);
    return s;
  },
  /** {aktuell, beste}: Tage in Folge mit Eintrag; heute darf noch fehlen */
  rechne() {
    const s = Serie.tage();
    let d = U.heute(), aktuell = 0;
    if (!s.has(d)) d = U.plusTage(d, -1);
    while (s.has(d)) { aktuell++; d = U.plusTage(d, -1); }
    let beste = 0, lauf = 0, vorher = null;
    for (const x of [...s].sort()) { lauf = vorher && U.tageZwischen(vorher, x) === 1 ? lauf + 1 : 1; beste = Math.max(beste, lauf); vorher = x; }
    return { aktuell, beste, tage: s };
  },
  /** Karte für „Heute“ */
  karte() {
    if (!Data.liste('zimmer', 'aktiv').length) return null;

    for (let i = 6; i >= 0; i--) { const d = U.plusTage(U.heute(), -i); punkte.append(U.el('i', { class: r.tage.has(d) ? 'an' : '', title: U.wochentag(d) }, U.el('span', { text: U.wochentag(d).slice(0, 2) }))); }
    return U.el('button', { class: 'card serie', onclick: () => App.oeffne(() => Erfolge.seite()) },
      U.el('div', { class: 'serie-zahl' }, U.el('b', { text: String(r.aktuell) }), U.el('span', { text: r.aktuell === 1 ? 'Tag in Folge' : 'Tage in Folge' })),

  },
};

const Quiz = {
  z: null,   // {fragen: [{art, opt: [artId], antwort: artId|null}], i, richtig, fertig}

    const art2 = (a) => a.latein.split(' ').slice(0, 2).join(' ');
    const fragen = mische(mit).slice(0, 10).map((a) => {
      const echt = Gruen.arten.filter((x) => x.id !== a.id && art2(x) !== art2(a));
      const gleich = mische(echt.filter((x) => x.kat === a.kat)), rest = mische(echt.filter((x) => x.kat !== a.kat));
      const opt = mische([a, ...gleich.concat(rest).slice(0, 3)]).map((x) => x.id);
      return { art: a.id, opt, antwort: null };
    });
    Quiz.z = { fragen, i: 0, richtig: 0, fertig: false };
  },
  seite() {

        U.el('p', { class: 'muted', text: z.richtig >= 9 ? 'Meisterhaft – du kennst deine Pflanzen!' : z.richtig >= 6 ? 'Stark! Da geht noch mehr.' : 'Schau öfter ins Lexikon, dann klappt es.' }),
        U.el('p', { class: 'muted klein', text: 'Beste Runde: ' + best + ' / ' + z.fragen.length }),
        U.el('div', { class: 'btnreihe' }, U.el('button', { class: 'btn', text: 'Nochmal', onclick: () => { Quiz.neu(); App.neu(); } }), U.el('button', { class: 'btn ghost', text: 'Fertig', onclick: () => App.zurueck() }))));
      return { titel: 'Pflanzen-Quiz', zurueck: true, inhalt: w };
    }
    const f = z.fragen[z.i], richtig = Gruen.artById(f.art);

      U.el('div', { class: 'quizbild' }, App.artBild(f.art, '', richtig.name)));
    const opts = U.el('div', { class: 'quizopt' });
    for (const id of f.opt) {
      const a = Gruen.artById(id);
      const stand = f.antwort == null ? '' : id === f.art ? ' richtig' : id === f.antwort ? ' falsch' : ' aus';
      opts.append(U.el('button', { class: 'btn ghost voll' + stand, disabled: f.antwort != null, onclick: () => {
        f.antwort = id;
        if (id === f.art) { z.richtig++; Einst.set('quizRichtig', Einst.get('quizRichtig', 0) + 1); }
        App.neu();
      } }, a.name));
    }
    w.append(U.el('h3', { text: 'Welche Pflanze ist das?', style: { margin: '14px 2px 8px' } }), opts);
    if (f.antwort != null) {
      const ok = f.antwort === f.art;
      w.append(U.el('div', { class: 'box' + (ok ? '' : ' warn'), style: { marginTop: '12px' } }, U.el('b', { text: ok ? 'Richtig!' : 'Leider nicht – das ist: ' + richtig.name }), richtig.kurz),
        U.el('div', { class: 'btnreihe' },
          U.el('button', { class: 'btn', text: z.i + 1 < z.fragen.length ? 'Weiter' : 'Ergebnis', onclick: () => {
            if (z.i + 1 < z.fragen.length) z.i++; else { z.fertig = true; if (z.richtig > Einst.get('quizBest', 0)) Einst.set('quizBest', z.richtig); }
            App.neu();
          } }),
          U.el('button', { class: 'btn ghost', text: 'Im Lexikon', onclick: () => App.oeffne(() => Lexikon.detail(f.art)) })));
    }
    return { titel: 'Pflanzen-Quiz', zurueck: true, inhalt: w };
  },
  oeffnen() { Quiz.neu(); App.oeffne(() => Quiz.seite()); },
  karte() {

/** Suche über alles: Pflanzen, Lexikon, Wissen, Schädlinge, Diagnose */
const Suche = {
  q: '',
  seite() {
    const w = U.el('div');
    const si = U.el('input', { type: 'search', placeholder: 'Pflanze, Art, Symptom, Schädling …', 'aria-label': 'Alles durchsuchen', value: Suche.q, autocomplete: 'off' });
    const out = U.el('div', { class: 'such-treffer' });

      out.append(U.el('div', { class: 'such-kopf', text: titel + ' (' + liste.length + ')' }), U.el('div', { class: 'card flach' }, liste.slice(0, 6).map(bau)));
    };
    const zeichne = () => {
      out.replaceChildren();
      const q = Suche.q.trim();
      if (q.length < 2) { out.append(App.leer('suche', 'Eine Suche für alles', 'Tippe mindestens zwei Buchstaben – es werden deine Pflanzen, das Lexikon, Pflege-Wissen, Schädlinge und Symptome durchsucht.')); return; }
      const pf = Data.liste('zimmer').filter((p) => U.trifft([p.name, p.art, p.standort, p.notiz, p.quelle].join(' '), q));
      const lx = Gruen.arten.filter((a) => U.trifft([a.name, a.latein, (a.alias || []).join(' '), a.kat, a.kurz, (a.sorten || []).map((s) => s.n).join(' ')].join(' '), q));
      const wi = Gruen.wissen.filter((t) => !t.privat && U.trifft(t.titel + ' ' + t.kurz, q));
      const sc = Gruen.schaedlinge.filter((t) => U.trifft(t.name + ' ' + (t.alias || []).join(' ') + ' ' + t.kurz, q));
      const di = Gruen.diagnose.filter((t) => U.trifft(t.titel + ' ' + (t.stichworte || '') + ' ' + t.kurz, q));
      if (!(pf.length + lx.length + wi.length + sc.length + di.length)) { out.append(App.leer('suche', 'Nichts gefunden', 'Andere Schreibweise oder lateinischer Name?')); return; }
      gruppe('Meine Pflanzen', pf, (p) => App.zeile(p.name, p.art || p.standort || '', 'sammlung', () => App.oeffne(() => Detail.seite(p.id))));
      gruppe('Lexikon', lx, (a) => App.zeile(a.name, a.latein, 'lexikon', () => App.oeffne(() => Lexikon.detail(a.id))));
      gruppe('Pflege-Wissen', wi, (t) => App.zeile(t.titel, t.kurz, t.icon || 'wissen', () => App.oeffne(() => Wissen.thema(t.id))));
      gruppe('Schädlinge', sc, (t) => App.zeile(t.name, t.kurz, 'kaefer', () => App.oeffne(() => Wissen.schaedling(t.id))));
      gruppe('Diagnose', di, (t) => App.zeile(t.titel, t.kurz, 'warnung', () => App.oeffne(() => Wissen.symptom(t.id))));
    };
    si.addEventListener('input', () => { Suche.q = si.value; zeichne(); });
    w.append(U.el('div', { class: 'suche' }, App.icon('suche'), si), out);
    zeichne();
    return { titel: 'Suche', sub: 'Alles auf einmal', zurueck: true, inhalt: w, nachher: () => { if (!Suche.q) setTimeout(() => si.focus(), 60); } };
  },

<script>

<script>
/* GRUENZEUG – Privater Bereich: das Grow-Logbuch (Cannabis) hinter einer PIN. Die PIN sperrt nur die Ansicht in
   der App (SHA-256 mit Salz, im Gerät). Die Daten selbst liegen nicht verschlüsselt im Gerät – dafür gilt die
   Gerätesperre des Handys. Entsperrt bleibt der Bereich, bis die App eine Minute im Hintergrund war oder man sperrt. */
const Privat = {
  offen: false,
  _weg: 0,

  cfg() { return Einst.get('pin', null); },
  aktiv() { return !!Privat.cfg(); },

  async hash(pin, salt) {
    try {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin));
      return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
    } catch (e) { return 'h' + U.hash(salt + ':' + pin); }   // ohne Web Crypto (z. B. file://): einfacher Hash
  },
  /** PIN festlegen: Schlüssel ableiten, Prüfwert („Kanarienvogel“) speichern. Ohne Web Crypto (z. B. file://) nur Hash, kein Cloud-Schutz. */
  async setzen(pin) {
    let cfg;
    if (Krypto.ok()) {
      const salt = Krypto.neuesSalz();
      const key = await Krypto.ableiten(pin, salt, Krypto.ITER_NEU);
      cfg = { v: 2, salt, iter: Krypto.ITER_NEU, canary: await Krypto.encMit(key, 'gruenzeug-ok'), len: pin.length, u: Date.now() };
      Krypto.key = key;
    } else {
      const salt = U.uid() + U.uid();
      cfg = { salt, hash: await Privat.hash(pin, salt), len: pin.length, u: Date.now() };
    }
    Einst.set('pin', cfg);
    await Sync.nachMeta('privat');
    await Sync.privatNeuEinreihen();
  },
  async pruefen(pin) {
    const c = Privat.cfg();
    if (!c) return false;
    if (c.v === 2) {
      try {
        const key = await Krypto.ableiten(pin, c.salt, c.iter);
        if ((await Krypto.decMit(key, c.canary)) !== 'gruenzeug-ok') return false;
        Krypto.key = key;
        return true;
      } catch (e) { return false; }
    }
    if ((await Privat.hash(pin, c.salt)) !== c.hash) return false;   // alter Stand (nur Hash): beim ersten Entsperren auf Verschlüsselung umstellen
    if (Krypto.ok()) await Privat.setzen(pin);
    return true;
  },

  /** Ziffernfeld. onFertig(pin) → true = schließen, false = Fehler (Schütteln). laenge: feste Länge (Entsperren) oder null (Neu: 4–6 mit ✓) */
  pinFeld(titel, text, laenge, onFertig, extra) {
    let pin = '';
    const punkte = U.el('div', { class: 'pin' });
    const zeichne = () => { punkte.replaceChildren(); const n = laenge || Math.max(6, pin.length); for (let i = 0; i < n; i++) punkte.append(U.el('i', { class: i < pin.length ? 'an' : '' })); };
    const senden = async () => {
      if (laenge ? pin.length !== laenge : pin.length < 4) return;
      const ok = await onFertig(pin);
      if (ok) s.zu();
      else { pin = ''; zeichne(); punkte.classList.remove('schuettel'); void punkte.offsetWidth; punkte.classList.add('schuettel'); }
    };
    const taste = (z) => { if (pin.length < (laenge || 10)) { pin += z; zeichne(); if (laenge && pin.length === laenge) senden(); } };
    const feld = U.el('div', { class: 'ziffern' });
    ['1', '2', '3', '4', '5', '6', '7', '8', '9'].forEach((z) => feld.append(U.el('button', { onclick: () => taste(z), text: z, 'aria-label': z })));
    feld.append(U.el('button', { 'aria-label': 'Löschen', onclick: () => { pin = pin.slice(0, -1); zeichne(); } }, App.icon('zurueck')),
      U.el('button', { onclick: () => taste('0'), text: '0', 'aria-label': '0' }),
      laenge ? U.el('button', { class: 'leer-t' }) : U.el('button', { 'aria-label': 'Bestätigen', onclick: senden }, App.icon('haken')));

  /** Hinweis oben im Grow-Logbuch */

document.addEventListener('visibilitychange', () => {

<script>
/* GRUENZEUG – „Mehr“: Wunschliste, Statistik, Sicherung (ZIP), Einstellungen, Privater Bereich, Über. */

    k.append(App.zeile('Nach Update suchen', 'Version ' + (typeof GRUEN_BUILD !== 'undefined' ? GRUEN_BUILD.stamp : 'Entwicklung'), 'info', () => Updates.pruefen(true)));
    w.append(k);

    const ver = U.el('p', { class: 'muted klein', style: { textAlign: 'center', marginTop: '24px' }, text: 'Gruenzeug · Version ' + (typeof GRUEN_BUILD !== 'undefined' ? GRUEN_BUILD.stamp : 'Entwicklung') + ' · mit Erde unter den Fingernägeln gebaut' });
    ver.addEventListener('click', () => { if (Privat.aktiv() && Einst.get('pinVerstecken', false)) { Mehr._versionKlicks++; clearTimeout(Mehr._vt); Mehr._vt = setTimeout(() => { Mehr._versionKlicks = 0; }, 2500); if (Mehr._versionKlicks >= 5) { Mehr._versionKlicks = 0; Privat.oeffnen(); } } });

  },

  /* ---------- Cloud-Sync ---------- */
  syncText() {
    const c = Sync.cfg();
    if (!c) return '';

    if (Sync.status.fehler) return 'Fehler: ' + Sync.status.fehler;

  },
  syncAnzeige() { const el = document.getElementById('sync-status'); if (el) el.textContent = Mehr.syncText(); },

  cloud() {
    const w = U.el('div');
    const c = Sync.cfg();
    if (!Sync.angemeldet()) {
      const mail = F.text('E-Mail', c && c.email || '', { typ: 'email', inputmode: 'email' });
      const pw = F.text('Passwort', '', { typ: 'password', platz: 'mindestens 8 Zeichen' });
      pw.input.setAttribute('autocomplete', 'current-password');

      const los = async (neu) => {
        const e = mail.wert(), p = pw.input.value;

        U.el('p', { class: 'hinweis', text: 'Deine vorhandenen Daten bleiben erhalten und werden beim ersten Abgleich hochgeladen. Der Grow-Bereich wird mit deiner PIN verschlüsselt, bevor er die Cloud erreicht.' }));
    } else {
      const status = U.el('div', { id: 'sync-status', class: 'muted', text: Mehr.syncText() });
      const offen = U.el('div', { class: 'muted klein' });

      w.append(U.el('div', { class: 'card' }, U.el('div', { class: 'etikett', text: 'Angemeldet als' }), U.el('div', { style: { fontFamily: 'var(--serif)', fontSize: '20px', fontWeight: 600, margin: '2px 0 6px', overflowWrap: 'anywhere' }, text: c.email || '' }), status, offen,
        U.el('div', { class: 'btnreihe', style: { marginTop: '12px' } },
          U.el('button', { class: 'btn', text: 'Jetzt synchronisieren', onclick: async () => { const ok = await Sync.sync(); App.toast(ok ? 'Synchronisiert' : 'Fehler: ' + (Sync.status.fehler || 'unbekannt'), 3500); App.neu(); } }))));
      w.append(App.abschnitt('Wissenswertes'));
      w.append(U.el('div', { class: 'card prose' }, U.md('- Änderungen werden automatisch hochgeladen, sobald du online bist.\n- Auf einem neuen Gerät: anmelden, die Daten kommen zurück; Fotos laden beim Ansehen nach.\n- Gelöschtes wird auch in der Cloud gelöscht.\n- Bei gleichzeitigen Änderungen auf zwei Geräten gewinnt die neuere.\n- Der Grow-Bereich ist verschlüsselt; ohne PIN lässt er sich nicht wiederherstellen.')));
      w.append(U.el('div', { class: 'card flach' },

  async fotosLaden() {

  statistik() {

    const fotos = [...Data.entries.values()].filter((e) => (Data.plants.get(e.plantId) || {}).kind === 'zimmer').reduce((s, e) => s + (e.fotos || []).length, 0);

    const zaehle = (fn) => { const m = new Map(); aktive.forEach((p) => { const k = fn(p); if (k) m.set(k, (m.get(k) || 0) + 1); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); };

    };
    balken('Nach Standort', zaehle((p) => p.standort));

    if (!aktive.length) w.append(App.leer('lineal', 'Noch nichts zu zählen', 'Sobald Pflanzen in deiner Sammlung sind, siehst du hier Zahlen.'));
    return { titel: 'Statistik', zurueck: true, inhalt: w };

        F.wahl('So laden', ['Zu meinen Daten hinzufügen', 'Alles ersetzen'], 'Zu meinen Daten hinzufügen', { pflicht: true }).el);

      const hinweis = U.el('p', { class: 'hinweis', text: 'Pflanzen mit gleicher Kennung werden aktualisiert, alles andere bleibt.' });

        try {
          const r = await Sicherung.einspielen(f, modus, (n, g) => { if (n % 10 === 0) App.toast('Fotos ' + n + ' / ' + g, 3000); });

          App.neu();
        } catch (e) { console.error(e); App.toast('Fehler: ' + (e && e.message || e), 5000); return false; }
      } });
    };
    datei.click();
  },

  /* ---------- Einstellungen ---------- */
  einstellungen() {
    const w = U.el('div');
    w.append(App.abschnitt('Privater Bereich'));
    if (!Privat.aktiv()) {
      w.append(U.el('div', { class: 'card' }, U.el('p', { text: 'Ein zweites Logbuch, das mit PIN gesperrt ist – gedacht für den Grow.' }), U.el('button', { class: 'btn', text: 'Einrichten', onclick: () => Privat.einrichten() })));
    } else {
      w.append(U.el('div', { class: 'card flach' },
        App.schalter('Im Menü verstecken', 'Zugang dann: unten auf „Version“ 5× tippen', Einst.get('pinVerstecken', false), (an) => Einst.set('pinVerstecken', an)),
        App.zeile('PIN ändern', null, 'schloss', () => Privat.pinAendern()),
        App.zeile('Zurücksetzen & Grow-Daten löschen', 'Entfernt PIN und Grow-Logbuch', 'trash', () => Privat.zuruecksetzen())));
    }
    w.append(App.abschnitt('Speicher'));
    const sp = U.el('div', { class: 'card' }, U.el('p', { class: 'muted', style: { margin: 0 }, text: 'Wird berechnet …' }));
    w.append(sp);
    Promise.all([Data.schaetzung(), Data.fotoAnzahl()]).then(([s, n]) => {
      sp.replaceChildren(U.el('p', { style: { margin: 0 }, text: n + ' Fotos im Gerät' + (s ? ' · belegt ' + Math.round(s.belegt / 1048576) + ' MB' : '') }),
        Data.fluechtig ? U.el('div', { class: 'box rot', style: { marginTop: '10px' } }, U.el('b', { text: 'Daten werden nicht gespeichert' }), 'Der Browser blockiert den Speicher (privates Fenster?). Öffne die App normal oder lege sie auf den Home-Bildschirm.') : U.el('p', { class: 'hinweis', text: 'Fotos werden verkleinert (max. 1600 px) gespeichert. Sichere regelmäßig – Browserdaten können gelöscht werden.' }));
    });
    w.append(App.abschnitt('Gefahrenbereich'));
    w.append(U.el('div', { class: 'card flach' }, App.zeile('Alle Daten auf diesem Gerät löschen', Sync.angemeldet() ? 'Aus der Cloud kommt alles beim nächsten Sync zurück' : 'Pflanzen, Einträge, Fotos – ohne Sicherung nicht zurückholbar', 'trash', async () => {
      const cloud = Sync.angemeldet();
      if (await App.bestaetigen('Wirklich alles löschen?', cloud ? 'Alle Daten auf diesem Gerät werden entfernt. Sie bleiben in der Cloud und kommen beim nächsten Abgleich zurück.' : 'Alle Pflanzen, Einträge und Fotos auf diesem Gerät werden entfernt. Lege vorher eine Sicherung an.', { ok: 'Alles löschen', gefahr: true })) {
        await Data.alleLoeschen(false); Einst.del('pin'); Privat.offen = false; Krypto.key = null;
        if (cloud) Sync.cfgSetzen({ cursor: null });
        App.toast('Gelöscht'); App.tab('heute');
        if (cloud) Sync.sync();
      }
    })));
    return { titel: 'Einstellungen', zurueck: true, inhalt: w };
  },
};
App.tabBauer.mehr = () => Mehr.seite();
//# sourceURL=js/mehr.js
</script>
<script>
/* GRUENZEUG – Start: Daten laden, Oberfläche zeigen, Service Worker, Update-Prüfung, ?selftest.
   Updates: Der Service Worker holt die Seite immer zuerst aus dem Netz (offline aus dem Speicher). Beim Zurückkehren
   in die App fragt `Updates` version.json und lädt neu, sobald gerade kein Formular offen ist. */
const Updates = {
  async pruefen(manuell) {
    if (typeof GRUEN_BUILD === 'undefined' || location.protocol === 'file:') { if (manuell) App.toast('Entwicklungsfassung – keine Updates'); return; }
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      const v = await r.json();
      if (v.id && v.id !== GRUEN_BUILD.id) {
        if (document.querySelector('.sheet-bg, .lupe')) { Updates.wartet = true; if (manuell) App.toast('Update bereit – nach dem Schließen wird neu geladen'); return; }
        App.toast('Neue Version wird geladen …'); setTimeout(() => location.reload(), 600);
      } else if (manuell) App.toast('Du hast die neueste Version');
    } catch (e) { if (manuell) App.toast('Keine Verbindung – Update-Prüfung nicht möglich'); }
  },
};

const Splash = {
  t0: performance.now(),
  weg() {
    const s = document.getElementById('splash');
    if (!s) return;
    const rest = Math.max(0, 1100 - (performance.now() - Splash.t0));
    setTimeout(() => { s.classList.add('weg'); setTimeout(() => s.remove(), 600); }, /[?&]selftest/.test(location.search) ? 0 : rest);
  },
};

(async function start() {
  try {
    await Data.load();
    App.init();
    Splash.weg();
    if (Data.fluechtig) App.toast('Speicher blockiert – Daten bleiben nicht erhalten', 5000);
  } catch (e) {
    console.error(e);
    document.getElementById('app').append(U.el('div', { style: { padding: '30px', fontFamily: 'sans-serif' } }, U.el('h2', { text: 'Gruenzeug konnte nicht starten' }), U.el('p', { text: String(e && e.message || e) })));
    return;
  }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && typeof GRUEN_BUILD !== 'undefined') {
    navigator.serviceWorker.register('sw.js').catch(() => { /* ohne Service Worker geht es auch, nur nicht offline */ });
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { Updates.pruefen(false); Sync.sync(); Spiel.tabPunkt(); } else Spiel.speichern(true); });
  setInterval(() => { if (document.visibilityState === 'visible') Spiel.tabPunkt(); }, 60 * 1000);
  Spiel.tabPunkt();
  window.addEventListener('online', () => Sync.sync());
  setInterval(() => { if (document.visibilityState === 'visible') Sync.sync(); }, 5 * 60 * 1000);
  setTimeout(() => Updates.pruefen(false), 3000);
  if (!/[?&]selftest/.test(location.search)) setTimeout(() => Sync.sync(), 800);
  if (/[?&]selftest/.test(location.search)) {
    const s = document.createElement('script'); s.src = 'selftest.js'; document.body.append(s);
  }
})();

window.gruen = { Spiel, Kunst, Fx, App, Data, Gruen, Einst, Sicherung, Pflege, Privat, Updates, U, Zip, Sync, Krypto };
//# sourceURL=js/main.js
</script>
