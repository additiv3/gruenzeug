<script>
/* GRUENZEUG – Daten: IndexedDB (Pflanzen, Einträge, Fotos, Merkliste, Sync-Warteschlange), Einstellungen in localStorage,
   Sicherung als ZIP. Pflanzen und Einträge liegen zusätzlich im Speicher (Map): die Oberfläche liest synchron, jede
   Änderung wird sofort in IndexedDB geschrieben und – wenn angemeldet – für den Cloud-Sync vorgemerkt (js/sync.js).
   Jedes Dokument trägt `u` (Zeitpunkt der letzten Änderung, ms): bei Konflikten gewinnt das neuere.
   Läuft nur im Browser. */
const SCHEMA = 2;   // Format der gespeicherten Daten. Änderungen → erhöhen und Übergang in Data.migrieren()

/** Einstellungen im Gerät (localStorage, immer mit try/catch: kann blockiert sein) */
const Einst = {
  get(k, dflt) { try { const v = localStorage.getItem('gruen.' + k); return v == null ? dflt : JSON.parse(v); } catch (e) { return dflt; } },
  set(k, v) { try { localStorage.setItem('gruen.' + k, JSON.stringify(v)); } catch (e) { /* ignorieren */ } },
  del(k) { try { localStorage.removeItem('gruen.' + k); } catch (e) { /* ignorieren */ } },
};

const Data = {
  db: null,
  fluechtig: false,          // true = IndexedDB nicht verfügbar (z. B. privates Fenster): nichts bleibt erhalten
  plants: new Map(),
  entries: new Map(),
  meta: {},                  // schema, wunsch, wunschU, upl (Fotos, die schon in der Cloud liegen)
  _urls: new Map(),          // 'id:t' / 'id:f' → Objekt-URL

  /* ---------- IndexedDB-Grundlagen ---------- */
  _open() {
    return new Promise((res, rej) => {
      if (typeof indexedDB === 'undefined') return rej(new Error('kein IndexedDB'));
      const r = indexedDB.open('gruenzeug', 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('plants')) d.createObjectStore('plants', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('entries')) d.createObjectStore('entries', { keyPath: 'id' }).createIndex('plantId', 'plantId');
        if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
        if (!d.objectStoreNames.contains('outbox')) d.createObjectStore('outbox', { keyPath: 'key' });   // Version 2: Sync-Warteschlange
        if (!d.objectStoreNames.contains('cipher')) d.createObjectStore('cipher', { keyPath: 'key' });   // Version 2: verschlüsselte Cloud-Daten, noch gesperrt
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('blockiert'));
    });
  },
  _req(store, mode, fn) {
    if (!Data.db) return Promise.resolve(undefined);
    return new Promise((res, rej) => {
      const tx = Data.db.transaction(store, mode);
      const out = fn(tx);
      tx.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('abgebrochen'));
    });
  },
  _getAll(store) { return Data._req(store, 'readonly', (tx) => tx.objectStore(store).getAll()).then((r) => r || []); },
  _put(store, obj) { return Data._req(store, 'readwrite', (tx) => { tx.objectStore(store).put(obj); }); },
  _del(store, id) { return Data._req(store, 'readwrite', (tx) => { tx.objectStore(store).delete(id); }); },
  _clear(store) { return Data._req(store, 'readwrite', (tx) => { tx.objectStore(store).clear(); }); },
  _get(store, id) { return Data._req(store, 'readonly', (tx) => tx.objectStore(store).get(id)); },

  /* ---------- Laden ---------- */
  async load() {
    try { Data.db = await Data._open(); } catch (e) { Data.db = null; Data.fluechtig = true; }
    Data.plants.clear(); Data.entries.clear(); Data.meta = {};
    for (const p of await Data._getAll('plants')) { if (!p.u) p.u = p.erstellt || 1; Data.plants.set(p.id, p); }
    for (const e of await Data._getAll('entries')) { if (!e.u) e.u = e.ts || 1; Data.entries.set(e.id, e); }
    for (const m of await Data._getAll('meta')) Data.meta[m.key] = m.value;
    await Data.migrieren();
  },
  async migrieren() {
    const v = Data.meta.schema || 0;
    if (v < SCHEMA) await Data.setMeta('schema', SCHEMA);   // 1 → 2: nur neue Speicher (Warteschlange); Dokumente bekommen `u` beim Laden
    if (!Data.meta.upl) Data.meta.upl = {};
  },
  async setMeta(key, value) { Data.meta[key] = value; await Data._put('meta', { key, value }); },

  /* ---------- Pflanzen ---------- */
  neuePflanze(kind, felder) {
    return Object.assign({ id: U.uid(), kind: kind || 'zimmer', name: '', status: 'aktiv', fakten: [], erstellt: Date.now() }, felder || {});
  },
  async savePlant(p) {
    p.u = Date.now();
    Data.plants.set(p.id, p);
    await Data._put('plants', p);
    await Sync.nachSpeichern('plant', p);
    return p;
  },
  /** Pflanze, ihre Einträge und die nur von ihr benutzten Fotos löschen */
  async delPlant(id) {
    const p = Data.plants.get(id);
    if (!p) return;
    const fotos = new Set(p.titelFoto ? [p.titelFoto] : []);
    for (const e of Data.eintraege(id)) { (e.fotos || []).forEach((f) => fotos.add(f)); Data.entries.delete(e.id); await Data._del('entries', e.id); await Sync.nachLoeschen('entry', e.id); }
    Data.plants.delete(id);
    await Data._del('plants', id);
    await Sync.nachLoeschen('plant', id);
    for (const q of [...Data.plants.values()]) if (q.mutter === id) { delete q.mutter; await Data.savePlant(q); }
    const benutzt = Data.benutzteFotos();
    for (const f of fotos) if (!benutzt.has(f)) await Data.delFoto(f);
  },
  liste(kind, status) {
    return [...Data.plants.values()].filter((p) => p.kind === kind && (!status || (status === 'aktiv' ? p.status === 'aktiv' : p.status !== 'aktiv')));
  },

  /* ---------- Einträge ---------- */
  neuerEintrag(plantId, typ, felder) {
    return Object.assign({ id: U.uid(), plantId, typ, datum: U.heute(), ts: Date.now(), text: '', fotos: [], werte: {} }, felder || {});
  },
  async saveEntry(e) {
    e.u = Date.now();
    Data.entries.set(e.id, e);
    await Data._put('entries', e);
    await Sync.nachSpeichern('entry', e);
    return e;
  },
  async delEntry(id) {
    const e = Data.entries.get(id);
    if (!e) return;
    Data.entries.delete(id);
    await Data._del('entries', id);
    await Sync.nachLoeschen('entry', id);
    const benutzt = Data.benutzteFotos();
    for (const f of e.fotos || []) if (!benutzt.has(f)) await Data.delFoto(f);
  },
  /** Einträge einer Pflanze, neueste zuerst */
  eintraege(plantId) {
    const out = [];
    for (const e of Data.entries.values()) if (e.plantId === plantId) out.push(e);
    return out.sort((a, b) => (a.datum < b.datum ? 1 : a.datum > b.datum ? -1 : b.ts - a.ts));
  },
  letzter(plantId, typ) { return Data.eintraege(plantId).find((e) => e.typ === typ) || null; },
  benutzteFotos() {
    const s = new Set();
    for (const p of Data.plants.values()) if (p.titelFoto) s.add(p.titelFoto);
    for (const e of Data.entries.values()) (e.fotos || []).forEach((f) => s.add(f));
    return s;
  },

  /** Änderungen aus der Cloud übernehmen: ohne erneutes Vormerken zum Hochladen */
  async setzeLokal(kind, obj) {
    (kind === 'plant' ? Data.plants : Data.entries).set(obj.id, obj);
    await Data._put(kind === 'plant' ? 'plants' : 'entries', obj);
  },
  async entferneLokal(kind, id) {
    const map = kind === 'plant' ? Data.plants : Data.entries;
    const alt = map.get(id);
    if (!alt) return false;
    map.delete(id);
    await Data._del(kind === 'plant' ? 'plants' : 'entries', id);
    const fotos = kind === 'plant' ? (alt.titelFoto ? [alt.titelFoto] : []) : (alt.fotos || []);
    const benutzt = Data.benutzteFotos();
    for (const f of fotos) if (!benutzt.has(f)) await Data.delFoto(f, true);
    return true;
  },

  /* ---------- Fotos ---------- */
  async addFoto(file) {
    const b = await U.bildVerkleinern(file);
    const f = { id: U.uid(), full: b.full, thumb: b.thumb, w: b.w, h: b.h, ts: Date.now() };
    await Data._put('photos', f);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    return f.id;
  },
  /** Foto laden; fehlt es im Gerät und man ist angemeldet, kommt es aus der Cloud */
  async foto(id) {
    const f = await Data._get('photos', id);
    if (f || !Sync.angemeldet()) return f;
    return Sync.fotoHolen(id);
  },
  async delFoto(id, stumm) {
    for (const k of [id + ':t', id + ':f']) { const u = Data._urls.get(k); if (u) { URL.revokeObjectURL(u); Data._urls.delete(k); } }
    await Data._del('photos', id);
    if (Data.meta.upl && Data.meta.upl[id]) { delete Data.meta.upl[id]; await Data.setMeta('upl', Data.meta.upl); }
    if (!stumm) await Sync.nachFotoLoeschen(id);
  },
  /** Objekt-URL für ein Foto (zwischengespeichert). thumb=true → kleine Vorschau */
  async url(id, thumb) {
    const k = id + (thumb ? ':t' : ':f');
    if (Data._urls.has(k)) return Data._urls.get(k);
    const f = await Data.foto(id);
    if (!f) return null;
    const u = URL.createObjectURL(thumb ? f.thumb : f.full);
    Data._urls.set(k, u);
    return u;
  },

  /* ---------- Merkliste (Wunschpflanzen aus dem Lexikon) ---------- */
  wunsch() { return Data.meta.wunsch || []; },
  async wunschSpeichern(liste) {
    await Data.setMeta('wunsch', liste);
    await Data.setMeta('wunschU', Date.now());
    await Sync.nachMeta('wunsch');
  },
  async wunschSetzen(artId, an) {
    const w = Data.wunsch().filter((x) => x !== artId);
    if (an) w.push(artId);
    await Data.wunschSpeichern(w);
  },

  /* ---------- Speicherplatz ---------- */
  async schaetzung() {
    try { const s = await navigator.storage.estimate(); return { belegt: s.usage || 0, gesamt: s.quota || 0 }; } catch (e) { return null; }
  },
  async fotoAnzahl() { return Data.db ? (await Data._req('photos', 'readonly', (tx) => tx.objectStore('photos').count())) || 0 : 0; },

  /** Alles im Gerät löschen. mitCloud: angemeldet → in der Cloud als gelöscht markieren (sonst nur lokal, alles kommt beim nächsten Sync zurück) */
  async alleLoeschen(mitCloud) {
    const grab = [];
    if (mitCloud && Sync.angemeldet()) {
      for (const p of Data.plants.values()) grab.push(['plant', p.id]);
      for (const e of Data.entries.values()) grab.push(['entry', e.id]);
    }
    for (const s of ['plants', 'entries', 'photos', 'meta', 'outbox', 'cipher']) await Data._clear(s);
    for (const u of Data._urls.values()) URL.revokeObjectURL(u);
    Data._urls.clear();
    Data.plants.clear(); Data.entries.clear(); Data.meta = {};
    if (typeof Spiel !== 'undefined') Spiel.vergessen();
    await Data.setMeta('schema', SCHEMA);
    Data.meta.upl = {};
    for (const [k, id] of grab) await Sync.nachLoeschen(k, id);
  },
};

/** Sicherung: ZIP mit data.json + photos/<id>.jpg */
const Sicherung = {
  /** opt.ohnePrivat: Cannabis-Logbuch auslassen. → Blob */
  async erstellen(opt) {
    opt = opt || {};
    const plants = [...Data.plants.values()].filter((p) => !(opt.ohnePrivat && p.kind === 'cannabis'));
    const ids = new Set(plants.map((p) => p.id));
    const entries = [...Data.entries.values()].filter((e) => ids.has(e.plantId));
    const fotoIds = new Set();
    plants.forEach((p) => p.titelFoto && fotoIds.add(p.titelFoto));
    entries.forEach((e) => (e.fotos || []).forEach((f) => fotoIds.add(f)));
    const meta = {};
    if (Data.meta.wunsch) meta.wunsch = Data.meta.wunsch;
    if (Data.meta.spiel) meta.spiel = Data.meta.spiel;
    const dateien = [];
    const fotos = [];
    for (const id of fotoIds) {
      const f = await Data.foto(id);
      if (!f) continue;
      fotos.push({ id, ts: f.ts, w: f.w, h: f.h });
      dateien.push({ name: 'photos/' + id + '.jpg', data: f.full });
    }
    const info = { app: 'gruenzeug', schema: SCHEMA, exportiert: new Date().toISOString(), plants, entries, meta, photos: fotos };
    dateien.unshift({ name: 'data.json', data: JSON.stringify(info) });
    return Zip.make(dateien);
  },
  async lesen(file) {
    const z = await Zip.read(file);
    const j = z.get('data.json');
    if (!j) throw new Error('Das ist keine Gruenzeug-Sicherung (data.json fehlt).');
    const info = JSON.parse(new TextDecoder().decode(j));
    if (info.app !== 'gruenzeug') throw new Error('Das ist keine Gruenzeug-Sicherung.');
    if (info.schema > SCHEMA) throw new Error('Die Sicherung stammt aus einer neueren App-Version. Bitte die App aktualisieren.');
    return { info, z };
  },
  /** Prüft Pflanzen und Einträge aus einer Datei (Sicherung, Cloud): nur wohlgeformte Dokumente kommen durch, alles andere
      wird verworfen. Schützt die Oberfläche vor kaputten oder manipulierten Dateien. → {plants, entries, verworfen} */
  pruefe(info) {
    const idOk = (x) => typeof x === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(x);
    const txt = (x, n) => x == null || (typeof x === 'string' && x.length <= (n || 4000));
    const obj = (x) => x && typeof x === 'object' && !Array.isArray(x);
    const fotos = (a) => Array.isArray(a) && a.length <= 60 && a.every(idOk);
    let verworfen = 0;
    const plants = (Array.isArray(info.plants) ? info.plants : []).filter((p) => {
      const ok = obj(p) && idOk(p.id) && Gruen.KINDER[p.kind] && typeof p.name === 'string' && p.name.length <= 200 && txt(p.art, 300) && txt(p.standort, 200) && txt(p.notiz, 20000)
        && (p.titelFoto == null || idOk(p.titelFoto)) && (p.fakten == null || Array.isArray(p.fakten)) && (p.status == null || typeof p.status === 'string');
      if (!ok) verworfen++;
      return ok;
    });
    const entries = (Array.isArray(info.entries) ? info.entries : []).filter((e) => {
      const ok = obj(e) && idOk(e.id) && idOk(e.plantId) && typeof e.typ === 'string' && e.typ.length <= 40 && /^\d{4}-\d{2}-\d{2}$/.test(e.datum || '') && txt(e.text, 20000)
        && (e.fotos == null || fotos(e.fotos)) && (e.werte == null || obj(e.werte));
      if (!ok) verworfen++;
      return ok;
    });
    const photos = (Array.isArray(info.photos) ? info.photos : []).filter((f) => obj(f) && idOk(f.id));
    return { plants, entries, photos, verworfen };
  },
  /** modus 'zusammen' (vorhandene Daten bleiben, gleiche IDs werden überschrieben) oder 'ersetzen'. → Zähler */
  async einspielen(file, modus, fortschritt) {
    const { info: roh, z } = await Sicherung.lesen(file);
    const geprueft = Sicherung.pruefe(roh);
    const info = Object.assign({}, roh, { plants: geprueft.plants, entries: geprueft.entries, photos: geprueft.photos });
    if (modus === 'ersetzen') await Data.alleLoeschen(true);
    let n = 0;
    for (const f of info.photos || []) {
      const bytes = z.get('photos/' + f.id + '.jpg');
      if (!bytes) continue;
      const blob = new Blob([bytes], { type: 'image/jpeg' });
      let thumb = blob, w = f.w, h = f.h;
      try { const b = await U.bildVerkleinern(blob); thumb = b.thumb; w = b.w; h = b.h; } catch (e) { /* Vorschau = Original */ }
      await Data._put('photos', { id: f.id, full: blob, thumb, w, h, ts: f.ts || Date.now() });
      if (fortschritt) fortschritt(++n, info.photos.length);
    }
    for (const p of info.plants || []) await Data.savePlant(p);
    for (const e of info.entries || []) await Data.saveEntry(e);
    const m = info.meta || {};
    if (m.wunsch) await Data.wunschSpeichern([...new Set([...Data.wunsch(), ...m.wunsch])]);
    const sp = Spiel.saeubern(m.spiel);
    if (sp && (modus === 'ersetzen' || (sp.u || 0) > (Data.meta.spielU || 0))) { await Data.setMeta('spiel', sp); await Data.setMeta('spielU', sp.u || Date.now()); Spiel.vergessen(); await Sync.nachMeta('spiel'); }
    return { pflanzen: info.plants.length, eintraege: info.entries.length, fotos: info.photos.length, verworfen: geprueft.verworfen };
  },
  /** Datei speichern: auf dem Handy über das Teilen-Menü, sonst Download */
  async speichern(blob, name, typ) {
    const file = new File([blob], name, { type: typ || 'application/zip' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: typ ? 'Gruenzeug' : 'Gruenzeug-Sicherung' }); return 'geteilt'; }
      catch (e) { if (e && e.name === 'AbortError') return 'abgebrochen'; }
    }
    const a = U.el('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 20000);
    return 'download';
  },
};

<script>
/* GRUENZEUG – Cloud-Sync mit Supabase (Frankfurt). Lokal zuerst: die App arbeitet immer auf den Daten im Gerät,
   der Sync gleicht im Hintergrund ab.

   Aufbau in der Cloud (docs/supabase.sql): Tabelle `docs` (kind plant|entry|meta, id, data, u, deleted, srv) und der
   private Speicher `photos` (<user>/<fotoId>.jpg bzw. .enc). Zeilenschutz (RLS): jeder sieht nur seine eigenen Zeilen.

   Ablauf einer Synchronisierung: 1. neue Zeilen holen (srv > Merkzeichen), je Dokument gewinnt das neuere `u`;
   2. Warteschlange (IndexedDB `outbox`) hochladen; 3. Fotos hochladen/löschen. Gelöschtes wird als Grabstein
   (deleted) gespeichert. Der private Bereich wird vor dem Hochladen mit dem PIN-Schlüssel verschlüsselt (Krypto);
   solange er gesperrt ist, bleibt verschlüsselte Cloud-Ware in `cipher`, bis die PIN eingegeben wird.
   Läuft nur im Browser. Für Tests kann `Sync.test = {url, key}` auf einen lokalen Nachbau zeigen (tools/mock_supabase.py). */
const Sync = {
  URL: 'https://ujzlexupbvunxjbgwsjw.supabase.co',
  KEY: 'sb_publishable_1Px9I71_lvP09KRJ13YeWQ_zArrYpHM',     // „publishable“: darf öffentlich im Code stehen, die Daten schützt der Login
  test: null,
  status: { laeuft: false, fehler: null, zaehler: 0 },
  _timer: null,
  _holen: new Map(),

  basis() { return (Sync.test && Sync.test.url) || Sync.URL; },
  apikey() { return (Sync.test && Sync.test.key) || Sync.KEY; },
  cfg() { return Einst.get('sync', null); },
  cfgSetzen(teil) { Einst.set('sync', Object.assign({}, Sync.cfg(), teil)); },
  angemeldet() { const c = Sync.cfg(); return !!(c && c.refresh); },

  /* ---------- Anmeldung ---------- */
  _fehlertext(j, status) {
    const m = String((j && (j.msg || j.message || j.error_description || j.error)) || '');
    if (/invalid login/i.test(m)) return 'E-Mail oder Passwort stimmt nicht.';
    if (/already registered|already been registered/i.test(m)) return 'Zu dieser E-Mail gibt es schon ein Konto – bitte anmelden.';
    if (/email not confirmed/i.test(m)) return 'Die E-Mail ist noch nicht bestätigt – bitte den Link in der Bestätigungs-Mail anklicken.';
    if (/rate limit|too many/i.test(m)) return 'Zu viele Versuche – bitte kurz warten.';
    if (/password/i.test(m) && /characters|weak/i.test(m)) return 'Das Passwort ist zu kurz oder zu einfach.';
    return m || ('Fehler ' + status);
  },
  async _auth(pfad, body) {
    let r;
    try { r = await fetch(Sync.basis() + '/auth/v1/' + pfad, { method: 'POST', headers: { apikey: Sync.apikey(), 'content-type': 'application/json' }, body: JSON.stringify(body) }); }
    catch (e) { throw new Error('Keine Verbindung zum Server.'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(Sync._fehlertext(j, r.status));
    return j;
  },
  _sitzung(j, email) {
    const alt = Sync.cfg() || {};
    const uid = (j.user && j.user.id) || alt.uid;
    // anderer Account als zuvor: Merkzeichen zurücksetzen, sonst würden Daten des alten Kontos fehlen
    const gleich = alt.uid && alt.uid === uid;
    Einst.set('sync', { uid, email: email || (j.user && j.user.email) || alt.email, access: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000, cursor: gleich ? alt.cursor || null : null, letzte: gleich ? alt.letzte || null : null, privatOffen: gleich ? alt.privatOffen : false });
  },
  /** → 'angemeldet' | 'bestaetigen' */
  async registrieren(email, pw) {
    const j = await Sync._auth('signup', { email, password: pw });
    if (!j.access_token) return 'bestaetigen';
    Sync._sitzung(j, email);
    return 'angemeldet';
  },
  async anmelden(email, pw) {
    const j = await Sync._auth('token?grant_type=password', { email, password: pw });
    Sync._sitzung(j, email);
    return 'angemeldet';
  },
  /** behalten=true: Daten im Gerät bleiben, aber ohne Sync. */
  async abmelden() {
    Einst.del('sync');
    clearTimeout(Sync._timer);
    await Data._clear('outbox'); await Data._clear('cipher');
    Sync.status.fehler = null;
  },
  async token(erzwingen) {
    const c = Sync.cfg();
    if (!c || !c.refresh) throw new Error('Nicht angemeldet');
    if (!erzwingen && c.exp > Date.now() + 60000) return c.access;
    const j = await Sync._auth('token?grant_type=refresh_token', { refresh_token: c.refresh }).catch((e) => { throw new Error(/Verbindung/.test(e.message) ? e.message : 'Sitzung abgelaufen – bitte neu anmelden.'); });
    Sync._sitzung(j);
    return j.access_token;
  },
  async _anf(pfad, o) {
    o = o || {};
    const bau = async (t) => fetch(Sync.basis() + pfad, { method: o.method || 'GET', headers: Object.assign({ apikey: Sync.apikey(), Authorization: 'Bearer ' + t }, o.headers || {}), body: o.body });
    let r;
    try { r = await bau(await Sync.token()); if (r.status === 401) r = await bau(await Sync.token(true)); }
    catch (e) { if (/Sitzung|Nicht angemeldet/.test(e.message)) throw e; throw new Error('Keine Verbindung zum Server.'); }
    return r;
  },
  async _serverFehler(r, was) {
    const j = await r.json().catch(() => ({}));
    const m = (j && (j.message || j.error || j.msg)) || '';
    if (r.status === 404 && /relation|table/i.test(m + '')) return new Error('Die Tabellen fehlen in Supabase – bitte das SQL-Skript ausführen.');
    return new Error((was || 'Server') + ': ' + (m || r.status));
  },

  /* ---------- Vormerken (von Data aufgerufen) ---------- */
  istPrivat(kind, obj) {
    if (kind === 'plant') return obj.kind === 'cannabis';
    const p = Data.plants.get(obj.plantId);
    return !!p && p.kind === 'cannabis';
  },
  fotoPrivat(id) {
    for (const p of Data.plants.values()) if (p.kind === 'cannabis' && p.titelFoto === id) return true;
    for (const e of Data.entries.values()) if ((e.fotos || []).includes(id) && Sync.istPrivat('entry', e)) return true;
    return false;
  },
  async _zeile(kind, obj) {
    let data = obj;
    if (Sync.istPrivat(kind, obj)) {
      if (!Krypto.key) { Sync.cfgSetzen({ privatOffen: true }); return null; }   // gesperrt: später beim Entsperren nachholen
      data = { _enc: await Krypto.enc(obj) };
    }
    return { kind, id: obj.id, data, u: obj.u, deleted: false };
  },
  async _einreihen(kind, obj) {
    const row = await Sync._zeile(kind, obj);
    if (row) await Data._put('outbox', { key: 'doc:' + kind + ':' + obj.id, row });
  },
  async _fotoMerken(id) {
    if (id && !(Data.meta.upl || {})[id]) await Data._put('outbox', { key: 'foto:' + id, id });
  },
  async nachSpeichern(kind, obj) {
    if (!Sync.angemeldet()) return;
    await Sync._einreihen(kind, obj);
    for (const f of kind === 'plant' ? (obj.titelFoto ? [obj.titelFoto] : []) : (obj.fotos || [])) await Sync._fotoMerken(f);
    Sync.planen();
  },
  async nachLoeschen(kind, id) {
    if (!Sync.angemeldet()) return;
    await Data._put('outbox', { key: 'doc:' + kind + ':' + id, row: { kind, id, data: null, u: Date.now(), deleted: true } });
    Sync.planen();
  },
  async nachMeta(id) {
    if (!Sync.angemeldet()) return;
    if (id === 'wunsch') await Data._put('outbox', { key: 'doc:meta:wunsch', row: { kind: 'meta', id: 'wunsch', data: { v: Data.wunsch() }, u: Data.meta.wunschU || Date.now(), deleted: false } });
    if (id === 'spiel' && Data.meta.spiel) await Data._put('outbox', { key: 'doc:meta:spiel', row: { kind: 'meta', id: 'spiel', data: Data.meta.spiel, u: Data.meta.spielU || Date.now(), deleted: false } });
    if (id === 'privat') {
      const c = Einst.get('pin', null);
      await Data._put('outbox', { key: 'doc:meta:privat', row: c ? { kind: 'meta', id: 'privat', data: c, u: c.u || Date.now(), deleted: false } : { kind: 'meta', id: 'privat', data: null, u: Date.now(), deleted: true } });
    }
    Sync.planen();
  },
  async nachFotoLoeschen(id) {
    if (!Sync.angemeldet()) return;
    await Data._del('outbox', 'foto:' + id);
    await Data._put('outbox', { key: 'fotodel:' + id, id });
    Sync.planen();
  },
  planen() {
    clearTimeout(Sync._timer);
    Sync._timer = setTimeout(() => Sync.sync(), Sync.test ? 50 : 2500);
  },
  /** Anzahl noch nicht hochgeladener Änderungen */
  async offen() { return (await Data._getAll('outbox')).length; },

  /* ---------- Synchronisieren ---------- */
  async sync() {
    if (!Sync.angemeldet() || Sync.status.laeuft) return false;
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return false;
    Sync.status.laeuft = true;
    Sync._meldung();
    try {
      await Sync.token();
      const geaendert = await Sync._ziehen();
      await Sync._schieben();
      await Data.setMeta('upl', Data.meta.upl || {});
      Sync.status.fehler = null;
      Sync.cfgSetzen({ letzte: Date.now() });
      if (geaendert) Sync._neuZeichnen();
      return true;
    } catch (e) {
      Sync.status.fehler = e && e.message || String(e);
      return false;
    } finally {
      Sync.status.laeuft = false;
      Sync._meldung();
    }
  },
  _meldung() { if (typeof Mehr !== 'undefined' && Mehr.syncAnzeige) Mehr.syncAnzeige(); },
  _neuZeichnen() { if (typeof App !== 'undefined' && App._bereit && !document.querySelector('.sheet-bg, .lupe')) App.neu(); },

  /** Neues aus der Cloud holen und übernehmen. → true, wenn sich lokal etwas geändert hat */
  async _ziehen() {
    const c = Sync.cfg();
    let cursor = c.cursor || null;
    const erstmals = !cursor;
    const remote = new Map();
    let geaendert = false;
    for (;;) {
      let q = '/rest/v1/docs?select=kind,id,data,u,deleted,srv&order=srv.asc&limit=500';
      if (cursor) q += '&srv=gte.' + encodeURIComponent(cursor);
      const r = await Sync._anf(q);
      if (!r.ok) throw await Sync._serverFehler(r, 'Laden');
      const rows = await r.json();
      for (const z of rows) { remote.set(z.kind + ':' + z.id, z.u); if (await Sync._anwenden(z)) geaendert = true; }
      const letzt = rows.length ? rows[rows.length - 1].srv : cursor;
      if (rows.length < 500 || letzt === cursor) { cursor = letzt; break; }
      cursor = letzt;
    }
    Sync.cfgSetzen({ cursor });
    if (erstmals) await Sync._lokalesAnbieten(remote);
    return geaendert;
  },

  /** Ein Dokument aus der Cloud anwenden. → true, wenn lokal geändert */
  async _anwenden(z) {
    const okey = 'doc:' + z.kind + ':' + z.id;
    const ob = await Data._get('outbox', okey);
    if (ob) { if (ob.row.u >= z.u) return false; await Data._del('outbox', okey); }   // lokal gleich alt oder neuer (z. B. neu verschlüsselt): bleibt, wird hochgeladen
    if (z.deleted) {
      if (z.kind === 'meta') {
        if (z.id === 'privat' && Einst.get('pin', null)) { Einst.del('pin'); Krypto.key = null; Privat.offen = false; return true; }
        return false;
      }
      const lokal = (z.kind === 'plant' ? Data.plants : Data.entries).get(z.id);
      if (!lokal || lokal.u > z.u) return false;
      return Data.entferneLokal(z.kind, z.id);
    }
    if (z.kind === 'meta') return Sync._metaAnwenden(z);
    if (z.data && z.data._enc) {
      await Data._put('cipher', { key: z.kind + ':' + z.id, row: z });
      return Krypto.key ? Sync._cipherAnwenden(z) : false;
    }
    return Sync._docAnwenden(z.kind, z.data, z.u);
  },
  async _docAnwenden(kind, obj, u) {
    const lokal = (kind === 'plant' ? Data.plants : Data.entries).get(obj.id);
    if (lokal && lokal.u >= u) return false;
    obj.u = u;
    await Data.setzeLokal(kind, obj);
    return true;
  },
  async _cipherAnwenden(z) {
    let obj;
    try { obj = await Krypto.dec(z.data._enc); } catch (e) { return false; }
    await Data._del('cipher', z.kind + ':' + z.id);
    return Sync._docAnwenden(z.kind, obj, z.u);
  },
  async _metaAnwenden(z) {
    if (z.id === 'wunsch') {
      if ((Data.meta.wunschU || 0) >= z.u) return false;
      await Data.setMeta('wunsch', z.data.v || []); await Data.setMeta('wunschU', z.u);
      return true;
    }
    if (z.id === 'spiel') {
      const neu = Spiel.saeubern(z.data);
      if (!neu || (Data.meta.spielU || 0) >= z.u) return false;
      neu.u = z.u; await Data.setMeta('spiel', neu); await Data.setMeta('spielU', z.u); Spiel.vergessen();
      return true;
    }
    if (z.id === 'privat') {
      const lokal = Einst.get('pin', null);
      if (lokal && (lokal.u || 0) >= z.u) return false;
      if (lokal && lokal.salt !== z.data.salt) { Krypto.key = null; Privat.offen = false; }
      Einst.set('pin', z.data);
      return true;
    }
    return false;
  },

  /** Beim ersten Abgleich: alles, was lokal neuer ist oder in der Cloud fehlt, vormerken */
  async _lokalesAnbieten(remote) {
    const neuer = (kind, o) => !remote.has(kind + ':' + o.id) || remote.get(kind + ':' + o.id) < o.u;
    for (const p of Data.plants.values()) if (neuer('plant', p)) { await Sync._einreihen('plant', p); if (p.titelFoto) await Sync._fotoMerken(p.titelFoto); }
    for (const e of Data.entries.values()) if (neuer('entry', e)) { await Sync._einreihen('entry', e); for (const f of e.fotos || []) await Sync._fotoMerken(f); }
    if (Data.wunsch().length && (!remote.has('meta:wunsch') || remote.get('meta:wunsch') < (Data.meta.wunschU || 1))) { if (!Data.meta.wunschU) await Data.setMeta('wunschU', Date.now()); await Sync.nachMeta('wunsch'); }
    if (Data.meta.spiel && (!remote.has('meta:spiel') || remote.get('meta:spiel') < (Data.meta.spielU || 1))) { if (!Data.meta.spielU) await Data.setMeta('spielU', Data.meta.spiel.u || Date.now()); await Sync.nachMeta('spiel'); }
    const pin = Einst.get('pin', null);
    if (pin && !remote.has('meta:privat')) { if (!pin.u) { pin.u = Date.now(); Einst.set('pin', pin); } await Sync.nachMeta('privat'); }
  },

  /** Warteschlange hochladen */
  async _schieben() {
    const c = Sync.cfg();
    const items = await Data._getAll('outbox');
    const docs = items.filter((i) => i.row);
    for (let i = 0; i < docs.length; i += 100) {
      const teil = docs.slice(i, i + 100);
      const r = await Sync._anf('/rest/v1/docs?on_conflict=user_id,kind,id', { method: 'POST', headers: { 'content-type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(teil.map((x) => Object.assign({ user_id: c.uid }, x.row))) });
      if (!r.ok) throw await Sync._serverFehler(r, 'Hochladen');
      for (const x of teil) { const jetzt = await Data._get('outbox', x.key); if (jetzt && jetzt.row.u === x.row.u) await Data._del('outbox', x.key); }
    }
    for (const it of items.filter((i) => i.key.startsWith('foto:'))) await Sync._fotoHoch(it);
    for (const it of items.filter((i) => i.key.startsWith('fotodel:'))) await Sync._fotoWeg(it);
  },
  async _fotoHoch(it) {
    const c = Sync.cfg();
    const f = await Data._get('photos', it.id);
    if (!f) { await Data._del('outbox', it.key); return; }
    const privat = Sync.fotoPrivat(it.id);
    let body, pfad, typ;
    if (privat) {
      if (!Krypto.key) { Sync.cfgSetzen({ privatOffen: true }); return; }
      body = new Blob([await Krypto.encBytes(new Uint8Array(await f.full.arrayBuffer()))]); pfad = c.uid + '/' + it.id + '.enc'; typ = 'application/octet-stream';
    } else { body = f.full; pfad = c.uid + '/' + it.id + '.jpg'; typ = 'image/jpeg'; }
    const r = await Sync._anf('/storage/v1/object/photos/' + pfad, { method: 'POST', headers: { 'content-type': typ, 'x-upsert': 'true' }, body });
    if (!r.ok) throw await Sync._serverFehler(r, 'Foto hochladen');
    (Data.meta.upl = Data.meta.upl || {})[it.id] = 1;
    await Data._del('outbox', it.key);
  },
  async _fotoWeg(it) {
    const c = Sync.cfg();
    const r = await Sync._anf('/storage/v1/object/photos', { method: 'DELETE', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ prefixes: [c.uid + '/' + it.id + '.jpg', c.uid + '/' + it.id + '.enc'] }) });
    if (!r.ok) throw await Sync._serverFehler(r, 'Foto löschen');
    await Data._del('outbox', it.key);
  },

  /** Foto, das nur in der Cloud liegt, herunterladen und lokal speichern (Original + Vorschau) */
  fotoHolen(id) {
    if (Sync._holen.has(id)) return Sync._holen.get(id);
    const p = (async () => {
      const c = Sync.cfg();
      let bytes = null;
      for (const ext of ['jpg', 'enc']) {
        if (ext === 'enc' && !Krypto.key) break;
        let r;
        try { r = await Sync._anf('/storage/v1/object/authenticated/photos/' + c.uid + '/' + id + '.' + ext); } catch (e) { return null; }
        if (!r.ok) continue;
        bytes = new Uint8Array(await r.arrayBuffer());
        if (ext === 'enc') { try { bytes = await Krypto.decBytes(bytes); } catch (e) { bytes = null; } }
        break;
      }
      if (!bytes) return null;
      const blob = new Blob([bytes], { type: 'image/jpeg' });
      let thumb = blob, w = 0, h = 0;
      try { const b = await U.bildVerkleinern(blob); thumb = b.thumb; w = b.w; h = b.h; } catch (e) { /* Vorschau = Original */ }
      const rec = { id, full: blob, thumb, w, h, ts: Date.now() };
      await Data._put('photos', rec);
      (Data.meta.upl = Data.meta.upl || {})[id] = 1;
      return rec;
    })().finally(() => Sync._holen.delete(id));
    Sync._holen.set(id, p);
    return p;
  },

  /* ---------- Privater Bereich ---------- */
  /** Nach der PIN-Eingabe: gesperrte Cloud-Daten entschlüsseln; Zurückgestelltes hochladen */
  async nachEntsperren() {
    let geaendert = false;
    for (const row of await Data._getAll('cipher')) if (await Sync._cipherAnwenden(row.row)) geaendert = true;
    if (Sync.angemeldet() && (Sync.cfg() || {}).privatOffen) await Sync.privatNeuEinreihen();
    if (geaendert) Sync._neuZeichnen();
  },
  /** Alle privaten Dokumente und Fotos neu verschlüsselt hochladen (nach PIN-Änderung oder nachgeholt) */
  async privatNeuEinreihen() {
    if (!Sync.angemeldet() || !Krypto.key) return;
    for (const p of Data.plants.values()) if (p.kind === 'cannabis') { await Sync._einreihen('plant', p); if (p.titelFoto) { delete Data.meta.upl[p.titelFoto]; await Sync._fotoMerken(p.titelFoto); } }
    for (const e of Data.entries.values()) if (Sync.istPrivat('entry', e)) { await Sync._einreihen('entry', e); for (const f of e.fotos || []) { delete Data.meta.upl[f]; await Sync._fotoMerken(f); } }
    await Data.setMeta('upl', Data.meta.upl);
    Sync.cfgSetzen({ privatOffen: false });
    Sync.planen();
  },
};

</script>
<script>
/* GRUENZEUG – Inhalte und Konfiguration: Sammlungen (Arten, Schädlinge, Wissen, Diagnose, Tipps) werden von den
   Dateien in content/ gefüllt. Hier stehen Hilfsfunktionen, Eintragstypen und Stufen.
   Läuft auch in Node (tools/check.js, tools/selftest.js). */
const Gruen = {
  arten: [], schaedlinge: [], wissen: [], diagnose: [], tipps: [], naturListe: [],
  art(o) { Gruen.arten.push(o); },
  schaedling(o) { Gruen.schaedlinge.push(o); },
  thema(o) { Gruen.wissen.push(o); },
  symptom(o) { Gruen.diagnose.push(o); },
  tipp(o) { Gruen.tipps.push(o); },
  /** „In der Natur“ zu einer Art: {id, ort, text, fakten[]} (content/natur.js) */
  natur(o) { Gruen.naturListe.push(o); },
  naturById(id) { return Gruen.naturListe.find((n) => n.id === id) || null; },
  /** Weitere Fotos einer Art (Schlüssel id_2, id_3 …) */
  mehrBilder(artId) { return [2, 3, 4, 5].map((n) => Gruen.bild(artId + '_' + n)).filter(Boolean); },
  /** Lexikon-Foto einer Art: {src, urheber, lizenz, lizenzUrl, seite, w, h} oder null (GRUEN_BILDER setzt tools/build.py) */
  bild(artId) {
    const b = typeof GRUEN_BILDER !== 'undefined' && GRUEN_BILDER[artId];
    return b ? Object.assign({ src: 'bilder/' + artId + '.jpg?v=' + b.v }, b) : null;
  },
  artById(id) { return Gruen.arten.find((a) => a.id === id) || null; },

  SELTEN: ['', 'Häufig', 'Beliebt', 'Selten', 'Sammlerstück'],
  SELTEN_INFO: ['', 'Gibt es in jedem Baumarkt.', 'Im Fachhandel und Gartencenter gut zu bekommen.', 'Nur bei Spezialhändlern, oft ausverkauft.', 'Kaum zu bekommen, gesucht und teuer.'],
  SCHWER: ['', 'Einfach', 'Mittel', 'Anspruchsvoll'],
  KATEGORIEN: ['Aronstabgewächse', 'Sukkulenten & Kakteen', 'Farne', 'Palmen', 'Orchideen', 'Fleischfresser', 'Blühpflanzen', 'Feigen & Bäume', 'Hängepflanzen', 'Buntblatt'],

  /** Eintragstypen je Logbuch: Reihenfolge = Reihenfolge im Auswahlmenü */
  KINDER: {
    zimmer: {
      label: 'Zimmerpflanzen', einzahl: 'Pflanze', mehrzahl: 'Pflanzen',
      hoehe: ['wachstum', 'hoehe'],
      typen: {

        giessen: { label: 'Gegossen', icon: 'tropfen', felder: [{ k: 'methode', label: 'Wie', typ: 'wahl', opt: ['Von oben', 'Untersetzer', 'Tauchen', 'Besprüht'] }] },
        duengen: { label: 'Gedüngt', icon: 'flasche', felder: [{ k: 'mittel', label: 'Dünger', typ: 'text', platz: 'z. B. Flüssigdünger, 2 ml/l' }] },
        umtopfen: { label: 'Umgetopft', icon: 'topf', felder: [{ k: 'topf', label: 'Neuer Topf', typ: 'zahl', einheit: 'cm' }, { k: 'substrat', label: 'Substrat', typ: 'text', platz: 'z. B. Aroid-Mix mit Bims' }] },
        wachstum: { label: 'Gemessen', icon: 'lineal', felder: [{ k: 'hoehe', label: 'Höhe', typ: 'zahl', einheit: 'cm' }, { k: 'blaetter', label: 'Blätter', typ: 'zahl' }, { k: 'blattgroesse', label: 'Größtes Blatt', typ: 'zahl', einheit: 'cm' }] },
        meilenstein: { label: 'Besonderheit', icon: 'stern', felder: [{ k: 'art', label: 'Was', typ: 'wahl', opt: ['Neues Blatt', 'Blüte', 'Neuer Trieb', 'Variegation', 'Ableger genommen', 'Wurzeln gebildet', 'Sonstiges'] }] },
        schaedling: { label: 'Schädling / Problem', icon: 'kaefer', felder: [{ k: 'was', label: 'Was', typ: 'text', platz: 'z. B. Trauermücken, gelbe Blätter' }] },
        behandlung: { label: 'Behandlung', icon: 'schild', felder: [{ k: 'mittel', label: 'Mittel', typ: 'text', platz: 'z. B. Neemöl, Gelbtafeln' }] },
        notiz: { label: 'Notiz', icon: 'stift' },
      },
    },
    cannabis: {
      label: 'Grow-Logbuch', einzahl: 'Pflanze', mehrzahl: 'Pflanzen',
      hoehe: ['messung', 'hoehe'],
      typen: {
        foto: { label: 'Foto', icon: 'kamera' },
        giessen: { label: 'Gegossen', icon: 'tropfen', felder: [{ k: 'menge', label: 'Menge', typ: 'zahl', einheit: 'ml' }, { k: 'ph', label: 'pH', typ: 'zahl' }, { k: 'ec', label: 'EC', typ: 'zahl', einheit: 'mS' }] },
        duengen: { label: 'Gedüngt', icon: 'flasche', felder: [{ k: 'mittel', label: 'Dünger', typ: 'text', platz: 'Produkt, Dosierung' }, { k: 'ec', label: 'EC', typ: 'zahl', einheit: 'mS' }, { k: 'ph', label: 'pH', typ: 'zahl' }] },

   Format und Regeln: docs/INHALTE.md. IDs nie ändern (Pflanzen der Sammlung verweisen darauf).

    { h: 'Die Regeln', text: '1. **Erst fühlen, dann gießen.** Finger oder Holzstäbchen in die Erde, nicht nach Kalender.\n2. **Der Topf braucht ein Abzugsloch.** Staunässe ist der häufigste Pflanzentod.\n3. **Hell ist besser als dunkel.** Fast jede Pflanze nimmt mehr Licht, als man glaubt.\n4. **Luft statt Nässe.** Wurzeln brauchen Sauerstoff: lockere Erde, nicht zu große Töpfe.\n5. **Im Winter weniger gießen und nicht düngen.** Pflanzen wachsen langsamer.\n6. **Nicht ständig umstellen.** Viele Pflanzen verlieren Blätter nach einem Umzug.\n7. **Neue Pflanzen in Quarantäne.** 2–3 Wochen allein, bevor sie zu den anderen kommen.\n8. **Blätter kontrollieren.** Einmal pro Woche die Unterseiten ansehen: Schädlinge früh erkennen.\n9. **Weniger düngen als auf der Packung steht.** Die Hälfte reicht oft.\n10. **Nicht alles auf einmal ändern.** Eine Änderung, dann abwarten und beobachten.' },

Gruen.thema({

  merksaetze: ['Erst die Erde prüfen, dann gießen – nie nach Kalender.', 'Durchdringend gießen, Überschuss abgießen.', 'Im Winter deutlich seltener.'],
  abschnitte: [
    { h: 'Wann gießen?', text: 'Die einfachste Methode ist die **Fingerprobe**: Finger 3–5 cm tief in die Erde. Fühlt sie sich trocken an, ist es Zeit; ist sie noch feucht, warte.\nGut funktioniert auch das **Gewicht**: Hebe den Topf kurz nach dem Gießen an und wieder, wenn er trocken ist. Nach einigen Malen merkst du den Unterschied sofort.\nEin **Holzstäbchen** (zum Beispiel Schaschlikspieß) in der Erde zeigt Feuchte: kommt es dunkel und feucht heraus, noch nicht gießen.' },
    { h: 'Wie gießen?', text: '- **Von oben** gleichmäßig, bis Wasser unten herausläuft. Der Überschuss nach 10–15 Minuten aus Untersetzer oder Übertopf entfernen.\n- **Tauchen**: Topf in Wasser stellen, bis keine Luftblasen mehr aufsteigen. Gut für sehr trockene Ballen und Orchideen.\n- **Von unten**: Untersetzer füllen und 15 Minuten saugen lassen. Gut für Usambaraveilchen, Fleischfresser.\nAlle drei sind richtig – entscheidend ist, dass überschüssiges Wasser abfließen kann.' },
    { h: 'Wie viel?', text: 'Lieber **selten und durchdringend** als oft und wenig. Wenig Wasser reicht nur an die Oberfläche, die Wurzeln unten bleiben trocken und die Oberseite dauerfeucht.' },
    { h: 'Nach Pflanzentyp', text: '- **Sukkulenten, Kakteen, Bogenhanf, ZZ**: ganz abtrocknen lassen.\n- **Aroideen** (Monstera, Philodendron, Anthurium): obere 3–5 cm trocknen lassen.\n- **Calathea, Farne, Fittonia**: gleichmäßig leicht feucht, nie nass.\n- **Orchideen** (Phalaenopsis): tauchen, dann gut abtropfen, Wurzeln silbrig → gießen.\n- **Fleischfresser**: immer feucht, nur weiches Wasser.' },
    { h: 'Winter', text: 'Bei weniger Licht und Wärme verdunstet weniger. Die Erde braucht deutlich länger zum Trocknen – prüfe öfter, gieße seltener.' },

});

Gruen.thema({

  merksaetze: ['Abstehen lassen entfernt Chlor, aber keinen Kalk.', 'Fleischfresser und Calathea brauchen weiches Wasser.', 'Regenwasser ist fast immer ideal.'],
  abschnitte: [
    { h: 'Leitungswasser', text: 'Für die meisten Zimmerpflanzen ist Leitungswasser in Ordnung. Wichtig ist die **Härte**: Hartes, kalkreiches Wasser lagert Kalk in der Erde ab und treibt den pH-Wert nach oben. Dann werden Nährstoffe schlechter aufgenommen und Blattspitzen braun.\nAbstehen lassen bringt Raumtemperatur und lässt Chlor entweichen, ändert aber nichts am Kalk.' },
    { h: 'Weiches Wasser', text: '- **Regenwasser**: ideal, kalkfrei, solange es nicht von belasteten Dächern kommt.\n- **Osmosewasser**: sehr rein, für Fleischfresser. Für andere Pflanzen mit etwas Leitungswasser mischen oder mit Dünger ergänzen.\n- **Destilliertes Wasser**: nur für empfindliche Spezialisten.\n- **Wasserfilter** (Tischfilter): mildert Kalk etwas.' },
    { h: 'Empfindliche Pflanzen', text: 'Fleischfresser, Calathea, Maranta, Orchideen und Farne reagieren auf Kalk und Salze mit braunen Spitzen. Dort lohnt Regen- oder Osmosewasser.' },

Gruen.thema({
  id: 'substrat', titel: 'Substrat und Erde', icon: 'topf', kurz: 'Aus welchen Zutaten Pflanzerde besteht und welche Mischung zu welcher Pflanze passt.',
  merksaetze: ['Gute Erde hält Wasser und lässt trotzdem Luft an die Wurzeln.', 'Mischen schlägt Fertigerde.', 'Je dicker die Blätter, desto mineralischer das Substrat.'],
  abschnitte: [
    { h: 'Die Zutaten', text: '- **Blumenerde**: Grundlage, speichert Wasser, enthält Nährstoffe.\n- **Kokosfaser / Kokoserde**: speichert Wasser, locker, torffrei.\n- **Perlite**: weiße, leichte Körner, sorgen für Luft.\n- **Bims / Lavagrus / Zeolith**: schwere mineralische Körner, belüften und stabilisieren.\n- **Pinienrinde / Orchideenrinde**: grobe Stücke, ideal für Aufsitzer wie Orchideen und Aroideen.\n- **Aktivkohle**: hilft gegen Gerüche, mildert Fäulnis.\n- **Sphagnum-Moos**: speichert viel Wasser und bleibt luftig. Siehe eigenes Thema.\n- **Leca / Blähton**: Tonkügelchen für Semi-Hydro.' },
    { h: 'Mischungen zum Ausprobieren', text: '- **Allrounder (Monstera, Philodendron)**: 40 % Blumenerde, 30 % Rinde, 20 % Perlite oder Bims, 10 % Kokos.\n- **Sukkulenten & Kakteen**: 30 % Erde, 70 % mineralisch (Bims, Perlite, Sand).\n- **Orchideen**: grobe Pinienrinde, etwas Perlite und Holzkohle, evtl. Sphagnum.\n- **Calathea, Farne**: humose Erde mit Kokos und etwas Perlite, feuchter gehalten.\n- **Fleischfresser**: nährstoffarmer Torf und Perlite, kein Dünger – nur mit weichem Wasser.' },
    { h: 'Mehr Luft, weniger Fäulnis', text: 'Je mehr Wurzeln Luft bekommen, desto weniger Fäulnis droht. Zu feine, torfige Erde verdichtet sich mit der Zeit. Grobe Anteile (Rinde, Bims) halten das Substrat offen.' },
    { h: 'Austauschen', text: 'Erde verbraucht sich: Nach 1–2 Jahren hat sie weniger Struktur und weniger Nährstoffe. Spätestens dann umtopfen oder die oberste Schicht erneuern.' },
  ],
  siehe: ['sphagnum', 'umtopfen', 'semi-hydro'],
});

Gruen.thema({
  id: 'sphagnum', titel: 'Sphagnum-Moos und Moos', icon: 'blatt', kurz: 'Wasserspeicher, Bewurzelungshilfe und Substrat: wofür man Moos braucht.',
  merksaetze: ['Sphagnum speichert ein Vielfaches seines Gewichts an Wasser und bleibt trotzdem luftig.', 'Immer nur feucht, nie nass einsetzen.', 'Moos ist nicht gleich Moos: Sphagnum ≠ Torf ≠ Dekomoos.'],
  abschnitte: [
    { h: 'Was ist Sphagnum?', text: 'Sphagnum ist ein Torfmoos. Seine Zellen speichern das bis zu **20-Fache** des Trockengewichts an Wasser und lassen trotzdem Luft durch. Außerdem ist es leicht sauer und hemmt Bakterien und Pilze. Deshalb ist es unter Sammlern so beliebt.\nIm Handel gibt es **getrocknetes Sphagnum** (kurzfasrig oder langfasrig). Vor dem Verwenden einweichen und gut ausdrücken: es soll **feucht wie ein ausgedrückter Schwamm** sein.' },
    { h: 'Wofür man es nutzt', text: '- **Stecklinge bewurzeln**: Knoten in feuchtes Moos in einen durchsichtigen Behälter legen. Das Moos hält Feuchte und Luft – oft schneller und mit kräftigeren Wurzeln als in Wasser.\n- **Luftabsenker (Air Layering)**: Stängel mit Moos einwickeln, mit Folie umhüllen, Wurzeln bilden sich an der Pflanze.\n- **Moosstab**: Ein Stab aus Moos für Kletterpflanzen. Die Luftwurzeln wachsen hinein und die Blätter werden größer.\n- **Substratbeimischung**: 10–30 % Sphagnum in Aroid- oder Orchideensubstrat hält die Feuchte besser.\n- **Orchideen**: oben in die Rinde gelegt oder als Hauptsubstrat für Orchideen, die nicht austrocknen sollen.\n- **Fleischfresser**: reines Sphagnum als Substrat für viele Arten.' },
    { h: 'Moos und Moos', text: '- **Sphagnum**: für Wurzelbildung und Substrat.\n- **Torf**: Substrat aus abgestorbenem Moor, nährstoffarm und sauer; aus Umweltgründen oft ersetzt.\n- **Dekomoos / Kugelmoos**: zum Abdecken und Gestalten, nicht zum Wurzeln.\n- **Lebendes Moos (Terrarium)**: Kissenmoos, Sternmoos – braucht Licht und hohe Luftfeuchte.' },
    { h: 'Fehler vermeiden', text: '- Zu nass einsetzen: Moos wird fest und fault.\n- Zu trocken lassen: Moos wird hart und nimmt kein Wasser mehr auf.\n- Kaufe getrocknetes Moos aus nachhaltiger Quelle; Wildentnahme schadet den Mooren.' },
  ],
  siehe: ['vermehrung', 'substrat'],
});

Gruen.thema({
  id: 'licht', titel: 'Licht', icon: 'sonne', kurz: 'Fensterrichtung, Entfernung, Pflanzenlampen und Sonnenbrand.',
  merksaetze: ['Licht ist der wichtigste Wachstumsfaktor.', 'Schon einen Meter vom Fenster ist es deutlich dunkler.', 'Im Winter sinkt das Licht stark.'],
  abschnitte: [
    { h: 'Wie viel Licht?', text: 'Richtwerte (Lux, sehr grob):\n- **Wenig Licht**: 500–2.500 lx – Bogenhanf, ZZ, Efeutute überleben, wachsen aber kaum.\n- **Mittel**: 2.500–10.000 lx – die meisten Zimmerpflanzen.\n- **Viel**: 10.000–25.000+ lx – Sukkulenten, Kakteen, Hoyas, bunte Pflanzen.\nHelles Tageslicht draußen hat oft über 50.000 lx. Fensterscheibe, Gardinen und Entfernung reduzieren das stark.' },
    { h: 'Fensterrichtung (Nordhalbkugel)', text: '- **Süd**: hellster Platz, im Sommer teils zu heiß – ideal für Sukkulenten.\n- **Ost**: milde Morgensonne – gut für viele Pflanzen.\n- **West**: Nachmittagssonne, warm und hell.\n- **Nord**: wenig Licht – nur für Schattenpflanzen.' },
    { h: 'Entfernung zum Fenster', text: 'Mit jedem Meter Abstand nimmt das Licht stark ab. Ein Platz zwei Meter neben dem Fenster ist oft viel dunkler als er wirkt. Pflanzen zeigen es: lange Abstände zwischen den Blättern, kleine Blätter, blasse Farbe.' },
    { h: 'Pflanzenlampen', text: 'Vollspektrum-LED-Lampen sind effizient und kühl. Für Zimmerpflanzen reichen 10–30 W pro Pflanzengruppe in 20–40 cm Abstand, 10–14 Stunden am Tag. Eine Zeitschaltuhr hilft.\nLichtmess-Apps im Handy sind ungenau, aber ein grober Anhaltspunkt.' },
    { h: 'Sonnenbrand', text: 'Pflanzen, die plötzlich in volle Sonne kommen, verbrennen: helle bis braune, trockene Flecken. Langsam gewöhnen, besonders nach dem Winter oder bei neu gekauften Pflanzen. Panaschierte Pflanzen verbrennen leichter.' },
  ],
  siehe: ['winter', 'variegation'],
});

Gruen.thema({
  id: 'luftfeuchte', titel: 'Luftfeuchte', icon: 'thermo', kurz: 'Wann sie wichtig ist, wie man sie misst und was wirklich hilft.',
  merksaetze: ['Ein Hygrometer kostet wenige Euro und ersetzt Raten.', 'Sprühen bringt kaum etwas – Luftbefeuchter und Gruppierung schon.', 'Viele Pflanzen kommen mit 40–50 % klar.'],
  abschnitte: [
    { h: 'Messen', text: 'Ein kleines Hygrometer zeigt die Luftfeuchte. Im Winter liegt sie in beheizten Räumen oft bei 30–40 %. Für die meisten robusten Pflanzen ist das ok, für Calathea, Alocasia, Farne und Orchideen ist es zu trocken.' },
    { h: 'Was hilft', text: '- **Pflanzen gruppieren**: sie verdunsten Wasser und befeuchten sich gegenseitig.\n- **Luftbefeuchter**: die verlässlichste Lösung.\n- **Vitrine oder Terrarium**: schafft ein eigenes Klima.\n- **Wasserschalen oder Kieselsteinschale**: bringt wenig, aber etwas.\n- **Bad oder Küche**: von Natur aus feuchter.' },
    { h: 'Sprühen?', text: 'Sprühen erhöht die Feuchte nur für Minuten. Auf manchen Pflanzen verursacht es Flecken oder Pilze. Besser: abwischen und gießen.' },
    { h: 'Vorsicht', text: 'Zu hohe Feuchte ohne Luftbewegung begünstigt Schimmel und Mehltau. Ein kleiner Ventilator oder Lüften hilft.' },
  ],
  siehe: ['winter'],
});

Gruen.thema({
  id: 'duengen', titel: 'Düngen', icon: 'flasche', kurz: 'Wann, womit und wie viel: lieber weniger als zu viel.',
  merksaetze: ['Gedüngt wird nur in der Wachstumszeit (Frühling–Sommer).', 'Lieber halbe Dosis, dafür regelmäßig.', 'Nicht düngen bei kranken, frisch umgetopften oder ruhenden Pflanzen.'],
  abschnitte: [
    { h: 'Was ist drin?', text: 'Dünger enthält Stickstoff (N) für Blattwachstum, Phosphor (P) für Wurzeln und Blüten, Kalium (K) für Festigkeit. Ein ausgewogener Flüssigdünger (zum Beispiel 7-5-7) passt für fast alle Zimmerpflanzen.' },
    { h: 'Wann und wie viel?', text: '- Von **April bis September** alle 2–4 Wochen düngen.\n- Im **Herbst und Winter** nicht oder höchstens ein Viertel der Dosis.\n- **Halbe Dosis** der Packungsangabe reicht meistens.\n- Nur auf **leicht feuchte** Erde geben, nie auf trockene.' },
    { h: 'Zu viel Dünger', text: 'Salze sammeln sich in der Erde: weißer Rand am Topf, braune Blattspitzen, Wachstumsstopp. Abhilfe: Erde mehrfach mit klarem Wasser durchspülen oder umtopfen.' },
    { h: 'Zeichen von Mangel', text: '- **Ältere Blätter vergilben gleichmäßig**: Stickstoffmangel.\n- **Neue Blätter hell mit grünen Adern**: Eisen- oder Magnesiummangel, oft durch zu hohen pH.\n- **Alles klein und blass**: häufiger Lichtmangel, nicht Düngermangel.' },
    { h: 'Dünger-Arten', text: '- **Flüssigdünger** ins Gießwasser: einfach, gut dosierbar.\n- **Düngestäbchen / Langzeitdünger**: zuverlässig, aber schlecht anpassbar.\n- **Organisch** (Wurmhumus, Guano): schonend, wirkt langsam.' },
  ],
  siehe: ['umtopfen', 'winter'],
});

Gruen.thema({
  id: 'umtopfen', titel: 'Umtopfen', icon: 'topf', kurz: 'Wann es sich lohnt, welche Topfgröße und warum Drainage-Schichten nichts bringen.',
  merksaetze: ['Nur ein bis zwei Nummern größer: 2–4 cm Durchmesser mehr.', 'Beste Zeit: Frühjahr.', 'Eine Schicht Blähton unten hilft nicht – sie verschlechtert eher den Wasserabzug.'],
  abschnitte: [
    { h: 'Wann?', text: '- Wurzeln wachsen aus dem Abzugsloch oder drücken den Ballen hoch.\n- Wasser läuft sofort durch, ohne einzuziehen.\n- Die Erde ist verdichtet, riecht muffig oder verbraucht.\n- Die Pflanze ist deutlich zu groß für den Topf.\nIm Normalfall alle 1–2 Jahre, bei schnellen Pflanzen (Monstera) jährlich, bei langsamen (Sansevieria, ZZ) seltener.' },
    { h: 'Wie?', text: '1. Pflanze am Stamm halten und aus dem Topf lösen, den Ballen vorsichtig lockern.\n2. Faule oder tote Wurzeln wegschneiden, lange Wurzeln leicht kürzen.\n3. Neuen Topf nur **2–4 cm größer** wählen (zu große Töpfe bleiben nass).\n4. Frisches Substrat einfüllen, Pflanze auf gleicher Höhe wie zuvor setzen.\n5. Leicht angießen, bei Bedarf nach einigen Tagen noch einmal.' },
    { h: 'Drainage-Schicht?', text: 'Eine Schicht Blähton oder Steine im Topfboden verbessert den Wasserabzug **nicht**. Im Gegenteil: Wasser staut sich direkt oberhalb der Schicht und die Wurzeln stehen höher im Nassen. Besser: ein Abzugsloch und durchgehend durchlässiges Substrat.' },
    { h: 'Topf-Material', text: '- **Plastik**: speichert Wasser, leicht, gut für durstige Pflanzen.\n- **Ton / Terrakotta**: atmet, trocknet schneller, schwer – gut für Sukkulenten.\n- **Keramik**: schön, aber oft ohne Loch; dann als Übertopf verwenden.' },
    { h: 'Nach dem Umtopfen', text: 'Pflanze einige Tage ruhen lassen: kein Dünger für 4–6 Wochen und nicht sofort in starke Sonne.' },
  ],
  siehe: ['substrat', 'duengen'],
});

Gruen.thema({
  id: 'vermehrung', titel: 'Vermehrung', icon: 'schere', kurz: 'Stecklinge, Ableger, Teilung und Moos: so wird aus einer Pflanze eine Sammlung.',
  merksaetze: ['Bei den meisten Aroideen braucht der Steckling einen Knoten (Nodus).', 'Moos bewurzelt oft besser als Wasser.', 'Geduld: Wurzeln dauern Wochen.'],
  abschnitte: [
    { h: 'Kopfstecklinge', text: 'Trieb mit Knoten und mindestens einem Blatt unter dem Knoten schneiden. Bei Monstera, Philodendron und Efeutute sitzt der Knoten am Stängel – daraus entstehen die Wurzeln.\nIn Wasser, feuchtes Moos oder Perlite stellen, hell, warm (22–26 °C), ohne direkte Sonne. Wurzeln erscheinen meist nach 1–4 Wochen.' },
    { h: 'Wasser, Erde oder Moos?', text: '- **Wasser**: einfach, man sieht Wurzeln, aber die Wasserwurzeln müssen sich später an Erde gewöhnen.\n- **Feuchtes Moos / Perlite**: Wurzeln sind erdetauglich, weniger Umstellung.\n- **Erde**: direkt, aber man sieht nichts und muss gleichmäßig feucht halten.' },
    { h: 'Ableger und Teilung', text: '- **Kindel / Ableger** (Grünlilie, Pilea, Aloe): mit Wurzeln abtrennen und eintopfen.\n- **Teilung**: beim Umtopfen den Wurzelballen teilen (Spathiphyllum, Calathea, Bogenhanf).\n- **Rhizom-Pflanzen**: Rhizom mit Auge und Wurzel zerschneiden.' },
    { h: 'Blattstecklinge', text: 'Funktionieren bei Sukkulenten (Geldbaum), Usambaraveilchen, Begonien und Peperomien: Blatt abnehmen, antrocknen lassen, auf Erde legen oder Stiel stecken.' },
    { h: 'Luftabsenker', text: 'Bei Pflanzen, die nicht leicht bewurzeln (Ficus, große Philodendren): Stängel anritzen, mit feuchtem Sphagnum umwickeln und mit Folie umhüllen. Wenn Wurzeln durchscheinen, unterhalb abschneiden und eintopfen.' },
    { h: 'Samen', text: 'Aus Samen vermehrt man Kakteen, Lithops, Fleischfresser und viele Palmen. Es braucht Geduld und eine feuchte, warme Umgebung. Kaufe Samen nur aus seriösen Quellen.' },
  ],
  siehe: ['sphagnum', 'variegation'],
});

Gruen.thema({
  id: 'winter', titel: 'Überwintern', icon: 'thermo', kurz: 'Weniger Licht, trockene Heizungsluft: So kommen die Pflanzen gut durch die dunkle Zeit.',
  merksaetze: ['Weniger gießen, nicht düngen.', 'Heller stellen, Fensterscheiben reinigen.', 'Kältezug am Fenster meiden.'],
  abschnitte: [
    { h: 'Was ändert sich?', text: 'Von Oktober bis Februar sind die Tage kurz und das Licht schwach. Viele Pflanzen wachsen kaum. Sie brauchen weniger Wasser und keinen Dünger. Die Heizungsluft ist trocken und lockt Spinnmilben an.' },
    { h: 'Was tun?', text: '- **Heller stellen**: so nah ans Fenster, wie es ohne Kälte geht.\n- **Pflanzenlampe**: für Pflanzen mit hohem Lichtbedarf.\n- **Fenster putzen**: spart Licht.\n- **Gießen reduzieren**: nach Fingerprobe, nicht nach Kalender.\n- **Dünger pausieren**.\n- **Luftfeuchte beobachten** und bei Bedarf erhöhen.\n- **Zugluft meiden**: beim Lüften Pflanzen vom Fenster wegstellen.' },
    { h: 'Ruhephase', text: 'Manche Pflanzen brauchen sie: Weihnachtskaktus (kühler zur Knospenbildung), Venusfliegenfalle (5–10 °C), Alocasien (ziehen ein). Wer sie nicht ruhen lässt, schwächt sie.' },
    { h: 'Kälteempfindliche Pflanzen', text: 'Pflanzen, die an kalten Fensterscheiben oder im Durchzug stehen, werfen Blätter ab. Abstand zur Scheibe halten und nicht über Heizkörper stellen.' },
  ],
  siehe: ['licht', 'luftfeuchte'],
});

Gruen.thema({
  id: 'quarantaene', titel: 'Neue Pflanzen und Quarantäne', icon: 'schild', kurz: 'So bringst du keine Schädlinge in die Sammlung.',
  merksaetze: ['Neue Pflanzen 2–3 Wochen getrennt halten.', 'Gründlich kontrollieren: Blattunterseiten, Erde, Stängel.', 'Im Zweifel behandeln, bevor sie zu den anderen kommt.'],
  abschnitte: [
    { h: 'Warum?', text: 'Die meisten Schädlinge kommen mit neuen Pflanzen ins Haus – aus Gartencenter, Baumarkt oder Tauschbörse. Ein einziger Befall kann in Wochen die ganze Sammlung erreichen.' },
    { h: 'So gehst du vor', text: '1. Pflanze in einem eigenen Raum oder zumindest weit weg von anderen aufstellen.\n2. Blätter (auch Unterseiten), Stängel und Erde mit Lupe und Handylicht kontrollieren.\n3. Bei wertvollen Pflanzen austopfen und Wurzeln prüfen (Wurzelläuse, Fäule).\n4. Vorbeugend mit milder Seifenlösung abwaschen oder Gelbtafeln aufstellen.\n5. 2–3 Wochen beobachten, bevor sie zur Sammlung kommt.' },
    { h: 'Tauschbörsen und Stecklinge', text: 'Stecklinge aus fremden Sammlungen genauso behandeln: Blätter gründlich kontrollieren, Stecklinge einzeln bewurzeln und separat halten.' },
  ],
  siehe: ['raritaeten'],
});

Gruen.thema({
  id: 'urlaub', titel: 'Pflanzen im Urlaub', icon: 'tropfen', kurz: 'Eine bis drei Wochen weg: Gießhilfen und Tricks.',
  merksaetze: ['Vorher gründlich gießen und nicht düngen.', 'Heller, aber nicht pralle Sonne.', 'Probelauf mit der Gießhilfe vor der Abreise.'],
  abschnitte: [
    { h: 'Bis zu zwei Wochen', text: 'Die meisten Pflanzen überstehen das ohne Hilfe: vorher gründlich gießen, Untersetzer leeren und die Pflanzen etwas weg vom Fenster stellen, damit sie weniger verdunsten.' },
    { h: 'Gießhilfen', text: '- **Wasserdocht**: ein Baumwollband verbindet Wasserbehälter und Erde. Funktioniert wochenlang.\n- **Tonkegel / Flaschen**: Flasche mit Loch in die Erde stecken.\n- **Kapillarmatte**: Pflanzen auf eine feuchte Matte stellen, die am Wasserbehälter hängt.\n- **Bewässerungsset** mit Zeitschaltuhr für Töpfe.\nTeste jede Methode eine Woche vor der Reise.' },
    { h: 'Beim Gießen durch Dritte', text: 'Schreibe genau auf: welche Pflanze, wie viel, wie oft. Gerade Sukkulenten verzeihen es nicht, wenn zu viel gegossen wird.' },
  ],
  siehe: ['giessen'],
});

Gruen.thema({
  id: 'variegation', titel: 'Variegation und Besonderheiten', icon: 'stern', kurz: 'Panaschierte Pflanzen sind begehrt, aber heikel: Was dahintersteckt.',
  merksaetze: ['Weiße Anteile haben kein Chlorophyll – die Pflanze braucht mehr Licht.', 'Instabile Panaschierung kann zurückschlagen.', 'Rein weiße oder rosa Blätter überleben oft nicht.'],
  abschnitte: [
    { h: 'Was ist Variegation?', text: 'Variegation (Panaschierung) bedeutet, dass Teile der Blätter weniger oder gar kein Chlorophyll haben und deshalb weiß, gelb, cremefarben oder rosa wirken. Das kann genetisch bedingt (stabil) oder zufällig (instabil) sein.' },
    { h: 'Typen', text: '- **Marmoriert / gesprenkelt**: Muster aus Flecken und Streifen, zum Beispiel Thai Constellation.\n- **Sektorial**: ganze Blatthälften oder -teile sind weiß – bei Monstera Albo üblich.\n- **Randpanaschierung**: heller Blattrand.\n- **Gewebekultur**: im Labor stabil vermehrt, so verbreitet sich heute etwa die Thai Constellation.' },
    { h: 'Pflege', text: 'Panaschierte Pflanzen brauchen mehr Licht, weil sie weniger Chlorophyll haben. Aber **keine pralle Sonne**: weiße Stellen verbrennen leicht. Gleichmäßig gießen und mäßig düngen.' },
    { h: 'Rückschlag und Rückschnitt', text: 'Instabile Panaschierung kann plötzlich wieder grün werden oder zu viel Weiß bilden. Dann hilft **Rückschnitt**: Trieb bis zu einem Knoten mit gutem Muster kürzen. Neue Blätter wachsen häufig wieder bunt.' },
    { h: 'Besonderheiten sammeln', text: 'Besonders begehrt: große, gleichmäßig panaschierte Blätter (Albo, Pink Princess, Variegata). Dokumentiere in deinem Logbuch Fotos und Austriebe – so siehst du, wie sich die Zeichnung entwickelt.' },
  ],
  siehe: ['raritaeten', 'licht'],
});

Gruen.thema({
  id: 'semi-hydro', titel: 'Semi-Hydro (Leca)', icon: 'tropfen', kurz: 'Pflanzen in Tonkügelchen mit Wasserreservoir: Vor- und Nachteile.',
  merksaetze: ['Eine Umstellung braucht saubere Wurzeln und Geduld.', 'Wasser im Reservoir nur bis ca. ein Drittel der Topfhöhe.', 'Mit speziellem Hydro-Dünger arbeiten.'],
  abschnitte: [
    { h: 'Prinzip', text: 'Statt Erde dienen **Leca-Tonkügelchen**. Im Boden eines Topfes ohne Abzug sammelt sich Wasser; die Kügelchen saugen es auf und geben Feuchte an die Wurzeln ab. Die Wurzeln bekommen Luft und Wasser zugleich.' },
    { h: 'Vorteile', text: '- Kaum Fäulnis, weil Luft an die Wurzeln kommt.\n- Kaum Trauermücken.\n- Gießen nur selten nötig (alle 1–2 Wochen auffüllen).\n- Gut für Büros und Sammler mit vielen Pflanzen.' },
    { h: 'Nachteile', text: '- Umstellung belastet die Pflanze.\n- Nicht jede Pflanze mag es (Sukkulenten meiden).\n- Man muss gezielt mit Hydro-Dünger arbeiten.\n- Ohne Sauerstoff-Kenntnis drohen Algen oder Fäule.' },
    { h: 'Umstellen', text: '1. Erde gründlich von den Wurzeln spülen.\n2. Faule Wurzeln entfernen.\n3. Leca vorher wässern.\n4. Pflanze in ein Gefäß mit Einsatz setzen, Leca einfüllen.\n5. Wasserstand niedrig halten, anfangs häufiger prüfen.' },
  ],
  siehe: ['substrat', 'duengen'],
});

Gruen.thema({
  id: 'raritaeten', titel: 'Raritäten kaufen und halten', icon: 'stern', kurz: 'Worauf du achten solltest, wenn du Sammlerstücke suchst.',
  merksaetze: ['Zu günstig ist meist zu schön, um wahr zu sein.', 'Nur aus Nachzucht kaufen – nie Wildentnahmen.', 'Neue Pflanze: erst Quarantäne.'],
  abschnitte: [
    { h: 'Wo kaufen?', text: '- **Spezialhändler und Gärtnereien** mit Foto der konkreten Pflanze.\n- **Tauschbörsen und Gruppen**: gut für Stecklinge, Vorsicht bei Betrug.\n- **Messen und Pflanzenbörsen**: man sieht die Pflanze vor Ort.\nRaritäten verkaufen sich oft in Stecklingsform – ein Steckling braucht Zeit und Pflege.' },
    { h: 'Auf was achten?', text: '- Bestimmung prüfen: manche „Raritäten“ sind andere Arten (zum Beispiel Monstera obliqua).\n- Zeichnung und Wuchs vergleichen: Fotos des Originals und der Pflanze.\n- Bei panaschierten Pflanzen: wie viel Weiß, wie stabil?\n- Pflanzengesundheit: Blätter, Wurzeln, Schädlinge.\n- EU-Pflanzenpass bei Versand in der EU, Artenschutz (CITES) bei geschützten Arten.' },
    { h: 'Preise', text: 'Preise schwanken stark und folgen Trends. Hochpreisige Pflanzen werden teils durch Gewebekultur günstiger. Kaufe, was du pflegen kannst, nicht nur, was gerade teuer ist.' },
    { h: 'Dokumentieren', text: 'Halte Herkunft, Kaufdatum und Preis im Logbuch fest. So behältst du den Überblick und kannst später belegen, woher die Pflanze stammt.' },
  ],
  siehe: ['quarantaene', 'variegation'],
});

Gruen.thema({
  id: 'grow-phasen', privat: true, titel: 'Lebenszyklus und Phasen', icon: 'stern', kurz: 'Von der Keimung bis zur Ernte: was in welcher Phase passiert.',
  merksaetze: ['Photoperiodische Sorten blühen erst bei langen Nächten (12/12).', 'Autoflowers blühen nach Alter, unabhängig vom Licht.', 'Alle Zeitangaben sind Richtwerte und hängen von Sorte und Bedingungen ab.'],
  abschnitte: [
    { h: 'Phasen im Überblick', text: '- **Keimung**: 1–7 Tage. Samen im feuchten Papiertuch oder direkt in Erde.\n- **Sämling**: 2–3 Wochen. Erste Blätter, empfindlich gegen Überwässerung.\n- **Wachstum (vegetativ)**: 3–8 Wochen. Triebe und Blätter wachsen kräftig.\n- **Vorblüte**: Erste Blütenansätze (Geschlecht erkennbar).\n- **Blüte**: etwa 7–10 Wochen. Blütenstände entwickeln sich.\n- **Ernte**: wenn der Reifegrad stimmt.\n- **Trocknen**: 7–14 Tage.\n- **Curing**: 2–8 Wochen in Gläsern.' },
    { h: 'Photoperiodisch oder Autoflower?', text: '**Photoperiodische** Pflanzen bleiben im Wachstum bei 18 Stunden Licht und gehen bei 12 Stunden Licht / 12 Stunden Dunkelheit in die Blüte. Man steuert den Zeitpunkt selbst.\n**Autoflowers** blühen nach etwa 3–5 Wochen automatisch, unabhängig vom Lichtrhythmus. Sie bleiben meist kleiner und sind nach etwa 10–12 Wochen insgesamt erntereif.' },
    { h: 'Dokumentation', text: 'Im Logbuch Phasenwechsel eintragen, Fotos machen, Höhe messen und Pflege notieren. So siehst du, was die Pflanze braucht und kannst beim nächsten Mal Fehler vermeiden.' },
  ],
  siehe: ['grow-licht', 'grow-ernte'],
});

Gruen.thema({
  id: 'grow-licht', privat: true, titel: 'Licht und Klima', icon: 'sonne', kurz: 'Lichtrhythmus, Lichtstärke, Temperatur und Luftfeuchte nach Phase.',
  merksaetze: ['Die Dunkelphase darf nicht durch Licht gestört werden.', 'Hitze und trockene Luft machen mehr Probleme als zu wenig Licht.', 'Luftzirkulation schützt vor Schimmel.'],
  abschnitte: [
    { h: 'Lichtrhythmus', text: '- **Wachstum**: 18 Stunden Licht, 6 Stunden Dunkelheit (alternativ 20/4).\n- **Blüte** (photoperiodisch): 12 Stunden Licht, 12 Stunden Dunkelheit. Lichtlecks in der Dunkelphase vermeiden.\n- **Autoflower**: meist 18/6 durchgehend.' },
    { h: 'Lichtstärke (LED, grobe Richtwerte)', text: '- Sämling: etwa 200–400 µmol/m²/s.\n- Wachstum: 400–600.\n- Blüte: 600–900 (ohne CO₂).\nLampen mit Dimmer sind praktisch. Abstand nach Herstellerangabe, im Zweifel höher hängen. Handprobe: Wird die Hand an der Pflanzenspitze unangenehm heiß, ist die Lampe zu nah.' },
    { h: 'Temperatur und Luftfeuchte', text: '- **Temperatur**: tagsüber 22–28 °C, nachts nicht mehr als 5–8 °C kühler.\n- **Luftfeuchte**: Sämling 65–70 %, Wachstum 55–65 %, Blüte 40–50 %, späte Blüte etwa 40–45 %.\nZu hohe Luftfeuchte in der Blüte begünstigt Schimmel (Blütenfäule).' },
    { h: 'Luft', text: 'Abluft und Umluft sind wichtig: frische Luft, Abtransport von Wärme und Feuchte, kräftige Stängel. Aktivkohlefilter und Ventilator gehören zu jedem Zelt.' },
  ],
  siehe: ['grow-phasen', 'grow-probleme'],
});

Gruen.thema({
  id: 'grow-wasser', privat: true, titel: 'Wasser, pH und EC', icon: 'tropfen', kurz: 'Gießen, Wasserqualität, pH- und EC-Werte nach Medium.',
  merksaetze: ['Erst pH messen, dann düngen.', 'Lieber seltener und durchdringend gießen.', 'Ein falscher pH sperrt Nährstoffe, auch wenn genug im Substrat ist.'],
  abschnitte: [
    { h: 'pH-Wert (Richtwerte)', text: '- **Erde**: 6,0–7,0.\n- **Coco**: 5,5–6,5.\n- **Hydro**: 5,5–6,0.\nMit pH-Teststreifen, Tropfen oder einem digitalen Messgerät prüfen. Mit pH-Plus oder pH-Minus anpassen.' },
    { h: 'EC / Nährstoffstärke', text: 'EC (mS/cm) zeigt, wie viele Nährstoffe im Wasser sind. Grobe Anhaltspunkte:\n- Sämling: 0,4–0,8.\n- Wachstum: 1,0–1,6.\n- Blüte: 1,4–2,0.\nEmpfindliche Sorten brauchen weniger. Beobachte die Blätter: Wenn Spitzen verbrennen, ist es zu viel.' },

Gruen.thema({

<script>
/* GRUENZEUG – Tipp des Monats (Startseite „Heute“). Je Monat ein Tipp, thema = Wissens-ID zum Weiterlesen. */
Gruen.tipp({ monat: 1, titel: 'Heizungsluft im Blick behalten', text: 'Trockene Luft lockt Spinnmilben an. Wirf einmal pro Woche einen Blick auf die Blattunterseiten – feine Gespinste sind das erste Zeichen.', thema: 'luftfeuchte' });
Gruen.tipp({ monat: 2, titel: 'Fenster putzen, Blätter abstauben', text: 'Im Februar ist das Licht noch knapp. Saubere Scheiben und abgewischte Blätter bringen spürbar mehr Licht bei den Pflanzen an.', thema: 'licht' });
Gruen.tipp({ monat: 3, titel: 'Zeit fürs Umtopfen beginnt', text: 'Mit mehr Licht startet das Wachstum. Prüfe, welche Pflanzen aus dem Topf wachsen – im Frühjahr tolerieren sie das Umtopfen am besten.', thema: 'umtopfen' });
Gruen.tipp({ monat: 4, titel: 'Wieder düngen', text: 'Ab jetzt wachsen die Pflanzen und brauchen Nährstoffe. Starte mit halber Dosis und steigere langsam.', thema: 'duengen' });
Gruen.tipp({ monat: 5, titel: 'Ableger-Saison', text: 'Frühling und Sommer sind die beste Zeit für Stecklinge: warm, hell und die Pflanzen sind in Wuchsstimmung. Probiere Moos zum Bewurzeln.', thema: 'vermehrung' });
Gruen.tipp({ monat: 6, titel: 'Vorsicht Sonne', text: 'Wer Pflanzen auf den Balkon stellt, gewöhnt sie in einigen Tagen langsam an die Sonne. Plötzliche Mittagssonne verbrennt Blätter.', thema: 'licht' });
Gruen.tipp({ monat: 7, titel: 'Urlaub: Gießhilfen testen', text: 'Probiere Wasserdocht oder Tonkegel eine Woche vor der Abreise aus – sonst merkst du erst nach der Rückkehr, was nicht funktioniert hat.', thema: 'urlaub' });
Gruen.tipp({ monat: 8, titel: 'Hitze und Gießen', text: 'Bei Hitze verdunsten Töpfe schnell. Gieße am Morgen oder Abend, und prüfe Pflanzen am Südfenster jeden Tag.', thema: 'giessen' });
Gruen.tipp({ monat: 9, titel: 'Vor dem Einräumen kontrollieren', text: 'Pflanzen, die draußen waren, vor dem Hereinholen auf Schädlinge prüfen und einige Tage getrennt halten.', thema: 'quarantaene' });
Gruen.tipp({ monat: 10, titel: 'Weniger Wasser', text: 'Mit weniger Licht und Wärme verbrauchen die Pflanzen weniger. Gieße seltener und prüfe die Erde, bevor du zur Kanne greifst.', thema: 'winter' });
Gruen.tipp({ monat: 11, titel: 'Düngen pausieren', text: 'Von November bis Februar brauchen die meisten Pflanzen keinen Dünger. Nutze die Zeit für Kontrolle und Planung.', thema: 'duengen' });
Gruen.tipp({ monat: 12, titel: 'Nicht drehen, wenn Knospen sitzen', text: 'Weihnachtskaktus und Co. werfen Knospen ab, wenn man sie umstellt oder dreht. Lass sie in der Blütezeit am Platz.', thema: 'winter' });
//# sourceURL=content/tipps.js
</script>
<script>
/* GRUENZEUG – „In der Natur“: Lebensraum und Besonderheiten am Naturstandort (Lexikon-Eintrag, Abschnitt „In der Natur“).
   Format: Gruen.natur({ id: 'art-id', ort: 'Wo?', text: 'Absatz', fakten: ['…'] }). Nur sichere Fakten, nichts erfinden.
   Das Foto vom Naturstandort (content/bilder/<id>_natur.jpg) ist optional, siehe tools/bilder.py --natur. */

Gruen.natur({ id: 'monstera-deliciosa', ort: 'Regenwälder von Südmexiko bis Panama',
  text: 'In der Natur keimt die Monstera am Boden und kriecht zum dunkelsten Stamm in der Nähe. Dort klettert sie mit Luftwurzeln bis in die Baumkronen. Erst im Licht bilden sich die großen, durchlöcherten Blätter.',
  fakten: ['Sie kann viele Meter hoch klettern und wird dort zu einer Lianen-ähnlichen Pflanze.', 'Die Früchte sind essbar, wenn sie reif sind – sie schmecken nach einer Mischung aus Ananas und Banane.', 'Für die Löcher gibt es mehrere Erklärungen: Sie könnten Regen und Wind durchlassen oder Licht an untere Blätter weitergeben.'] });

Gruen.natur({ id: 'efeutute', ort: 'Gesellschaftsinseln im Pazifik (Moorea), heute weltweit in den Tropen',
  text: 'Am Naturstandort klettert die Efeutute an Baumstämmen nach oben. Die Blätter werden dann so groß wie Hände oder sogar größer und sehen ganz anders aus als im Zimmer.',
