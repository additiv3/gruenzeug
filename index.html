<script>
/* GRUENZEUG – Formulare: Feld-Bausteine (F), Pflege-Rechnung (Pflege), Pflanzen- und Eintragsformulare (Formen). */
const F = {
  _feld(label, kind, ...inh) { return U.el('div', { class: 'feld' }, label ? U.el('label', null, label) : null, ...inh); },
  text(label, wert, o) {
    o = o || {};
    const i = o.mehrzeilig ? U.el('textarea', { rows: o.zeilen || 3, placeholder: o.platz || '' }) : U.el('input', { type: o.typ || 'text', placeholder: o.platz || '', autocomplete: 'off', inputmode: o.inputmode || null, list: o.liste || null });
    i.value = wert == null ? '' : wert;
    return { el: F._feld(label, 'text', i), input: i, wert: () => i.value.trim() };
  },
  zahl(label, wert, einheit, o) {
    const i = U.el('input', { type: 'text', inputmode: 'decimal', placeholder: (o && o.platz) || '', autocomplete: 'off' });
    i.value = wert == null ? '' : String(wert).replace('.', ',');
    const el = F._feld(label, 'zahl', einheit ? U.el('div', { class: 'mit-einheit' }, i, U.el('span', { class: 'einheit', text: einheit })) : i);
    return { el, input: i, wert: () => U.zahl(i.value) };
  },
  datum(label, wert) {
    const i = U.el('input', { type: 'date', max: '2100-01-01' });
    i.value = wert || '';
    return { el: F._feld(label, 'datum', i), input: i, wert: () => i.value || null };
  },
  /** Einzelauswahl als Chips. opt: ['A','B'] */
  wahl(label, opt, wert, o) {
    let aktuell = wert == null ? null : wert;
    const w = U.el('div', { class: 'wahlliste' });
    const upd = () => [...w.children].forEach((b, i) => b.classList.toggle('on', opt[i] === aktuell));
    opt.forEach((x) => w.append(U.el('button', { type: 'button', class: 'chip', text: x, onclick: () => { aktuell = aktuell === x && !(o && o.pflicht) ? null : x; upd(); } })));
    upd();
    return { el: F._feld(label, 'wahl', w), wert: () => aktuell, setze: (v) => { aktuell = v; upd(); } };
  },
  /** Fotos wählen. Neue Fotos landen sofort in der Datenbank; bei Abbruch werden sie wieder entfernt. */
  fotos(start, o) {
    o = o || {};
    let ids = (start || []).slice();
    const neue = [];
    const leiste = U.el('div', { class: 'fotoleiste' });
    const datei = U.el('input', { type: 'file', accept: 'image/*', class: 'verb' });
    if (!o.einzeln) datei.multiple = true;
    const zeichne = () => {
      leiste.replaceChildren();
      ids.forEach((id) => {
        leiste.append(U.el('div', { class: 'f' }, App.bild(id, true), U.el('button', { type: 'button', 'aria-label': 'Foto entfernen', onclick: () => { ids = ids.filter((x) => x !== id); zeichne(); } }, App.icon('x'))));
      });
      if (!(o.einzeln && ids.length)) leiste.append(U.el('button', { type: 'button', class: 'neu', 'aria-label': 'Foto hinzufügen', onclick: () => datei.click() }, App.icon('kamera')));
    };
    datei.onchange = async () => {
      const dateien = [...datei.files];
      datei.value = '';
      for (const f of dateien) {
        try { const id = await Data.addFoto(f); ids.push(id); neue.push(id); zeichne(); }
        catch (e) { App.toast('Foto nicht lesbar: ' + (e && e.message || 'unbekanntes Format')); }
      }
    };
    zeichne();
    return {
      el: F._feld(o.label === undefined ? 'Fotos' : o.label, 'fotos', leiste, datei),
      ids: () => ids.slice(),
      /** Nach Abbruch: nicht übernommene neue Fotos löschen */
      verwerfen: async () => { for (const id of neue) if (!Data.benutzteFotos().has(id)) await Data.delFoto(id); },
      /** Nach Speichern: entfernte, bisher gespeicherte Fotos löschen, wenn niemand sie mehr braucht */
      aufraeumen: async () => { for (const id of (start || [])) if (!ids.includes(id) && !Data.benutzteFotos().has(id)) await Data.delFoto(id); },
    };
  },
  /** Art aus dem Lexikon wählen oder frei tippen. → {el, wert(): {artId, art}} */
  art(startArtId, startText, onWahl) {
    let artId = startArtId || null;
    const i = U.el('input', { type: 'text', placeholder: 'Art suchen oder selbst eintragen', autocomplete: 'off' });
    i.value = startText || '';
    const liste = U.el('div', { class: 'treffer', style: { display: 'none' } });
    const hinweis = U.el('div', { class: 'hinweis' });
    const zeigeHinweis = () => { hinweis.replaceChildren(); const a = artId && Gruen.artById(artId); if (a) hinweis.append(App.icon('haken', 14), ' Mit dem Lexikon verknüpft: ', a.name); };
    i.addEventListener('input', () => {
      artId = null; zeigeHinweis();
      const q = i.value.trim();
      liste.replaceChildren();
      if (q.length < 2) { liste.style.display = 'none'; return; }
      const t = Gruen.arten.filter((a) => U.trifft(a.name + ' ' + a.latein + ' ' + (a.alias || []).join(' '), q)).slice(0, 8);
      t.forEach((a) => liste.append(U.el('button', { type: 'button', onclick: () => { artId = a.id; i.value = a.name; liste.style.display = 'none'; zeigeHinweis(); if (onWahl) onWahl(a); } }, a.name, U.el('small', { text: a.latein }))));
      liste.style.display = t.length ? '' : 'none';
    });
    zeigeHinweis();
    return { el: F._feld('Art', 'art', i, liste, hinweis), wert: () => ({ artId, art: i.value.trim() }) };
  },
};

/** Pflege-Rechnung: wann ist Gießen/Düngen wieder dran? */
const Pflege = {
  /** typ 'giessen' | 'duengen' → {letzte, faellig, in} oder null ohne Intervall. in < 0 = überfällig */
  naechste(p, typ) {
    const iv = typ === 'giessen' ? p.giessTage : p.duengerTage;
    if (!iv || p.status !== 'aktiv') return null;
    const l = Data.letzter(p.id, typ);
    const start = l ? l.datum : (p.erworben && p.erworben <= U.heute() ? p.erworben : U.iso(new Date(p.erstellt || Date.now())));
    const faellig = U.plusTage(start, iv);
    return { letzte: l ? l.datum : null, faellig, in: U.tageZwischen(U.heute(), faellig) };
  },
  text(n) {
    if (!n) return '';
    if (n.in < 0) return 'seit ' + U.plural(-n.in, 'Tag', 'Tagen') + ' überfällig';
    if (n.in === 0) return 'heute fällig';
    if (n.in === 1) return 'morgen fällig';
    return 'in ' + n.in + ' Tagen';
  },
  async schnell(p, typ, datum) {
    const e = Data.neuerEintrag(p.id, typ, { datum: datum || U.heute() });
    await Data.saveEntry(e);
    App.toast(typ === 'giessen' ? p.name + ' gegossen' : p.name + ' gedüngt');
    return e;
  },
  phase(p) {
    const e = Data.letzter(p.id, 'phase');
    return e && e.werte && e.werte.phase ? e.werte.phase : null;
  },
};

const Formen = {
  /** Auswahl der Eintragsart → Formular. nachher() wird nach dem Speichern aufgerufen. */
  eintragWaehlen(p, nachher) {
    const typen = Gruen.KINDER[p.kind].typen;
    const raster = U.el('div', { class: 'typen' });
    let s;
    for (const k in typen) raster.append(U.el('button', { onclick: () => { s.zu(); Formen.eintrag(p, k, null, nachher); } }, App.icon(typen[k].icon), typen[k].label));
    s = App.sheet({ titel: 'Neuer Eintrag', inhalt: raster });
  },

  eintrag(p, typ, e, nachher) {
    const def = Gruen.KINDER[p.kind].typen[typ];
    const neu = !e;
    e = e || Data.neuerEintrag(p.id, typ);
    const datum = F.datum('Datum', e.datum);
    const felder = (def.felder || []).map((f) => {
      const w = e.werte ? e.werte[f.k] : null;
      return f.typ === 'zahl' ? F.zahl(f.label, w, f.einheit) : f.typ === 'wahl' ? F.wahl(f.label, f.opt, w, { pflicht: true }) : F.text(f.label, w, { platz: f.platz });
    });
    const text = F.text(typ === 'foto' ? 'Beschreibung' : 'Notiz', e.text, { mehrzeilig: true, zeilen: 3, platz: typ === 'notiz' ? 'Was ist dir aufgefallen?' : 'optional' });
    const fotos = F.fotos(e.fotos);
    const inh = U.el('div');
    const zweiSpaltig = (def.felder || []).length > 1 && (def.felder || []).every((f) => f.typ === 'zahl');
    if (zweiSpaltig) {
      inh.append(datum.el, U.el('div', { class: (def.felder.length >= 3 ? 'drei' : 'zwei') }, felder.map((f) => f.el)));
    } else inh.append(datum.el, felder.map((f) => f.el));
    inh.append(text.el, fotos.el);
    const knoepfe = [];
    if (!neu) {
      knoepfe.push(U.el('button', { class: 'btn gefahr', text: 'Löschen', onclick: async () => {
        if (await App.bestaetigen('Eintrag löschen?', 'Der Eintrag und seine Fotos werden entfernt.', { ok: 'Löschen', gefahr: true })) {
          s.zu(); await Data.delEntry(e.id); App.toast('Gelöscht'); if (nachher) nachher(); else App.neu();
        }
      } }));
    }
    const s = App.sheet({
      titel: def.label, inhalt: inh, extra: knoepfe, speichern: neu ? 'Speichern' : 'Übernehmen',
      onSpeichern: async () => {
        if (typ === 'foto' && !fotos.ids().length && !text.wert()) { App.toast('Bitte ein Foto oder Text hinzufügen'); return false; }
        if (!datum.wert()) { App.toast('Bitte ein Datum wählen'); return false; }
        e.datum = datum.wert(); e.text = text.wert(); e.fotos = fotos.ids();
        e.werte = {};
        (def.felder || []).forEach((f, i) => { const v = felder[i].wert(); if (v != null && v !== '') e.werte[f.k] = v; });
        await Data.saveEntry(e);
        await fotos.aufraeumen();
        if (nachher) nachher(e); else App.neu();
      },
      onZu: () => fotos.verwerfen(),
    });
  },

  /** Pflanze anlegen oder bearbeiten. vorgabe: {artId, art, name} aus dem Lexikon */
  pflanze(kind, p, nachher, vorgabe) {
    const neu = !p;
    vorgabe = vorgabe || {};
    p = p || Data.neuePflanze(kind, vorgabe);
    const cfg = Gruen.KINDER[p.kind];
    const name = F.text('Name', p.name, { platz: p.kind === 'cannabis' ? 'z. B. Nr. 1, Lady in Green' : 'z. B. Monty, Monstera Nr. 2' });
    const intervalle = [];
    const giess = F.zahl('Gießen alle', p.giessTage, 'Tage', { platz: 'z. B. 7' });
    const duenger = F.zahl('Düngen alle', p.duengerTage, 'Tage', { platz: 'optional' });
    const art = p.kind === 'cannabis' ? null : F.art(p.artId, p.art, (a) => { if (giess.wert() == null && a.giessTage) giess.input.value = String(a.giessTage); if (!name.wert()) name.input.value = a.name; });
    const ort = F.text('Standort', p.standort, { platz: 'z. B. Wohnzimmer, Fenster Süd', liste: 'gz-orte' });
    const orte = U.el('datalist', { id: 'gz-orte' });
    [...new Set([...Gruen.ORTE, ...[...Data.plants.values()].map((x) => x.standort).filter(Boolean)])].forEach((o) => orte.append(U.el('option', { value: o })));
    const erworben = F.datum(p.kind === 'cannabis' ? 'Start (Keimung)' : 'Erworben am', p.erworben);
    const quelle = F.text('Woher', p.quelle, { platz: 'Shop, Tauschbörse, Geschenk …' });
    const preis = F.zahl('Preis', p.preis, '€');
    const notiz = F.text('Notizen', p.notiz, { mehrzeilig: true, platz: 'Besonderheiten, Geschichte, Wünsche …' });
    const foto = neu ? F.fotos([], { einzeln: true, label: 'Erstes Foto' }) : null;
    let sorte, typ, medium, phase;
    if (p.kind === 'cannabis') {
      sorte = F.text('Sorte', p.sorte, { platz: 'Name / Genetik' });
      typ = F.wahl('Typ', ['Photoperiodisch', 'Autoflower', 'Unbekannt'], p.typ);
      medium = F.wahl('Medium', ['Erde', 'Coco', 'Hydro', 'Sonstiges'], p.medium);
      phase = neu ? F.wahl('Aktuelle Phase', Gruen.PHASEN.slice(0, 5), 'Keimung', { pflicht: true }) : null;
    }
    const inh = U.el('div');
    if (p.kind === 'cannabis') inh.append(name.el, sorte.el, typ.el, medium.el, erworben.el, phase ? phase.el : '', ort.el, U.el('div', { class: 'zwei' }, giess.el, duenger.el), notiz.el, foto ? foto.el : '');
    else inh.append(name.el, art.el, ort.el, orte, U.el('div', { class: 'zwei' }, giess.el, duenger.el), erworben.el, U.el('div', { class: 'zwei' }, quelle.el, preis.el), notiz.el, foto ? foto.el : '');
    const knoepfe = [];
    const s = App.sheet({
      titel: neu ? (p.kind === 'cannabis' ? 'Neue Pflanze (Grow)' : 'Neue Pflanze') : 'Pflanze bearbeiten', inhalt: inh, extra: knoepfe, speichern: neu ? 'Anlegen' : 'Speichern',
      onSpeichern: async () => {
        if (!name.wert()) { App.toast('Bitte einen Namen eingeben'); return false; }
        p.name = name.wert();
        if (art) { const a = art.wert(); p.artId = a.artId; p.art = a.art; if (!p.artId) delete p.artId; }
        p.standort = ort.wert(); p.giessTage = giess.wert() > 0 ? Math.round(giess.wert()) : null; p.duengerTage = duenger.wert() > 0 ? Math.round(duenger.wert()) : null;
        p.erworben = erworben.wert(); p.quelle = quelle.wert(); p.preis = preis.wert(); p.notiz = notiz.wert();
        if (sorte) { p.sorte = sorte.wert(); p.typ = typ.wert(); p.medium = medium.wert(); }
        if (neu && foto && foto.ids().length) p.titelFoto = foto.ids()[0];
        await Data.savePlant(p);
        if (neu && foto && foto.ids().length) await Data.saveEntry(Data.neuerEintrag(p.id, 'foto', { fotos: foto.ids(), text: 'Erstes Foto' }));
        if (neu && phase && phase.wert()) await Data.saveEntry(Data.neuerEintrag(p.id, 'phase', { datum: p.erworben || U.heute(), werte: { phase: phase.wert() } }));
        if (nachher) nachher(p); else App.neu();
      },
      onZu: () => { if (foto) foto.verwerfen(); },
    });
  },
};

<script>
/* GRUENZEUG – Startseite „Heute“ und die Sammlung (Kachelübersicht). `Sammlung.liste(kind)` dient auch dem
   Cannabis-Logbuch (kind 'cannabis'): gleiche Oberfläche, andere Eintragstypen. */
const Heute = {
  gruss() { const h = new Date().getHours(); return h < 5 ? 'Gute Nacht' : h < 11 ? 'Guten Morgen' : h < 17 ? 'Guten Tag' : h < 22 ? 'Guten Abend' : 'Gute Nacht'; },

  /** Zu pflegende Pflanzen: [{p, n}] sortiert nach Dringlichkeit */
  faellige(typ, tage) {
    return Data.liste('zimmer', 'aktiv').map((p) => ({ p, n: Pflege.naechste(p, typ) })).filter((x) => x.n && x.n.in <= (tage || 0)).sort((a, b) => a.n.in - b.n.in);
  },

  seite() {
    const w = U.el('div');
    const aktive = Data.liste('zimmer', 'aktiv');
    const jetzt = new Date();

    // Sicherung fällig?
    const letzte = Einst.get('letzteSicherung', null);
    const ersterTag = aktive.length ? U.iso(new Date(Math.min(...aktive.map((p) => p.erstellt || Date.now())))) : null;
    const tageSeit = letzte ? U.tageZwischen(letzte, U.heute()) : (ersterTag ? U.tageZwischen(ersterTag, U.heute()) : 0);
    if (aktive.length && tageSeit >= (letzte ? 30 : 7) && Einst.get('sicherungHinweis', '') !== U.heute()) {
      w.append(U.el('div', { class: 'banner' }, App.icon('warnung', 22), U.el('span', { text: letzte ? 'Letzte Sicherung ' + U.rel(letzte) + '.' : 'Noch keine Sicherung deiner Daten.' }),
        U.el('button', { class: 'btn klein sekundaer', text: 'Sichern', onclick: () => Mehr.sichern() }),
        U.el('button', { class: 'ib', 'aria-label': 'Heute nicht mehr', style: { width: '34px', height: '34px' }, onclick: () => { Einst.set('sicherungHinweis', U.heute()); App.neu(); } }, App.icon('x'))));
    }

    if (!aktive.length) {
      w.append(U.el('div', { class: 'card' }, App.leer('sammlung', 'Dein Pflanzenregal ist noch leer', 'Lege deine erste Pflanze an – mit Foto, Standort und Pflege-Rhythmus. Oder stöbere im Lexikon und übernimm eine Art direkt.',
        { text: 'Erste Pflanze anlegen', icon: 'plus', fn: () => Formen.pflanze('zimmer', null, (p) => { App.tab('sammlung'); App.oeffne(() => Detail.seite(p.id)); }) })));
      w.append(U.el('div', { class: 'btnreihe' }, U.el('button', { class: 'btn sekundaer', onclick: () => App.tab('lexikon') }, App.icon('lexikon'), 'Lexikon'), U.el('button', { class: 'btn sekundaer', onclick: () => App.tab('wissen') }, App.icon('wissen'), 'Pflege-Wissen')));
    } else {
      const tage7 = U.plusTage(U.heute(), -7);
      const n7 = [...Data.entries.values()].filter((e) => e.datum >= tage7 && (Data.plants.get(e.plantId) || {}).kind === 'zimmer').length;
      const arten = new Set(aktive.map((p) => p.artId || U.norm(p.art || p.name))).size;
      w.append(U.el('div', { class: 'stat' },
        U.el('div', null, U.el('b', { text: String(aktive.length) }), U.el('span', { text: aktive.length === 1 ? 'Pflanze' : 'Pflanzen' })),
        U.el('div', null, U.el('b', { text: String(arten) }), U.el('span', { text: arten === 1 ? 'Art' : 'Arten' })),
        U.el('div', null, U.el('b', { text: String(n7) }), U.el('span', { text: 'Einträge/Woche' }))));

      // Pflege heute
      const giess = Heute.faellige('giessen', 0), duen = Heute.faellige('duengen', 0);
      const karte = U.el('div', { class: 'card flach' });
      const kopf = (titel, icon, liste, typ) => {
        const k = U.el('div', { class: 'zeile', style: { cursor: 'default', minHeight: '46px' } }, App.icon(icon), U.el('div', { class: 't' }, U.el('b', { text: titel })));
        if (liste.length > 1) k.append(U.el('button', { class: 'btn klein sekundaer', text: 'Alle erledigt', onclick: async () => { for (const x of liste) await Pflege.schnell(x.p, typ); App.toast(liste.length + ' Pflanzen versorgt'); App.neu(); } }));
        return k;
      };
      const zeilen = (liste, typ) => liste.map((x) => U.el('div', { class: 'faellig' },
        U.el('button', { class: 'thumb', 'aria-label': x.p.name, onclick: () => App.oeffne(() => Detail.seite(x.p.id)) }, App.titelbild(x.p, true)),
        U.el('div', { class: 't' }, U.el('b', { text: x.p.name }), U.el('span', { class: x.n.in < 0 ? 'ueber' : '', text: Pflege.text(x.n) + (x.n.letzte ? ' · zuletzt ' + U.rel(x.n.letzte) : '') })),
        U.el('button', { class: 'tropf', 'aria-label': typ === 'giessen' ? 'Gegossen' : 'Gedüngt', onclick: async (ev) => { ev.currentTarget.classList.add('fertig'); await Pflege.schnell(x.p, typ); App.neu(); } }, App.icon(typ === 'giessen' ? 'tropfen' : 'flasche'))));
      if (giess.length) { karte.append(kopf('Gießen heute', 'tropfen', giess, 'giessen'), ...zeilen(giess, 'giessen')); }
      if (duen.length) { karte.append(kopf('Düngen heute', 'flasche', duen, 'duengen'), ...zeilen(duen, 'duengen')); }
      if (giess.length || duen.length) w.append(karte);
      else {
        const demnaechst = Heute.faellige('giessen', 365).filter((x) => x.n.in > 0)[0];
        const hat = aktive.some((p) => p.giessTage);
        w.append(U.el('div', { class: 'card' }, U.el('div', { style: { display: 'flex', gap: '12px', alignItems: 'center' } }, U.el('div', { class: 'tropf fertig' }, App.icon('haken')),
          U.el('div', null, U.el('b', { text: hat ? 'Alles versorgt' : 'Pflege-Erinnerungen' }), U.el('div', { class: 'muted klein', text: demnaechst ? 'Als Nächstes: ' + demnaechst.p.name + ' ' + Pflege.text(demnaechst.n) : hat ? 'Heute ist nichts fällig.' : 'Trage bei einer Pflanze ein, wie oft sie gegossen wird – dann erinnert dich diese Seite.' })))));
      }
      const bald = Heute.faellige('giessen', 2).filter((x) => x.n.in > 0);
      if (giess.length && bald.length) w.append(U.el('p', { class: 'muted klein', style: { margin: '-4px 4px 12px' }, text: 'Demnächst: ' + bald.slice(0, 3).map((x) => x.p.name + ' (' + (x.n.in === 1 ? 'morgen' : 'in ' + x.n.in + ' Tagen') + ')').join(', ') }));
    }

    // Tipp des Monats
    const tipp = Gruen.tipps.find((t) => t.monat === jetzt.getMonth() + 1) || Gruen.tipps[0];
    if (tipp) w.append(U.el('div', { class: 'tipp' }, U.el('div', { class: 'etikett', text: 'Tipp für den ' + U.MONATE[jetzt.getMonth()] }), U.el('h3', { text: tipp.titel }), U.el('p', { text: tipp.text }),
      tipp.thema ? U.el('button', { class: 'btn klein ghost', style: { marginTop: '10px' }, text: 'Mehr dazu', onclick: () => App.oeffne(() => Wissen.thema(tipp.thema)) }) : null));

    // Vor einem Jahr
    const vor = Heute.vorEinemJahr();
    if (vor.length) {
      const g = U.el('div', { class: 'galerie' });
      vor.slice(0, 3).forEach((e) => g.append(U.el('button', { 'aria-label': 'Foto ansehen', onclick: () => App.oeffne(() => Detail.seite(e.plantId)) }, App.bild(e.fotos[0], true))));
      w.append(App.abschnitt('Vor einem Jahr'), U.el('div', { class: 'card' }, g, U.el('div', { class: 'muted klein', style: { marginTop: '8px' }, text: vor.slice(0, 3).map((e) => (Data.plants.get(e.plantId) || {}).name).filter((x, i, a) => a.indexOf(x) === i).join(', ') + ' · ' + U.datum(vor[0].datum) })));
    }

    // Pflanze des Tages
    if (Gruen.arten.length) {
      const a = Gruen.arten[(U.num(U.heute()) * 7) % Gruen.arten.length];
      w.append(App.abschnitt('Aus dem Lexikon'), U.el('div', { class: 'card flach' }, Lexikon.zeile(a)));
    }

    // Zuletzt
    const letzte5 = [...Data.entries.values()].filter((e) => (Data.plants.get(e.plantId) || {}).kind === 'zimmer').sort((a, b) => (a.datum < b.datum ? 1 : a.datum > b.datum ? -1 : b.ts - a.ts)).slice(0, 5);
    if (letzte5.length) {
      const k = U.el('div', { class: 'card flach' });
      letzte5.forEach((e) => {
        const p = Data.plants.get(e.plantId), d = Gruen.KINDER.zimmer.typen[e.typ] || { label: e.typ, icon: 'stift' };
        k.append(U.el('button', { class: 'zeile', onclick: () => App.oeffne(() => Detail.seite(p.id)) }, App.icon(d.icon), U.el('div', { class: 't' }, U.el('b', { text: p.name + ' · ' + d.label }), U.el('span', { text: U.rel(e.datum) + (e.text ? ' · ' + e.text.slice(0, 60) : '') }))));
      });
      w.append(App.abschnitt('Zuletzt'), k);
    }
    return { titel: Heute.gruss(), sub: U.wochentag(U.heute()) + ', ' + U.datum(U.heute()), inhalt: w, aktionen: [{ icon: 'plus', label: 'Neue Pflanze', fn: () => Formen.pflanze('zimmer', null, (p) => { App.tab('sammlung'); App.oeffne(() => Detail.seite(p.id)); }) }] };
  },

  /** Einträge mit Foto von vor etwa einem Jahr (±5 Tage) */
  vorEinemJahr() {
    const von = U.plusTage(U.heute(), -370), bis = U.plusTage(U.heute(), -360);
    return [...Data.entries.values()].filter((e) => e.datum >= von && e.datum <= bis && e.fotos && e.fotos.length && (Data.plants.get(e.plantId) || {}).kind === 'zimmer');
  },
};

const Sammlung = {
  zustand: { zimmer: { q: '', f: 'alle' }, cannabis: { q: '', f: 'alle' } },

  sortieren(liste, modus) {
    const c = (a, b) => a.name.localeCompare(b.name, 'de');
    const f = {
      name: c, neu: (a, b) => (b.erstellt || 0) - (a.erstellt || 0), alt: (a, b) => (a.erworben || '9') < (b.erworben || '9') ? -1 : 1,
      ort: (a, b) => (a.standort || 'zzz').localeCompare(b.standort || 'zzz', 'de') || c(a, b),
    }[modus] || c;
    return liste.sort(f);
  },

  kachel(p) {
    const k = U.el('button', { class: 'kachel', onclick: () => App.oeffne(() => Detail.seite(p.id)) });
    k.append(App.titelbild(p, true));
    const marken = U.el('div', { class: 'marke pillen' });
    if (p.kind === 'cannabis') {
      const ph = Pflege.phase(p);
      if (ph && p.status === 'aktiv') marken.append(App.pille(ph, 'clay'));
    } else { const n = Pflege.naechste(p, 'giessen'); if (n && n.in <= 0) marken.append(App.pille(n.in < 0 ? 'Gießen!' : 'Gießen', 'clay', 'tropfen')); }
    if (p.status !== 'aktiv') marken.append(App.pille(Gruen.STATUS[p.status] || p.status, 'grau'));
    if (marken.children.length) k.append(marken);
    if (p.favorit) k.append(U.el('span', { class: 'herz' }, App.icon('herz')));
    const unter = p.kind === 'cannabis' ? [p.sorte, p.erworben ? 'Tag ' + (U.tageZwischen(p.erworben, U.heute()) + 1) : ''].filter(Boolean).join(' · ') : (p.art || p.standort || '');
    k.append(U.el('div', { class: 'info' }, U.el('span', { class: 'name', text: p.name }), U.el('span', { class: 'art' + (p.kind === 'cannabis' ? '' : ' latein'), text: unter || ' ' })));
    return k;
  },

  seite(kind) {
    const z = Sammlung.zustand[kind];
    const cfg = Gruen.KINDER[kind];
    const alle = Data.liste(kind);
    const w = U.el('div');
    const si = U.el('input', { type: 'search', placeholder: 'Suchen …', 'aria-label': 'Suchen', value: z.q, autocomplete: 'off' });
    const chips = U.el('div', { class: 'chips', role: 'toolbar' });
    const raster = U.el('div');
    const zeichne = () => {
      let l = alle.filter((p) => (z.f === 'archiv' ? p.status !== 'aktiv' : p.status === 'aktiv'));
      if (z.f === 'favoriten') l = l.filter((p) => p.favorit);
      if (z.f === 'faellig') l = l.filter((p) => { const n = Pflege.naechste(p, 'giessen'); return n && n.in <= 0; });
      if (z.q) l = l.filter((p) => U.trifft([p.name, p.art, p.standort, p.sorte, p.quelle, p.notiz].join(' '), z.q));
      Sammlung.sortieren(l, Einst.get('sort', 'name'));
      raster.replaceChildren();
      if (!l.length) {
        raster.append(alle.length
          ? App.leer('suche', 'Nichts gefunden', z.f === 'archiv' ? 'Hier landen verkaufte oder eingegangene Pflanzen.' : 'Andere Suche oder anderer Filter?')
          : App.leer('sammlung', 'Noch keine Pflanze', kind === 'cannabis' ? 'Lege deine erste Pflanze im Grow-Logbuch an.' : 'Tippe auf +, um deine erste Pflanze zu dokumentieren.'));
        return;
      }
      const g = U.el('div', { class: 'gitter' });
      l.forEach((p) => g.append(Sammlung.kachel(p)));
      raster.append(U.el('div', { class: 'muted klein', style: { margin: '2px 2px 8px' }, text: U.plural(l.length, 'Pflanze', 'Pflanzen') }), g);
    };
    const filter = [{ id: 'alle', l: 'Alle' }, { id: 'favoriten', l: 'Favoriten' }];
    if (kind === 'zimmer') filter.push({ id: 'faellig', l: 'Gießen fällig' });
    filter.push({ id: 'archiv', l: 'Archiv' });
    const zeichneChips = () => { chips.replaceChildren(...filter.map((f) => U.el('button', { class: 'chip' + (z.f === f.id ? ' on' : ''), text: f.l, onclick: () => { z.f = f.id; zeichneChips(); zeichne(); } }))); };
    si.addEventListener('input', () => { z.q = si.value; zeichne(); });
    if (kind === 'cannabis') w.append(Privat.hinweis(alle));
    w.append(U.el('div', { class: 'suche' }, App.icon('suche'), si), chips, raster);
    if (kind === 'cannabis') {
      const t = Gruen.wissen.filter((x) => x.privat);
      if (t.length) w.append(App.abschnitt('Grow-Wissen'), U.el('div', { class: 'card flach' }, t.map((x) => App.zeile(x.titel, x.kurz, x.icon || 'wissen', () => App.oeffne(() => Wissen.thema(x.id))))));
    }
    zeichneChips(); zeichne();
    return {
      privat: kind === 'cannabis',
      titel: kind === 'cannabis' ? 'Grow-Logbuch' : 'Meine Sammlung', sub: alle.filter((p) => p.status === 'aktiv').length + ' aktiv',
      inhalt: w,
      aktionen: [{ icon: 'filter', label: 'Sortieren', fn: Sammlung.sortWahl }, ...(kind === 'cannabis' ? [{ icon: 'schloss', label: 'Sperren', fn: () => Privat.sperren() }] : [])],
      fab: { label: 'Neue Pflanze', fn: () => Formen.pflanze(kind, null, (p) => App.oeffne(() => Detail.seite(p.id))) },
      ohneTab: false,
    };
  },

  sortWahl() {
    const opt = [['name', 'Name A–Z'], ['neu', 'Zuletzt hinzugefügt'], ['alt', 'Älteste zuerst'], ['ort', 'Nach Standort']];
    const l = U.el('div', { class: 'card flach' });
    let s;
    opt.forEach(([k, t]) => l.append(U.el('button', { class: 'zeile', onclick: () => { Einst.set('sort', k); s.zu(); App.neu(); } }, U.el('div', { class: 't' }, U.el('b', { text: t })), Einst.get('sort', 'name') === k ? App.icon('haken') : null)));
    s = App.sheet({ titel: 'Sortieren', inhalt: l });
  },
};

App.tabBauer.heute = () => Heute.seite();
App.tabBauer.sammlung = () => Sammlung.seite('zimmer');

</script>
<script>
/* GRUENZEUG – Pflanzen-Detailseite: Kopf, Schnellaktionen, Pflege, Wachstum, Vorher/Nachher, Steckbrief, Galerie, Verlauf. */
const Detail = {
  zeigeAlle: false,

  /** Alle Fotos einer Pflanze, neueste zuerst: [{id, datum, text}] */
  fotos(p) {
    const out = [], gesehen = new Set();
    for (const e of Data.eintraege(p.id)) for (const f of e.fotos || []) if (!gesehen.has(f)) { gesehen.add(f); out.push({ id: f, datum: e.datum, text: e.text }); }
    if (p.titelFoto && !gesehen.has(p.titelFoto)) out.push({ id: p.titelFoto, datum: p.erworben || U.iso(new Date(p.erstellt)), text: '' });
    return out;
  },

  seite(id) {
    const p = Data.plants.get(id);
    if (!p) return { titel: 'Nicht gefunden', zurueck: true, inhalt: App.leer('info', 'Diese Pflanze gibt es nicht mehr', '') };
    const cfg = Gruen.KINDER[p.kind];
    const art = p.artId ? Gruen.artById(p.artId) : null;
    const eintraege = Data.eintraege(p.id);
    const fotos = Detail.fotos(p);
    const neu = () => App.neu();
    const w = U.el('div');

    /* Kopfbild */
    const hero = U.el('div', { class: 'hero' }, U.el('div', { class: 'verlauf' }));
    hero.prepend(App.titelbild(p, false));
    if (fotos.length) hero.firstChild.style.cursor = 'zoom-in';
    hero.addEventListener('click', (ev) => { if (!ev.target.closest('.foto-knopf') && fotos.length) Detail.lupe(p, fotos, 0); });
    hero.append(U.el('button', { class: 'foto-knopf', onclick: () => Detail.schnellFoto(p) }, App.icon('kamera'), fotos.length ? 'Foto hinzufügen' : 'Erstes Foto'));
    w.append(hero);

    /* Name und Eckdaten */
    const pillen = U.el('div', { class: 'pillen', style: { marginTop: '10px' } });
    if (p.kind === 'cannabis') {
      const ph = Pflege.phase(p);
      if (ph) pillen.append(App.pille(ph, 'clay', 'stern'));
      if (p.erworben) pillen.append(App.pille('Tag ' + (U.tageZwischen(p.erworben, U.heute()) + 1) + ' · Woche ' + (Math.floor(U.tageZwischen(p.erworben, U.heute()) / 7) + 1)));
    } else if (p.erworben) pillen.append(App.pille('seit ' + U.alter(p.erworben), '', 'heute'));
    if (p.standort) pillen.append(App.pille(p.standort, 'grau'));
    if (p.status !== 'aktiv') pillen.append(App.pille(Gruen.STATUS[p.status] || p.status, 'rot'));
    if (art && art.selten >= 3) pillen.append(App.pille(Gruen.SELTEN[art.selten], 'sun', 'stern'));
    w.append(U.el('div', { class: 'kopf' }, U.el('h1', { text: p.name }), p.kind === 'cannabis' ? (p.sorte ? U.el('div', { class: 'muted', text: [p.sorte, p.typ, p.medium].filter(Boolean).join(' · ') }) : null) : (p.art ? U.el('div', { class: 'latein', text: p.art }) : null), pillen));

    /* Schnellaktionen */
    const gn = Pflege.naechste(p, 'giessen');
    const schnell = U.el('div', { class: 'schnell' });
    schnell.append(U.el('button', { class: gn && gn.in <= 0 ? 'klar' : '', onclick: async () => { if (p.kind === 'cannabis') Formen.eintrag(p, 'giessen', null, neu); else { await Pflege.schnell(p, 'giessen'); neu(); } } },
      App.icon('tropfen'), 'Gegossen', gn ? U.el('span', { class: 'muted', style: { fontWeight: 600, fontSize: '11.5px' }, text: Pflege.text(gn) }) : null));
    schnell.append(U.el('button', { onclick: () => Detail.schnellFoto(p) }, App.icon('kamera'), 'Foto'));
    schnell.append(U.el('button', { onclick: () => Formen.eintragWaehlen(p, neu) }, App.icon('plus'), 'Eintrag'));
    if (p.status === 'aktiv') w.append(schnell);

    /* Cannabis: Phasen und Kennzahlen */
    if (p.kind === 'cannabis') w.append(Detail.cannabisKarte(p, eintraege));

    /* Pflege-Rhythmus */
    if (p.kind === 'zimmer') {
      const dn = Pflege.naechste(p, 'duengen');
      if (gn || dn) {
        const f = U.el('div', { class: 'fakten' });
        if (gn) f.append(U.el('div', null, U.el('dt', { text: 'Gießen alle ' + p.giessTage + ' Tage' }), U.el('dd', { text: Pflege.text(gn) + (gn.letzte ? ' · zuletzt ' + U.rel(gn.letzte) : '') })));
        if (dn) f.append(U.el('div', null, U.el('dt', { text: 'Düngen alle ' + p.duengerTage + ' Tage' }), U.el('dd', { text: Pflege.text(dn) + (dn.letzte ? ' · zuletzt ' + U.rel(dn.letzte) : '') })));
        if (!gn || !dn) f.lastChild.classList.add('breit');
        w.append(App.abschnitt('Pflege'), f);
      }
    }

    /* Wachstum */
    const [ht, hk] = cfg.hoehe;
    const punkte = eintraege.filter((e) => e.typ === ht && e.werte && e.werte[hk] != null).map((e) => ({ x: e.datum, y: e.werte[hk] })).sort((a, b) => (a.x < b.x ? -1 : 1));
    if (punkte.length >= 2) {
      const d = punkte[punkte.length - 1].y - punkte[0].y;
      w.append(App.abschnitt('Wachstum'), U.el('div', { class: 'card' }, App.diagramm(punkte, 'cm'), U.el('div', { class: 'muted klein', style: { marginTop: '6px' }, text: (d >= 0 ? '+' : '') + U.fmt(d) + ' cm seit ' + U.datum(punkte[0].x) })));
    }

    /* Vorher / Nachher */
    if (fotos.length >= 2) {
      const aeltest = fotos[fotos.length - 1], neuest = fotos[0];
      w.append(App.abschnitt('Vorher / Nachher'), Detail.vergleich(aeltest, neuest));
    }

    /* Steckbrief */
    w.append(App.abschnitt('Steckbrief', { text: 'Bearbeiten', fn: () => Formen.pflanze(p.kind, p, neu) }), Detail.steckbrief(p, art, neu));

    /* Lexikon-Hinweis */
    if (art) {
      w.append(U.el('div', { class: 'card flach', style: { marginTop: '12px' } },
        U.el('div', { style: { padding: '14px 14px 4px' } }, U.el('div', { class: 'etikett', text: 'Aus dem Lexikon' }), U.el('p', { style: { margin: '6px 0 2px' }, text: art.kurz })),
        U.el('div', { class: 'fakten', style: { margin: '10px 14px 0', fontSize: '14px' } },
          U.el('div', null, U.el('dt', { text: 'Licht' }), U.el('dd', { text: art.licht })), U.el('div', null, U.el('dt', { text: 'Wasser' }), U.el('dd', { text: art.wasser }))),
        U.el('button', { class: 'zeile', onclick: () => App.oeffne(() => Lexikon.detail(art.id)) }, U.el('div', { class: 't' }, U.el('b', { text: 'Alles über ' + art.name })), (() => { const i = App.icon('weiter'); i.setAttribute('class', 'pfeil'); return i; })())));
    }

    /* Galerie */
    if (fotos.length) {
      const g = U.el('div', { class: 'galerie' });
      fotos.slice(0, 9).forEach((f, i) => g.append(U.el('button', { 'aria-label': 'Foto ansehen', onclick: () => Detail.lupe(p, fotos, i) }, App.bild(f.id, true))));
      w.append(App.abschnitt('Fotos (' + fotos.length + ')', fotos.length > 9 ? { text: 'Alle', fn: () => Detail.lupe(p, fotos, 0) } : null), g);
    }

    /* Verlauf */
    w.append(App.abschnitt('Verlauf', { text: '+ Eintrag', fn: () => Formen.eintragWaehlen(p, neu) }), Detail.verlauf(p, eintraege, neu));

    return {
      titel: '', kleinTitel: true, ohneTab: true, zurueck: true, privat: p.kind === 'cannabis', inhalt: w,
      aktionen: [{ icon: 'herz', label: p.favorit ? 'Favorit entfernen' : 'Favorit', fn: async () => { p.favorit = !p.favorit; await Data.savePlant(p); neu(); } }, { icon: 'mehr', label: 'Menü', fn: () => Detail.menue(p) }],
    };
  },

  async schnellFoto(p) {
    const f = Formen.schnellFotoEingabe || (Formen.schnellFotoEingabe = U.el('input', { type: 'file', accept: 'image/*', multiple: true, class: 'verb' }));
    document.body.append(f);
    f.onchange = async () => {
      const dateien = [...f.files]; f.value = ''; f.remove();
      if (!dateien.length) return;
      const ids = [];
      for (const d of dateien) { try { ids.push(await Data.addFoto(d)); } catch (e) { App.toast('Foto nicht lesbar'); } }
      if (!ids.length) return;
      await Data.saveEntry(Data.neuerEintrag(p.id, 'foto', { fotos: ids }));
      if (!p.titelFoto) { p.titelFoto = ids[0]; await Data.savePlant(p); }
      App.toast(ids.length === 1 ? 'Foto gespeichert' : ids.length + ' Fotos gespeichert');
      App.neu();
    };
    f.click();
  },

  lupe(p, fotos, start) {
    App.lupe(fotos.map((f) => f.id), start, {
      text: (i) => U.datum(fotos[i].datum) + (fotos[i].text ? ' · ' + fotos[i].text : ''),
      aktion: { label: 'Als Titelbild', fn: async (id) => { p.titelFoto = id; await Data.savePlant(p); App.toast('Titelbild geändert'); App.neu(); } },
    });
  },

  /** Vorher/Nachher-Schieber: links altes, rechts neues Foto */
  vergleich(alt, neu) {
    // unten das neue Foto (voll), darüber das alte (rechts abgeschnitten) → links alt, rechts neu
    const w = U.el('div', { class: 'vn' });
    const unten = App.bild(neu.id, false), oben = App.bild(alt.id, false, 'oben');
    oben.style.clipPath = 'inset(0 50% 0 0)';
    const griff = U.el('div', { class: 'griff' });
    const r = U.el('input', { type: 'range', min: 0, max: 100, value: 50, 'aria-label': 'Vergleich: alt links, neu rechts' });
    r.addEventListener('input', () => { oben.style.clipPath = 'inset(0 ' + (100 - r.value) + '% 0 0)'; griff.style.left = r.value + '%'; });
    w.append(unten, oben, griff,
      U.el('span', { class: 'tag', style: { left: '8px' }, text: U.datum(alt.datum, true) }), U.el('span', { class: 'tag', style: { right: '8px' }, text: U.datum(neu.datum, true) }), r);
    return w;
  },

  steckbrief(p, art, neu) {
    const f = U.el('dl', { class: 'fakten', style: { margin: 0 } });
    const add = (k, v, breit) => { if (v != null && v !== '') f.append(U.el('div', { class: breit ? 'breit' : '' }, U.el('dt', { text: k }), U.el('dd', { text: v }))); };
    if (p.kind === 'zimmer') add('Art', p.art || 'unbekannt');
    add('Standort', p.standort);
    add(p.kind === 'cannabis' ? 'Start' : 'Erworben', p.erworben ? U.datum(p.erworben) + ' (' + U.alter(p.erworben) + ')' : '');
    add('Woher', p.quelle);
    add('Preis', p.preis != null ? U.euro(p.preis) : '');
    if (p.status !== 'aktiv') add('Status', (Gruen.STATUS[p.status] || p.status) + (p.statusDatum ? ' · ' + U.datum(p.statusDatum) : ''));
    (p.fakten || []).forEach((x, i) => {
      const d = U.el('div', { class: 'breit' }, U.el('dt', { text: x.k }), U.el('dd', { text: x.v }));
      d.style.cursor = 'pointer'; d.onclick = () => Detail.faktBearbeiten(p, i, neu);
      f.append(d);
    });
    const w = U.el('div');
    w.append(f);
    const mutter = p.mutter && Data.plants.get(p.mutter);
    const ableger = [...Data.plants.values()].filter((q) => q.mutter === p.id);
    if (mutter || ableger.length) {
      const k = U.el('div', { class: 'card flach', style: { marginTop: '10px' } });
      if (mutter) k.append(U.el('button', { class: 'zeile', onclick: () => App.oeffne(() => Detail.seite(mutter.id)) }, App.icon('sammlung'), U.el('div', { class: 't' }, U.el('b', { text: 'Ableger von ' + mutter.name }))));
      ableger.forEach((q) => k.append(U.el('button', { class: 'zeile', onclick: () => App.oeffne(() => Detail.seite(q.id)) }, App.icon('blatt'), U.el('div', { class: 't' }, U.el('b', { text: 'Ableger: ' + q.name })))));
      w.append(k);
    }
    if (p.notiz) w.append(U.el('div', { class: 'card prose', style: { marginTop: '10px' } }, U.md(p.notiz)));
    w.append(U.el('button', { class: 'btn klein ghost', style: { marginTop: '10px' }, onclick: () => Detail.faktBearbeiten(p, -1, neu) }, App.icon('plus'), 'Eigener Fakt'));
    return w;
  },

  faktBearbeiten(p, i, neu) {
    const ex = i >= 0 ? p.fakten[i] : { k: '', v: '' };
    const k = F.text('Was', ex.k, { platz: 'z. B. Topfgröße, Variante, Blattzahl' });
    const v = F.text('Wert', ex.v, { mehrzeilig: true, zeilen: 2 });
    const inh = U.el('div', null, k.el, v.el);
    const knoepfe = i >= 0 ? [U.el('button', { class: 'btn gefahr', text: 'Löschen', onclick: async () => { p.fakten.splice(i, 1); await Data.savePlant(p); s.zu(); neu(); } })] : [];
    const s = App.sheet({ titel: 'Fakt', inhalt: inh, extra: knoepfe, speichern: 'Speichern', onSpeichern: async () => {
      if (!k.wert() || !v.wert()) { App.toast('Bitte beides ausfüllen'); return false; }
      p.fakten = p.fakten || [];
      if (i >= 0) p.fakten[i] = { k: k.wert(), v: v.wert() }; else p.fakten.push({ k: k.wert(), v: v.wert() });
      await Data.savePlant(p); neu();
    } });
  },

  verlauf(p, eintraege, neu) {
    if (!eintraege.length) return U.el('div', { class: 'card' }, U.el('p', { class: 'muted', style: { margin: 0 }, text: 'Noch keine Einträge. Halte Gießen, Fotos, Wachstum und Besonderheiten fest – so entsteht die Geschichte deiner Pflanze.' }));
    const typen = Gruen.KINDER[p.kind].typen;
    const wrap = U.el('div');
    const liste = U.el('ol', { class: 'verlaufsliste' });
    const sicht = Detail.zeigeAlle ? eintraege : eintraege.slice(0, 15);
    let monat = '';
    sicht.forEach((e) => {
      const m = U.MONATE[Number(e.datum.slice(5, 7)) - 1] + ' ' + e.datum.slice(0, 4);
      if (m !== monat) { monat = m; liste.append(U.el('li', { class: 'monat' }, m)); }
      const d = typen[e.typ] || { label: e.typ, icon: 'stift', felder: [] };
      const werte = (d.felder || []).map((f) => (e.werte && e.werte[f.k] != null ? (f.typ === 'zahl' ? f.label + ' ' + U.fmt(e.werte[f.k], 2) + (f.einheit ? ' ' + f.einheit : '') : e.werte[f.k]) : null)).filter(Boolean).join(' · ');
      const li = U.el('li');
      li.append(U.el('span', { class: 'punkt' }, App.icon(d.icon)));
      const b = U.el('button', { class: 'e', onclick: () => Formen.eintrag(p, e.typ, e, neu) }, U.el('b', { text: d.label }), U.el('span', { class: 'd', text: U.datum(e.datum, true) + (e.datum >= U.plusTage(U.heute(), -30) ? ' · ' + U.rel(e.datum) : '') }),
        werte ? U.el('div', { class: 'w', text: werte }) : null, e.text ? U.el('p', { text: e.text }) : null);
      li.append(b);
      if (e.fotos && e.fotos.length) {
        const mini = U.el('div', { class: 'mini' });
        const alle = Detail.fotos(p);
        e.fotos.slice(0, 4).forEach((id) => mini.append(U.el('button', { 'aria-label': 'Foto ansehen', onclick: () => Detail.lupe(p, alle, Math.max(0, alle.findIndex((x) => x.id === id))) }, App.bild(id, true))));

  cannabisKarte(p, eintraege) {

    const h = eintraege.find((e) => e.typ === 'messung' && e.werte && e.werte.hoehe != null);
    if (h) f.append(U.el('div', null, U.el('dt', { text: 'Höhe' }), U.el('dd', { text: U.fmt(h.werte.hoehe) + ' cm · ' + U.rel(h.datum) })));
    if (f.children.length) { if (f.children.length % 2) f.lastChild.classList.add('breit'); w.append(f); }
    w.append(U.el('button', { class: 'btn klein sekundaer', style: { marginTop: '10px' }, onclick: () => Formen.eintrag(p, 'phase', null, () => App.neu()) }, App.icon('stern'), 'Phase wechseln'));
    return w;
  },

  menue(p) {
    const l = U.el('div', { class: 'card flach' });
    let s;
    const z = (titel, icon, fn, gefahr) => l.append(U.el('button', { class: 'zeile', onclick: () => { s.zu(); fn(); } }, App.icon(icon), U.el('div', { class: 't' }, U.el('b', { text: titel, style: gefahr ? { color: 'var(--danger)' } : null }))));
    z('Bearbeiten', 'stift', () => Formen.pflanze(p.kind, p, () => App.neu()));
    if (p.kind === 'zimmer') z('Ableger anlegen', 'blatt', () => Formen.pflanze('zimmer', null, (n) => App.oeffne(() => Detail.seite(n.id)), { name: p.name + ' (Ableger)', artId: p.artId, art: p.art, mutter: p.id, giessTage: p.giessTage, duengerTage: p.duengerTage, standort: p.standort }));

    z('Pflanze löschen', 'trash', async () => {
      if (await App.bestaetigen('Pflanze löschen?', '„' + p.name + '“ mit allen Einträgen und Fotos wird dauerhaft gelöscht. Tipp: Statt zu löschen kannst du den Status auf „Eingegangen“ setzen – dann bleibt die Geschichte erhalten.', { ok: 'Endgültig löschen', gefahr: true })) {
        await Data.delPlant(p.id); App.toast('Gelöscht'); App.zurueck();
        setTimeout(() => App.neu(), 30);

    s = App.sheet({ titel: p.name, inhalt: l });

  status(p) {
    const opt = p.kind === 'cannabis' ? ['aktiv', 'geerntet', 'eingegangen'] : ['aktiv', 'verkauft', 'verschenkt', 'eingegangen'];
    const st = F.wahl('Status', opt.map((k) => Gruen.STATUS[k]), Gruen.STATUS[p.status], { pflicht: true });
    const dat = F.datum('Datum', p.statusDatum || U.heute());
    const nt = F.text('Notiz (z. B. Grund)', '', { mehrzeilig: true, zeilen: 2 });
    App.sheet({ titel: 'Status ändern', inhalt: U.el('div', null, st.el, dat.el, nt.el), speichern: 'Speichern', onSpeichern: async () => {
      const k = opt.find((x) => Gruen.STATUS[x] === st.wert()) || 'aktiv';

      }
      App.neu();

  },
};

<script>
/* GRUENZEUG – Lexikon: Arten mit Seltenheit, Pflege und Besonderheiten. Inhalte stehen in content/arten.js. */
const Lexikon = {
  zustand: { q: '', f: 'alle' },
  FARBEN: { 'Aronstabgewächse': ['#3f6b4c', '#2a4a35'], 'Sukkulenten & Kakteen': ['#8a8a4a', '#5f6030'], 'Farne': ['#4f7a52', '#35573a'], 'Palmen': ['#5c7f4a', '#3d5a30'],
    'Orchideen': ['#a35a7a', '#74395a'], 'Fleischfresser': ['#9a4a3c', '#6e2f27'], 'Blühpflanzen': ['#b0643f', '#7e4228'], 'Feigen & Bäume': ['#5b7a5e', '#3b543f'],
    'Hängepflanzen': ['#3f7a72', '#2a5650'], 'Buntblatt': ['#7a5a8a', '#52386a'] },
  farbe(kat) { return Lexikon.FARBEN[kat] || ['#4d7a58', '#2f5a3d']; },

  besitz(artId) { return [...Data.plants.values()].filter((p) => p.artId === artId && p.status === 'aktiv'); },

  zeile(a) {
    const [c1, c2] = Lexikon.farbe(a.kat);
    const kachel = U.el('div', { class: 'kachel-k' }, App.icon(ICON_LEXIKON_KAT[a.kat] || 'blatt'));
    kachel.style.background = 'linear-gradient(135deg,' + c1 + ',' + c2 + ')'; kachel.style.color = '#fff';
    const r = U.el('div', { class: 'r' }, App.punkte(a.selten));
    const n = Lexikon.besitz(a.id).length;
    if (n) r.append(U.el('span', { class: 'eigen', text: n + '× bei dir' }));
    else if (Data.wunsch().includes(a.id)) r.append(U.el('span', { class: 'eigen', text: '♥ Wunschliste' }));
    return U.el('button', { class: 'lex', onclick: () => App.oeffne(() => Lexikon.detail(a.id)) }, kachel,
      U.el('div', { class: 't' }, U.el('b', { text: a.name }), U.el('i', { text: a.latein === a.name ? a.kat : a.latein })), r);
  },

  filtern() {
    const z = Lexikon.zustand;
    let l = Gruen.arten.slice();
    if (z.f === 'rar') l = l.filter((a) => a.selten >= 3);
    else if (z.f === 'anfaenger') l = l.filter((a) => a.schwer === 1);
    else if (z.f === 'tiere') l = l.filter((a) => !a.giftig);
    else if (z.f === 'wunsch') l = l.filter((a) => Data.wunsch().includes(a.id));
    else if (z.f.startsWith('k:')) l = l.filter((a) => a.kat === z.f.slice(2));
    if (z.q) l = l.filter((a) => U.trifft([a.name, a.latein, (a.alias || []).join(' '), a.kat, a.kurz, (a.sorten || []).map((s) => s.n).join(' ')].join(' '), z.q));
    return l.sort((a, b) => (z.f === 'rar' ? b.selten - a.selten : 0) || a.name.localeCompare(b.name, 'de'));
  },

  seite() {
    const z = Lexikon.zustand;
    const w = U.el('div');
    const si = U.el('input', { type: 'search', placeholder: 'Name, Art, Sorte …', 'aria-label': 'Lexikon durchsuchen', value: z.q, autocomplete: 'off' });
    const chips = U.el('div', { class: 'chips', role: 'toolbar' });
    const out = U.el('div');
    const filter = [['alle', 'Alle'], ['rar', 'Raritäten'], ['anfaenger', 'Für Anfänger'], ['tiere', 'Tierfreundlich'], ['wunsch', 'Wunschliste ♥'], ...Gruen.KATEGORIEN.map((k) => ['k:' + k, k])];
    const zeichneChips = () => { chips.replaceChildren(...filter.map(([id, l]) => U.el('button', { class: 'chip' + (z.f === id ? ' on' : ''), text: l, onclick: () => { z.f = id; zeichneChips(); zeichne(); } }))); };
    const zeichne = () => {
      const l = Lexikon.filtern();
      out.replaceChildren();
      if (!l.length) { out.append(App.leer(z.f === 'wunsch' ? 'herz' : 'suche', z.f === 'wunsch' ? 'Wunschliste ist leer' : 'Nichts gefunden', z.f === 'wunsch' ? 'Tippe in einem Lexikon-Eintrag auf das Herz.' : 'Andere Schreibweise oder lateinischer Name?')); return; }
      out.append(U.el('div', { class: 'muted klein', style: { margin: '2px 2px 8px' }, text: U.plural(l.length, 'Art', 'Arten') }), U.el('div', { class: 'card flach' }, l.map((a) => Lexikon.zeile(a))));
    };
    si.addEventListener('input', () => { z.q = si.value; zeichne(); });
    w.append(U.el('div', { class: 'suche' }, App.icon('suche'), si), chips, out);
    zeichneChips(); zeichne();
    return { titel: 'Lexikon', sub: Gruen.arten.length + ' Pflanzen · von häufig bis Sammlerstück', inhalt: w };
  },

  detail(id) {
    const a = Gruen.artById(id);
    if (!a) return { titel: 'Nicht gefunden', zurueck: true, inhalt: App.leer('info', 'Eintrag nicht gefunden', '') };
    const [c1, c2] = Lexikon.farbe(a.kat);
    const w = U.el('div');
    const hero = U.el('div', { class: 'lexhero' }, U.el('h1', { text: a.name }), U.el('div', { class: 'latein', text: a.latein }),
      U.el('div', { class: 'pillen' }, U.el('span', { class: 'pille' }, App.punkte(a.selten), ' ' + Gruen.SELTEN[a.selten]), U.el('span', { class: 'pille', text: a.kat }), U.el('span', { class: 'pille', text: Gruen.SCHWER[a.schwer] })));
    hero.style.background = 'linear-gradient(150deg,' + c1 + ',' + c2 + ')';
    const gross = App.icon(ICON_LEXIKON_KAT[a.kat] || 'blatt'); gross.setAttribute('class', 'gross'); hero.prepend(gross);
    w.append(hero, U.el('p', { class: 'lead', text: a.kurz }));
    if (a.alias && a.alias.length) w.append(U.el('p', { class: 'muted klein', style: { margin: '0 2px 8px' }, text: 'Auch: ' + a.alias.join(', ') }));
    if (a.selten >= 3) w.append(U.el('div', { class: 'box warn' }, U.el('b', { text: Gruen.SELTEN[a.selten] }), Gruen.SELTEN_INFO[a.selten]));

    const nutzer = Lexikon.besitz(a.id);
    const wunsch = Data.wunsch().includes(a.id);
    w.append(U.el('div', { class: 'btnreihe', style: { margin: '12px 0' } },
      U.el('button', { class: 'btn', onclick: () => Formen.pflanze('zimmer', null, (p) => { App.tab('sammlung'); App.oeffne(() => Detail.seite(p.id)); }, { name: a.name, artId: a.id, art: a.name, giessTage: a.giessTage || null }) }, App.icon('plus'), 'Zur Sammlung'),
      U.el('button', { class: 'btn ' + (wunsch ? 'clay' : 'ghost'), onclick: async () => { await Data.wunschSetzen(a.id, !wunsch); App.toast(wunsch ? 'Von der Wunschliste entfernt' : 'Auf der Wunschliste'); App.neu(); } }, App.icon('herz'), wunsch ? 'Wunschliste ✓' : 'Wunschliste')));
    if (nutzer.length) {
      const k = U.el('div', { class: 'card flach' });
      nutzer.forEach((p) => k.append(U.el('button', { class: 'zeile', onclick: () => App.oeffne(() => Detail.seite(p.id)) }, App.icon('sammlung'), U.el('div', { class: 't' }, U.el('b', { text: 'Du hast: ' + p.name }), U.el('span', { text: p.standort || 'in deiner Sammlung' })))));
      w.append(k);
    }

    const f = U.el('dl', { class: 'fakten', style: { margin: '0 0 4px' } });
    const add = (k, v, breit) => { if (v) f.append(U.el('div', { class: breit ? 'breit' : '' }, U.el('dt', { text: k }), U.el('dd', { text: v }))); };
    add('Licht', a.licht); add('Wasser', a.wasser); add('Luftfeuchte', a.feuchte); add('Temperatur', a.temp); add('Substrat', a.substrat, true);
    add('Vermehrung', a.vermehrung, true); add('Herkunft', a.herkunft, true);
    add('Haustiere & Kinder', a.giftig ? 'Giftig' + (a.giftHinweis ? ': ' + a.giftHinweis : '') : 'Gilt als ungiftig' + (a.giftHinweis ? ' (' + a.giftHinweis + ')' : ''), true);
    w.append(App.abschnitt('Pflege auf einen Blick'), f);

    if (a.text) w.append(App.abschnitt('Über die Pflanze'), U.el('div', { class: 'card prose' }, U.md(a.text)));
    if (a.besonders && a.besonders.length) w.append(App.abschnitt('Besonderheiten'), U.el('div', { class: 'card' }, U.el('ul', { class: 'liste' }, a.besonders.map((b) => U.el('li', { text: b })))));
    if (a.sorten && a.sorten.length) w.append(App.abschnitt('Sorten & Varianten'), U.el('div', { class: 'card flach' }, a.sorten.map((s) => U.el('div', { class: 'zeile', style: { cursor: 'default', alignItems: 'flex-start' } }, U.el('div', { class: 't' }, U.el('b', { text: s.n }), U.el('span', { text: s.t }))))));
    if (a.tipps && a.tipps.length) w.append(App.abschnitt('Tipps'), U.el('div', { class: 'card' }, U.el('ul', { class: 'liste' }, a.tipps.map((b) => U.el('li', { text: b })))));
    if (a.probleme && a.probleme.length) w.append(App.abschnitt('Typische Probleme'), U.el('div', { class: 'card' }, U.el('ul', { class: 'liste' }, a.probleme.map((b) => U.el('li', { text: b }))), U.el('button', { class: 'btn klein ghost', style: { marginTop: '10px' }, text: 'Zur Diagnose', onclick: () => { Wissen.zustand.tab = 'diagnose'; App.tab('wissen'); } })));
    return { titel: a.name, kleinTitel: true, zurueck: true, ohneTab: true, inhalt: w };
  },
};
App.tabBauer.lexikon = () => Lexikon.seite();

<script>
/* GRUENZEUG – Wissen: Pflege-Grundlagen, Schädlinge, Diagnose (Symptom → Ursachen). Inhalte in content/. */
const Wissen = {
  zustand: { tab: 'grundlagen', q: '' },

  seite() {
    const z = Wissen.zustand;
    const w = U.el('div');
    w.append(App.segment([{ id: 'grundlagen', label: 'Grundlagen' }, { id: 'schaedlinge', label: 'Schädlinge' }, { id: 'diagnose', label: 'Diagnose' }], z.tab, (id) => { z.tab = id; z.q = ''; App.neu(); }));
    const si = U.el('input', { type: 'search', placeholder: z.tab === 'diagnose' ? 'Symptom suchen, z. B. gelbe Blätter' : 'Suchen …', 'aria-label': 'Suchen', value: z.q, autocomplete: 'off' });
    const out = U.el('div');
    const zeichne = () => {
      out.replaceChildren();
      const q = z.q;
      let l;

        l = Gruen.wissen.filter((t) => !t.privat && U.trifft(t.titel + ' ' + t.kurz + ' ' + (t.abschnitte || []).map((a) => a.h + ' ' + a.text).join(' '), q));

        out.append(U.el('div', { class: 'card flach' }, l.map((t) => App.zeile(t.titel, t.kurz, t.icon || 'wissen', () => App.oeffne(() => Wissen.thema(t.id))))));

        if (!l.length) return out.append(App.leer('suche', 'Nichts gefunden', 'Anderer Suchbegriff?'));
        out.append(U.el('div', { class: 'card flach' }, l.map((t) => App.zeile(t.name, t.kurz, 'kaefer', () => App.oeffne(() => Wissen.schaedling(t.id))))));
      } else {
        l = Gruen.diagnose.filter((t) => U.trifft(t.titel + ' ' + (t.stichworte || '') + ' ' + t.ursachen.map((u) => u.name).join(' '), q));
        if (!l.length) return out.append(App.leer('suche', 'Nichts gefunden', 'Probiere ein anderes Wort: „braun“, „welk“, „klebrig“ …'));
        out.append(U.el('div', { class: 'box' }, U.el('b', { text: 'Was sieht deine Pflanze?' }), 'Wähle das auffälligste Symptom. Du bekommst die möglichen Ursachen, die häufigste zuerst, und wie du sie prüfst.'),
          U.el('div', { class: 'card flach' }, l.map((t) => App.zeile(t.titel, t.kurz, 'warnung', () => App.oeffne(() => Wissen.symptom(t.id))))));
      }
    };
    si.addEventListener('input', () => { z.q = si.value; zeichne(); });
    w.append(U.el('div', { class: 'suche' }, App.icon('suche'), si), out);
    zeichne();
    return { titel: 'Wissen', sub: 'Pflege · Schädlinge · Diagnose', inhalt: w };
  },

  thema(id) {
    const t = Gruen.wissen.find((x) => x.id === id);
    if (!t) return { titel: 'Nicht gefunden', zurueck: true, inhalt: App.leer('info', 'Thema nicht gefunden', '') };
    const w = U.el('div');
    w.append(U.el('p', { class: 'lead', text: t.kurz }));
    if (t.merksaetze && t.merksaetze.length) w.append(U.el('div', { class: 'box' }, U.el('b', { text: 'Kurz gesagt' }), U.el('ul', { class: 'liste', style: { margin: '4px 0 0' } }, t.merksaetze.map((m) => U.el('li', { text: m })))));
    (t.abschnitte || []).forEach((a) => w.append(U.el('div', { class: 'card prose' }, a.h ? U.el('h3', { text: a.h }) : null, U.md(a.text))));
    const verw = (t.siehe || []).map((i) => Gruen.wissen.find((x) => x.id === i)).filter(Boolean);
    if (verw.length) w.append(App.abschnitt('Dazu passt'), U.el('div', { class: 'card flach' }, verw.map((v) => App.zeile(v.titel, v.kurz, v.icon || 'wissen', () => App.oeffne(() => Wissen.thema(v.id))))));

  },

  schaedling(id) {
    const t = Gruen.schaedlinge.find((x) => x.id === id);
    if (!t) return { titel: 'Nicht gefunden', zurueck: true, inhalt: App.leer('info', 'Nicht gefunden', '') };
    const w = U.el('div');
    w.append(U.el('p', { class: 'lead', text: t.kurz }));
    w.append(U.el('div', { class: 'pillen', style: { marginBottom: '10px' } }, App.pille(['', 'Meist harmlos', 'Lästig', 'Gefährlich für die Pflanze'][t.gefahr], ['', '', 'sun', 'rot'][t.gefahr]), t.wo ? App.pille(t.wo, 'grau') : null));
    const liste = (titel, arr, ordered) => { if (arr && arr.length) w.append(App.abschnitt(titel), U.el('div', { class: 'card' }, ordered ? U.el('ol', { class: 'schritte' }, arr.map((x) => U.el('li', { text: x }))) : U.el('ul', { class: 'liste' }, arr.map((x) => U.el('li', { text: x }))))); };

    if (t.hinweis) w.append(U.el('div', { class: 'box warn' }, U.el('b', { text: 'Gut zu wissen' }), t.hinweis));

  symptom(id) {

    if (!t) return { titel: 'Nicht gefunden', zurueck: true, inhalt: App.leer('info', 'Nicht gefunden', '') };
    const w = U.el('div');
    w.append(U.el('p', { class: 'lead', text: t.kurz }), U.el('p', { class: 'muted klein', text: 'Mögliche Ursachen, die wahrscheinlichste zuerst. Prüfe eine nach der anderen – oft sind es zwei zusammen.' }));
    t.ursachen.forEach((u, i) => w.append(U.el('div', { class: 'card' },

<script>
/* GRUENZEUG – Privater Bereich: das Grow-Logbuch (Cannabis) hinter einer PIN. Die PIN sperrt nur die Ansicht in
   der App (SHA-256 mit Salz, im Gerät). Die Daten selbst liegen nicht verschlüsselt im Gerät – dafür gilt die
   Gerätesperre des Handys. Entsperrt bleibt der Bereich, bis die App eine Minute im Hintergrund war oder man sperrt. */
const Privat = {
  offen: false,
  _weg: 0,

  cfg() { return Einst.get('pin', null); },
  aktiv() { return !!Privat.cfg(); },

  async hash(pin, salt) {
    try {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin));
      return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
    } catch (e) { return 'h' + U.hash(salt + ':' + pin); }   // ohne Web Crypto (z. B. file://): einfacher Hash
  },
  async setzen(pin) {
    const salt = U.uid() + U.uid();
    Einst.set('pin', { salt, hash: await Privat.hash(pin, salt), len: pin.length });
  },
  async pruefen(pin) {
    const c = Privat.cfg();
    return !!c && (await Privat.hash(pin, c.salt)) === c.hash;
  },

  /** Ziffernfeld. onFertig(pin) → true = schließen, false = Fehler (Schütteln). laenge: feste Länge (Entsperren) oder null (Neu: 4–6 mit ✓) */
  pinFeld(titel, text, laenge, onFertig, extra) {
    let pin = '';
    const punkte = U.el('div', { class: 'pin' });
    const zeichne = () => { punkte.replaceChildren(); const n = laenge || Math.max(4, pin.length); for (let i = 0; i < n; i++) punkte.append(U.el('i', { class: i < pin.length ? 'an' : '' })); };
    const senden = async () => {
      if (laenge ? pin.length !== laenge : pin.length < 4) return;
      const ok = await onFertig(pin);
      if (ok) s.zu();
      else { pin = ''; zeichne(); punkte.classList.remove('schuettel'); void punkte.offsetWidth; punkte.classList.add('schuettel'); }
    };
    const taste = (z) => { if (pin.length < (laenge || 6)) { pin += z; zeichne(); if (laenge && pin.length === laenge) senden(); } };
    const feld = U.el('div', { class: 'ziffern' });
    ['1', '2', '3', '4', '5', '6', '7', '8', '9'].forEach((z) => feld.append(U.el('button', { onclick: () => taste(z), text: z, 'aria-label': z })));
    feld.append(U.el('button', { 'aria-label': 'Löschen', onclick: () => { pin = pin.slice(0, -1); zeichne(); } }, App.icon('zurueck')),
      U.el('button', { onclick: () => taste('0'), text: '0', 'aria-label': '0' }),
      laenge ? U.el('button', { class: 'leer-t' }) : U.el('button', { 'aria-label': 'Bestätigen', onclick: senden }, App.icon('haken')));
    const inh = U.el('div', { class: 'sperre' }, App.icon('schloss'), U.el('p', { class: 'muted', style: { margin: '8px 0 0' }, text: text }), punkte, feld, extra || null);
    inh.firstChild.setAttribute('class', 'gross');
    zeichne();
    const s = App.sheet({ titel: titel, inhalt: inh });
    return s;
  },

  /** Einstieg: Bereich öffnen (mit PIN, falls gesperrt) */
  oeffnen() {
    if (!Privat.aktiv()) { App.toast('Erst in „Mehr“ → Einstellungen einrichten'); return; }
    if (Privat.offen) { Privat._zeigen(); return; }
    const c = Privat.cfg();
    Privat.pinFeld('Entsperren', 'PIN eingeben', c.len, async (pin) => {
      if (!(await Privat.pruefen(pin))) return false;
      Privat.offen = true; Privat._zeigen(); return true;
    }, U.el('button', { class: 'btn klein ghost', style: { marginTop: '18px' }, text: 'PIN vergessen?', onclick: () => Privat.zuruecksetzen() }));
  },
  _zeigen() { App.oeffne(() => Sammlung.seite('cannabis')); },
  sperren() {
    Privat.offen = false;
    if (App.seiten.some((s) => s.privat)) App.tab(App.aktTab);
    App.toast('Gesperrt');
  },

  /** Einrichten: Info, dann PIN zweimal */
  einrichten() {
    const inh = U.el('div', null,
      U.el('p', { text: 'Ein zweites, verstecktes Logbuch für den Grow – mit eigenen Eintragstypen (Phasen, pH/EC, Training, Ernte …). Es taucht nirgends in Sammlung, Lexikon oder „Heute“ auf.' }),
      U.el('div', { class: 'box warn' }, U.el('b', { text: 'Wichtig' }), 'Die PIN sperrt nur die Ansicht in der App. Die Daten liegen unverschlüsselt im Gerät – schütze das Handy selbst mit Gerätesperre. Ohne PIN lässt sich der Bereich nur zurücksetzen (Grow-Daten werden dabei gelöscht).'),
      U.el('div', { class: 'box' }, U.el('b', { text: 'Rechtliches' }), 'In Deutschland ist privater Eigenanbau für Erwachsene (ab 18) unter Auflagen erlaubt, derzeit bis zu 3 Pflanzen pro Person, geschützt vor Kindern und Dritten. Angaben ohne Gewähr – die aktuelle Rechtslage prüfst du selbst.'));
    const s = App.sheet({ titel: 'Privaten Bereich einrichten', inhalt: inh, speichern: 'PIN festlegen', onSpeichern: async () => {
      setTimeout(() => {
        Privat.pinFeld('Neue PIN', '4 bis 6 Ziffern, dann ✓', null, async (p1) => {
          setTimeout(() => Privat.pinFeld('PIN wiederholen', 'Zur Bestätigung noch einmal', null, async (p2) => {
            if (p1 !== p2) { App.toast('Die PINs stimmen nicht überein'); return false; }
            await Privat.setzen(p2); Privat.offen = true; App.toast('Privater Bereich eingerichtet'); App.neu(); return true;
          }), 220);
          return true;
        });
      }, 220);
    } });
  },

  /** PIN vergessen / Bereich entfernen: löscht Grow-Daten */
  async zuruecksetzen() {
    const n = Data.liste('cannabis').length;

  },

  async pinAendern() {
    Privat.pinFeld('Aktuelle PIN', 'Zur Sicherheit erst die alte PIN', Privat.cfg().len, async (alt) => {
      if (!(await Privat.pruefen(alt))) return false;
      setTimeout(() => Privat.pinFeld('Neue PIN', '4 bis 6 Ziffern, dann ✓', null, async (n1) => { await Privat.setzen(n1); App.toast('PIN geändert'); return true; }), 220);
      return true;
    });
  },

  /** Hinweis oben im Grow-Logbuch */
  hinweis(alle) {
    const aktive = alle.filter((p) => p.status === 'aktiv').length;
    const w = U.el('div');
    if (aktive > 3) w.append(U.el('div', { class: 'box rot' }, U.el('b', { text: 'Mehr als 3 aktive Pflanzen' }), 'Für den privaten Eigenanbau sind in Deutschland derzeit höchstens 3 Pflanzen pro Person erlaubt. Prüfe die aktuelle Rechtslage.'));
    return w;
  },
};

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') Privat._weg = Date.now();
  else if (Privat.offen && Privat._weg && Date.now() - Privat._weg > 60000) { Privat.offen = false; if (App.seiten.some((s) => s.privat)) App.tab(App.aktTab); }
});

<script>
/* GRUENZEUG – Start: Daten laden, Oberfläche zeigen, Service Worker, Update-Prüfung, ?selftest.
   Updates: Der Service Worker holt die Seite immer zuerst aus dem Netz (offline aus dem Speicher). Beim Zurückkehren
   in die App fragt `Updates` version.json und lädt neu, sobald gerade kein Formular offen ist. */
const Updates = {
  async pruefen(manuell) {
    if (typeof GRUEN_BUILD === 'undefined' || location.protocol === 'file:') { if (manuell) App.toast('Entwicklungsfassung – keine Updates'); return; }
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      const v = await r.json();
      if (v.id && v.id !== GRUEN_BUILD.id) {
        if (document.querySelector('.sheet-bg, .lupe')) { Updates.wartet = true; if (manuell) App.toast('Update bereit – nach dem Schließen wird neu geladen'); return; }
        App.toast('Neue Version wird geladen …'); setTimeout(() => location.reload(), 600);
      } else if (manuell) App.toast('Du hast die neueste Version');
    } catch (e) { if (manuell) App.toast('Keine Verbindung – Update-Prüfung nicht möglich'); }
  },
};

(async function start() {
  try {
    await Data.load();
    App.init();
    if (Data.fluechtig) App.toast('Speicher blockiert – Daten bleiben nicht erhalten', 5000);
  } catch (e) {
    console.error(e);
    document.getElementById('app').append(U.el('div', { style: { padding: '30px', fontFamily: 'sans-serif' } }, U.el('h2', { text: 'Gruenzeug konnte nicht starten' }), U.el('p', { text: String(e && e.message || e) })));
    return;
  }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && typeof GRUEN_BUILD !== 'undefined') {
