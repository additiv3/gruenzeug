/* GRUENZEUG – Gestaltung: botanisches Feldbuch. Papierton, Moosgrün, Terrakotta, Serifen-Überschriften.
   Nur Farben über Variablen. Hell/Dunkel folgt dem Gerät. Tippflächen ≥ 44 px, Eingaben 16 px (sonst zoomt iOS). */
:root {
  --bg: #f2eee4; --card: #fbf9f3; --card2: #f5f1e6; --ink: #1e2a22; --muted: #66716a; --line: #dcd5c3;
  --accent: #2f5a3d; --on-accent: #fbf9f3; --accent-text: #2f5a3d; --accent-bg: #e1ebdf;
  --clay: #b8552f; --clay-bg: #f4e2d8; --sun: #b98a1f; --sun-bg: #f4ebcf; --danger: #a23a2e; --danger-bg: #f5dcd7;
  --shadow: 0 1px 2px rgba(30, 42, 34, .06), 0 8px 24px rgba(30, 42, 34, .07);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tab-h: 60px;
  --sb: env(safe-area-inset-bottom, 0px); --st: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121912; --card: #1a231c; --card2: #202b23; --ink: #e8eadf; --muted: #98a399; --line: #2c392f;
    --accent: #86bb92; --on-accent: #0f1912; --accent-text: #98cba3; --accent-bg: #223427;
    --clay: #e8906a; --clay-bg: #3b2820; --sun: #dcb04a; --sun-bg: #38301a; --danger: #ef8c7e; --danger-bg: #3d2420;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--sans); -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body { overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: -.01em; }
p { margin: 0 0 .7em; }
a { color: var(--accent-text); }
.muted { color: var(--muted); }
.klein { font-size: 13px; }
.latein { font-family: var(--serif); font-style: italic; }
.verb { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Gerüst ---------- */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.stack { position: relative; flex: 1; min-height: 0; }
.page { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.page.rein { animation: rein .22s ease-out; }
@keyframes rein { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
.bar { display: flex; align-items: flex-end; gap: 8px; padding: calc(var(--st) + 10px) 14px 8px 14px; min-height: 56px; }
.bar .titel { flex: 1; min-width: 0; }
.bar h1 { font-size: 30px; line-height: 1.1; }
.bar.klein-titel h1 { font-size: 22px; }
.bar .sub { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; font-weight: 600; }
.bar .aktionen { display: flex; gap: 2px; margin-bottom: -2px; }
.ib { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--ink); }
.ib:active { background: var(--card2); }
.ib svg { width: 24px; height: 24px; }
.body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 14px 32px; }
.fab ~ .body, .page:has(.fab) .body { padding-bottom: 100px; }
.tabbar { display: flex; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: var(--sb); position: relative; z-index: 5; }
.tabbar button { flex: 1; height: var(--tab-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .02em; position: relative; }
.tabbar button svg { width: 25px; height: 25px; }
.tabbar button.on { color: var(--accent-text); }
.tabbar button.on::before { content: ""; position: absolute; top: 0; width: 26px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent-text); }

/* ---------- Bausteine ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
.card.flach { padding: 0; overflow: hidden; }
.card h3 { font-size: 18px; margin-bottom: 8px; }
.abschnitt { margin: 22px 2px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.abschnitt h2 { font-size: 20px; }
.abschnitt .mehr { font-size: 14px; color: var(--accent-text); font-weight: 600; padding: 6px 0; }
.etikett { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.zeile { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; min-height: 54px; }
.zeile:last-child { border-bottom: 0; }
.zeile:active { background: var(--card2); }
.zeile .t { flex: 1; min-width: 0; }
.zeile .t b { display: block; font-weight: 600; }
.zeile .t span { display: block; font-size: 13.5px; color: var(--muted); }
.zeile > svg { width: 22px; height: 22px; color: var(--muted); flex: none; }
.zeile .pfeil { width: 18px; height: 18px; color: var(--muted); opacity: .6; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 14px 10px; margin: 0 -14px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; min-height: 38px; }
.chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.pille { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; background: var(--accent-bg); color: var(--accent-text); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.pille.clay { background: var(--clay-bg); color: var(--clay); }
.pille.sun { background: var(--sun-bg); color: var(--sun); }
.pille.rot { background: var(--danger-bg); color: var(--danger); }
.pille.grau { background: var(--card2); color: var(--muted); border: 1px solid var(--line); }
.pille svg { width: 13px; height: 13px; }
.pillen { display: flex; flex-wrap: wrap; gap: 6px; }
.punkte { display: inline-flex; gap: 3px; vertical-align: middle; }
.punkte i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.punkte i.an { background: var(--clay); }
.leer { text-align: center; color: var(--muted); padding: 36px 18px; }
.leer svg { width: 54px; height: 54px; color: var(--accent-text); opacity: .85; margin-bottom: 8px; }
.leer h3 { color: var(--ink); margin-bottom: 6px; }
.suche { position: relative; margin: 6px 0 8px; }
.suche input { width: 100%; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); padding: 0 14px 0 44px; font-size: 16px; outline: none; }
.suche input:focus { border-color: var(--accent); }
.suche svg { position: absolute; left: 13px; top: 12px; width: 22px; height: 22px; color: var(--muted); }

/* Knöpfe */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 16px; }
.btn:active { filter: brightness(.92); transform: translateY(1px); }
.btn.sekundaer { background: var(--accent-bg); color: var(--accent-text); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.clay { background: var(--clay); color: #fff; }
.btn.gefahr { background: var(--danger-bg); color: var(--danger); }
.btn.voll { width: 100%; }
.btn.klein { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn svg { width: 20px; height: 20px; }
.btnreihe { display: flex; gap: 8px; flex-wrap: wrap; }
.btnreihe .btn { flex: 1; }
.fab { position: absolute; right: 16px; bottom: 16px; width: 58px; height: 58px; border-radius: 20px; background: var(--clay); color: #fff; display: grid; place-items: center; box-shadow: var(--shadow); z-index: 4; }
.fab svg { width: 28px; height: 28px; }
.fab:active { transform: scale(.95); }

/* ---------- Pflanzenkacheln ---------- */
.gitter { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 640px) { .gitter { grid-template-columns: repeat(4, 1fr); } .body { max-width: 900px; margin: 0 auto; width: 100%; } }
.kachel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; text-align: left; position: relative; display: block; width: 100%; }
.kachel:active { transform: scale(.98); }
.kachel .bild, .kachel .ph { width: 100%; aspect-ratio: 1; display: block; object-fit: cover; }
.kachel .info { padding: 9px 11px 11px; }
.kachel .name { font-family: var(--serif); font-weight: 600; font-size: 17px; line-height: 1.2; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kachel .art { font-size: 13px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kachel .marke { position: absolute; top: 8px; left: 8px; }
.kachel .herz { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 14px; background: rgba(0, 0, 0, .38); color: #fff; display: grid; place-items: center; }
.kachel .herz svg { width: 16px; height: 16px; fill: #fff; }
.ph { background: var(--card2); display: grid; place-items: center; position: relative; overflow: hidden; }
.ph svg { width: 46%; height: 46%; opacity: .5; }
.bild { background: var(--card2); }

/* Gieß-Zeilen */
.faellig { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.faellig:last-child { border-bottom: 0; }
.faellig .thumb { width: 50px; height: 50px; border-radius: 12px; overflow: hidden; flex: none; }
.faellig .thumb > * { width: 100%; height: 100%; object-fit: cover; display: block; }
.faellig .t { flex: 1; min-width: 0; text-align: left; }
.faellig .t b { display: block; font-family: var(--serif); font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.faellig .t span { font-size: 13px; color: var(--muted); }
.faellig .t span.ueber { color: var(--clay); font-weight: 700; }
.tropf { width: 46px; height: 46px; border-radius: 15px; background: var(--accent-bg); color: var(--accent-text); display: grid; place-items: center; flex: none; }
.tropf svg { width: 24px; height: 24px; }
.tropf:active { background: var(--accent); color: var(--on-accent); }
.tropf.fertig { background: var(--accent); color: var(--on-accent); }

/* ---------- Detailseite ---------- */
.hero { margin: -4px -14px 0; position: relative; }
.hero .bild, .hero .ph { width: 100%; aspect-ratio: 4 / 3.2; object-fit: cover; display: block; }
.hero .ph svg { width: 30%; height: 30%; }
.hero .verlauf { position: absolute; inset: auto 0 0 0; height: 40%; background: linear-gradient(transparent, rgba(0, 0, 0, .45)); pointer-events: none; }
.hero .foto-knopf { position: absolute; right: 14px; bottom: 12px; background: rgba(0, 0, 0, .5); color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; display: flex; gap: 6px; align-items: center; backdrop-filter: blur(6px); }
.hero .foto-knopf svg { width: 18px; height: 18px; }
.kopf { padding: 14px 2px 4px; }
.kopf h1 { font-size: 30px; line-height: 1.1; }
.kopf .latein { color: var(--muted); font-size: 16px; margin-top: 2px; }
.schnell { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 6px; }
.schnell button { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; min-height: 68px; }
.schnell button svg { width: 24px; height: 24px; color: var(--accent-text); }
.schnell button:active { background: var(--card2); }
.schnell button.klar svg { color: var(--clay); }
.fakten { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.fakten > div { background: var(--card); padding: 10px 12px; min-width: 0; }
.fakten > div.breit { grid-column: 1 / -1; }
.fakten dt { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0 0 2px; }
.fakten dd { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
.galerie { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.galerie button { aspect-ratio: 1; overflow: hidden; border-radius: 8px; background: var(--card2); }
.galerie img { width: 100%; height: 100%; object-fit: cover; display: block; }
.verlaufsliste { position: relative; margin: 0; padding: 0 0 0 26px; list-style: none; }
.verlaufsliste::before { content: ""; position: absolute; left: 10px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.verlaufsliste li { position: relative; padding: 0 0 16px 0; }
.verlaufsliste li:last-child { padding-bottom: 0; }
.verlaufsliste .punkt { position: absolute; left: -26px; top: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-bg); color: var(--accent-text); display: grid; place-items: center; border: 2px solid var(--bg); box-sizing: content-box; margin-left: -2px; }
.verlaufsliste .punkt svg { width: 12px; height: 12px; }
.verlaufsliste .e { text-align: left; width: 100%; display: block; }
.verlaufsliste .e b { font-weight: 700; font-size: 15px; }
.verlaufsliste .e .d { font-size: 12.5px; color: var(--muted); margin-left: 6px; }
.verlaufsliste .e p { margin: 3px 0 0; font-size: 14.5px; white-space: pre-wrap; }
.verlaufsliste .e .w { font-size: 13px; color: var(--muted); margin-top: 2px; }
.verlaufsliste .mini { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
.verlaufsliste .mini img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; display: block; }
.monat { font-family: var(--serif); font-size: 15px; color: var(--muted); margin: 6px 0 12px -26px; padding-left: 26px; font-style: italic; }

/* Vorher/Nachher */
.vn { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; background: var(--card2); touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.vn img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.vn .oben { clip-path: inset(0 50% 0 0); }
.vn .griff { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; background: #fff; margin-left: -1.5px; box-shadow: 0 0 6px rgba(0, 0, 0, .4); pointer-events: none; }
.vn .griff::after { content: ""; position: absolute; top: 50%; left: 50%; width: 34px; height: 34px; margin: -17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 6px rgba(0, 0, 0, .4); }
.vn .tag { position: absolute; top: 8px; padding: 3px 9px; border-radius: 999px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 12px; font-weight: 700; pointer-events: none; }
.vn input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }

/* Diagramm */
.diagramm { width: 100%; height: auto; display: block; }
.diagramm text { font: 11px var(--sans); fill: var(--muted); }
.diagramm .linie { fill: none; stroke: var(--accent-text); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.diagramm .flaeche { fill: var(--accent-bg); opacity: .8; }
.diagramm .gitter-l { stroke: var(--line); stroke-width: 1; }
.diagramm circle { fill: var(--card); stroke: var(--accent-text); stroke-width: 2.4; }

/* ---------- Formulare, Sheets ---------- */
.feld { margin-bottom: 14px; }
.feld > label, .feld > .lbl { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0 2px 5px; }
.feld input, .feld select, .feld textarea { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); padding: 10px 13px; font-size: 16px; outline: none; appearance: none; -webkit-appearance: none; }
.feld input[type=date] { min-height: 46px; }
.feld textarea { min-height: 96px; resize: vertical; line-height: 1.4; }
.feld input:focus, .feld select:focus, .feld textarea:focus { border-color: var(--accent); background: var(--card); }
.feld .mit-einheit { display: flex; align-items: center; gap: 8px; }
.feld .einheit { color: var(--muted); font-weight: 600; }
.zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.drei { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.hinweis { font-size: 13.5px; color: var(--muted); margin: 6px 2px 0; }
.box { border-radius: 14px; padding: 12px 14px; background: var(--accent-bg); color: var(--ink); font-size: 14.5px; margin-bottom: 12px; }
.box.warn { background: var(--sun-bg); }
.box.rot { background: var(--danger-bg); }
.box b { display: block; margin-bottom: 2px; }
.box p:last-child { margin-bottom: 0; }
.schalter { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 14px; width: 100%; text-align: left; min-height: 54px; }
.schalter .t { flex: 1; } .schalter .t b { display: block; font-weight: 600; } .schalter .t span { font-size: 13.5px; color: var(--muted); }
.sw { width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s; }
.sw.an { background: var(--accent); } .sw.an::after { transform: translateX(20px); }

.sheet-bg { position: fixed; inset: 0; background: rgba(10, 16, 12, .5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: ein .15s ease-out; }
@keyframes ein { from { opacity: 0; } to { opacity: 1; } }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: hoch .22s ease-out; padding-bottom: var(--sb); }
@keyframes hoch { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet .griff-oben { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; flex: none; }
.sheet .kopf-s { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 18px; flex: none; }
.sheet .kopf-s h2 { flex: 1; font-size: 21px; }
.sheet .inhalt { overflow-y: auto; padding: 6px 18px 18px; -webkit-overflow-scrolling: touch; }
.sheet .fuss { padding: 10px 18px 14px; display: flex; gap: 10px; border-top: 1px solid var(--line); flex: none; }
.sheet .fuss .btn { flex: 1; }
.typen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.typen button { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; text-align: center; min-height: 82px; }
.typen button svg { width: 26px; height: 26px; color: var(--accent-text); }
.typen button:active { background: var(--card2); }
.fotoleiste { display: flex; gap: 8px; flex-wrap: wrap; }
.fotoleiste .f { width: 76px; height: 76px; border-radius: 12px; overflow: hidden; position: relative; background: var(--card2); }
.fotoleiste .f img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fotoleiste .f button { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 12px; background: rgba(0, 0, 0, .6); color: #fff; display: grid; place-items: center; }
.fotoleiste .f button svg { width: 14px; height: 14px; }
.fotoleiste .neu { width: 76px; height: 76px; border-radius: 12px; border: 1.5px dashed var(--line); display: grid; place-items: center; color: var(--muted); }

<script>
/* GRUENZEUG – minimaler ZIP-Schreiber/-Leser (ohne Kompression, „stored").
   Backup = eine .zip mit data.json und photos/<id>.jpg. Fotos sind schon JPEG, Kompression würde nichts bringen,
   und so entsteht kein riesiger Base64-Text im Speicher. Die Datei lässt sich mit jedem Entpacker öffnen.
   Läuft auch in Node (tools/selftest.js). */
const Zip = {
  _tab: null,
  crc32(bytes) {
    if (!Zip._tab) {
      Zip._tab = new Uint32Array(256);
      for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; Zip._tab[n] = c >>> 0; }
    }
    let c = 0xFFFFFFFF;

    return (c ^ 0xFFFFFFFF) >>> 0;
  },
  async _bytes(d) {
    if (d instanceof Uint8Array) return d;
    if (typeof d === 'string') return new TextEncoder().encode(d);
    return new Uint8Array(await d.arrayBuffer());
  },
  /** files: [{name, data: string|Uint8Array|Blob}] → Blob (application/zip) */
  async make(files) {
    const teile = [], zentral = [];
    let pos = 0;
    const enc = new TextEncoder();
    for (const f of files) {
      const bytes = await Zip._bytes(f.data);
      const name = enc.encode(f.name);
      const crc = Zip.crc32(bytes);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, bytes.length, true); lh.setUint32(22, bytes.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      teile.push(lh.buffer, name, bytes);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true);
      ch.setUint32(20, bytes.length, true); ch.setUint32(24, bytes.length, true); ch.setUint16(28, name.length, true);
      ch.setUint32(42, pos, true);
      zentral.push(ch.buffer, name);
      pos += 30 + name.length + bytes.length;

    for (const z of zentral) zl += z.byteLength;
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, zl, true); end.setUint32(16, pos, true);

  /** Blob/File → Map name → Uint8Array (nur unkomprimierte Einträge) */
  async read(blob) {

<script>
/* GRUENZEUG – Daten: IndexedDB (Pflanzen, Einträge, Fotos, Merkliste), Einstellungen in localStorage, Sicherung als ZIP.
   Pflanzen und Einträge liegen zusätzlich im Speicher (Map): die Oberfläche liest synchron, jede Änderung wird
   sofort in IndexedDB geschrieben. Fotos werden erst bei Bedarf geladen.
   Läuft nur im Browser (Backup-Logik ist in `Sicherung` gekapselt und im Selbsttest geprüft). */
const SCHEMA = 1;   // Format der gespeicherten Daten. Änderungen → erhöhen und Übergang in Data.migrieren()

/** Einstellungen im Gerät (localStorage, immer mit try/catch: kann blockiert sein) */
const Einst = {
  get(k, dflt) { try { const v = localStorage.getItem('gruen.' + k); return v == null ? dflt : JSON.parse(v); } catch (e) { return dflt; } },
  set(k, v) { try { localStorage.setItem('gruen.' + k, JSON.stringify(v)); } catch (e) { /* ignorieren */ } },
  del(k) { try { localStorage.removeItem('gruen.' + k); } catch (e) { /* ignorieren */ } },

const Data = {
  db: null,
  fluechtig: false,          // true = IndexedDB nicht verfügbar (z. B. privates Fenster): nichts bleibt erhalten
  plants: new Map(),
  entries: new Map(),
  meta: {},
  _urls: new Map(),          // 'id:thumb' → Objekt-URL

  /* ---------- IndexedDB-Grundlagen ---------- */
  _open() {
    return new Promise((res, rej) => {
      if (typeof indexedDB === 'undefined') return rej(new Error('kein IndexedDB'));
      const r = indexedDB.open('gruenzeug', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('plants', { keyPath: 'id' });
        const e = d.createObjectStore('entries', { keyPath: 'id' });
        e.createIndex('plantId', 'plantId');
        d.createObjectStore('photos', { keyPath: 'id' });
        d.createObjectStore('meta', { keyPath: 'key' });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('blockiert'));
    });
  },
  _req(store, mode, fn) {
    if (!Data.db) return Promise.resolve(undefined);
    return new Promise((res, rej) => {
      const tx = Data.db.transaction(store, mode);
      const out = fn(tx);
      tx.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('abgebrochen'));
    });
  },
  _getAll(store) { return Data._req(store, 'readonly', (tx) => tx.objectStore(store).getAll()).then((r) => r || []); },
  _put(store, obj) { return Data._req(store, 'readwrite', (tx) => { tx.objectStore(store).put(obj); }); },
  _del(store, id) { return Data._req(store, 'readwrite', (tx) => { tx.objectStore(store).delete(id); }); },
  _clear(store) { return Data._req(store, 'readwrite', (tx) => { tx.objectStore(store).clear(); }); },
  _get(store, id) { return Data._req(store, 'readonly', (tx) => tx.objectStore(store).get(id)); },

  /* ---------- Laden ---------- */
  async load() {
    try { Data.db = await Data._open(); } catch (e) { Data.db = null; Data.fluechtig = true; }
    Data.plants.clear(); Data.entries.clear(); Data.meta = {};
    for (const p of await Data._getAll('plants')) Data.plants.set(p.id, p);
    for (const e of await Data._getAll('entries')) Data.entries.set(e.id, e);
    for (const m of await Data._getAll('meta')) Data.meta[m.key] = m.value;
    await Data.migrieren();
  },
  async migrieren() {
    const v = Data.meta.schema || 0;
    if (v < SCHEMA) await Data.setMeta('schema', SCHEMA);
  },
  async setMeta(key, value) { Data.meta[key] = value; await Data._put('meta', { key, value }); },

  /* ---------- Pflanzen ---------- */
  neuePflanze(kind, felder) {
    return Object.assign({ id: U.uid(), kind: kind || 'zimmer', name: '', status: 'aktiv', fakten: [], erstellt: Date.now() }, felder || {});
  },
  async savePlant(p) { Data.plants.set(p.id, p); await Data._put('plants', p); return p; },
  /** Pflanze, ihre Einträge und die nur von ihr benutzten Fotos löschen */
  async delPlant(id) {
    const p = Data.plants.get(id);
    if (!p) return;
    const fotos = new Set(p.titelFoto ? [p.titelFoto] : []);
    for (const e of Data.eintraege(id)) { (e.fotos || []).forEach((f) => fotos.add(f)); Data.entries.delete(e.id); await Data._del('entries', e.id); }
    Data.plants.delete(id);
    await Data._del('plants', id);
    for (const q of Data.plants.values()) if (q.mutter === id) { delete q.mutter; await Data._put('plants', q); }
    const benutzt = Data.benutzteFotos();
    for (const f of fotos) if (!benutzt.has(f)) await Data.delFoto(f);
  },
  liste(kind, status) {
    return [...Data.plants.values()].filter((p) => p.kind === kind && (!status || (status === 'aktiv' ? p.status === 'aktiv' : p.status !== 'aktiv')));
  },

  /* ---------- Einträge ---------- */
  neuerEintrag(plantId, typ, felder) {
    return Object.assign({ id: U.uid(), plantId, typ, datum: U.heute(), ts: Date.now(), text: '', fotos: [], werte: {} }, felder || {});
  },
  async saveEntry(e) { Data.entries.set(e.id, e); await Data._put('entries', e); return e; },
  async delEntry(id) {
    const e = Data.entries.get(id);
    if (!e) return;
    Data.entries.delete(id);
    await Data._del('entries', id);
    const benutzt = Data.benutzteFotos();
    for (const f of e.fotos || []) if (!benutzt.has(f)) await Data.delFoto(f);
  },
  /** Einträge einer Pflanze, neueste zuerst */
  eintraege(plantId) {
    const out = [];
    for (const e of Data.entries.values()) if (e.plantId === plantId) out.push(e);
    return out.sort((a, b) => (a.datum < b.datum ? 1 : a.datum > b.datum ? -1 : b.ts - a.ts));
  },
  letzter(plantId, typ) { return Data.eintraege(plantId).find((e) => e.typ === typ) || null; },
  benutzteFotos() {
    const s = new Set();
    for (const p of Data.plants.values()) if (p.titelFoto) s.add(p.titelFoto);
    for (const e of Data.entries.values()) (e.fotos || []).forEach((f) => s.add(f));
    return s;
  },

  /* ---------- Fotos ---------- */
  async addFoto(file) {
    const b = await U.bildVerkleinern(file);
    const f = { id: U.uid(), full: b.full, thumb: b.thumb, w: b.w, h: b.h, ts: Date.now() };
    await Data._put('photos', f);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    return f.id;
  },
  async foto(id) { return Data._get('photos', id); },
  async delFoto(id) {
    for (const k of [id + ':t', id + ':f']) { const u = Data._urls.get(k); if (u) { URL.revokeObjectURL(u); Data._urls.delete(k); } }
    await Data._del('photos', id);
  },
  /** Objekt-URL für ein Foto (zwischengespeichert). thumb=true → kleine Vorschau */
  async url(id, thumb) {
    const k = id + (thumb ? ':t' : ':f');
    if (Data._urls.has(k)) return Data._urls.get(k);
    const f = await Data.foto(id);
    if (!f) return null;
    const u = URL.createObjectURL(thumb ? f.thumb : f.full);
    Data._urls.set(k, u);
    return u;
  },

  /* ---------- Merkliste (Wunschpflanzen aus dem Lexikon) ---------- */
  wunsch() { return Data.meta.wunsch || []; },
  async wunschSetzen(artId, an) {
    const w = Data.wunsch().filter((x) => x !== artId);
    if (an) w.push(artId);
    await Data.setMeta('wunsch', w);
  },

  /* ---------- Speicherplatz ---------- */
  async schaetzung() {
    try { const s = await navigator.storage.estimate(); return { belegt: s.usage || 0, gesamt: s.quota || 0 }; } catch (e) { return null; }
  },
  async fotoAnzahl() { return Data.db ? (await Data._req('photos', 'readonly', (tx) => tx.objectStore('photos').count())) || 0 : 0; },

  /** Alles löschen (Daten im Gerät) */
  async alleLoeschen() {
    for (const s of ['plants', 'entries', 'photos', 'meta']) await Data._clear(s);
    for (const u of Data._urls.values()) URL.revokeObjectURL(u);
    Data._urls.clear();
    Data.plants.clear(); Data.entries.clear(); Data.meta = {};
    await Data.setMeta('schema', SCHEMA);
  },
};

/** Sicherung: ZIP mit data.json + photos/<id>.jpg */
const Sicherung = {
  /** opt.ohnePrivat: Cannabis-Logbuch auslassen. → Blob */
  async erstellen(opt) {
    opt = opt || {};
    const plants = [...Data.plants.values()].filter((p) => !(opt.ohnePrivat && p.kind === 'cannabis'));
    const ids = new Set(plants.map((p) => p.id));
    const entries = [...Data.entries.values()].filter((e) => ids.has(e.plantId));
    const fotoIds = new Set();
    plants.forEach((p) => p.titelFoto && fotoIds.add(p.titelFoto));
    entries.forEach((e) => (e.fotos || []).forEach((f) => fotoIds.add(f)));
    const meta = Object.assign({}, Data.meta);
    delete meta.schema;
    const dateien = [];
    const fotos = [];
    for (const id of fotoIds) {
      const f = await Data.foto(id);
      if (!f) continue;
      fotos.push({ id, ts: f.ts, w: f.w, h: f.h });
      dateien.push({ name: 'photos/' + id + '.jpg', data: f.full });
    }
    const info = { app: 'gruenzeug', schema: SCHEMA, exportiert: new Date().toISOString(), plants, entries, meta, photos: fotos };
    dateien.unshift({ name: 'data.json', data: JSON.stringify(info) });
    return Zip.make(dateien);
  },
  async lesen(file) {
    const z = await Zip.read(file);
    const j = z.get('data.json');
    if (!j) throw new Error('Das ist keine Gruenzeug-Sicherung (data.json fehlt).');
    const info = JSON.parse(new TextDecoder().decode(j));
    if (info.app !== 'gruenzeug') throw new Error('Das ist keine Gruenzeug-Sicherung.');
    if (info.schema > SCHEMA) throw new Error('Die Sicherung stammt aus einer neueren App-Version. Bitte die App aktualisieren.');
    return { info, z };
  },
  /** modus 'zusammen' (vorhandene Daten bleiben, gleiche IDs werden überschrieben) oder 'ersetzen'. → Zähler */
  async einspielen(file, modus, fortschritt) {
    const { info, z } = await Sicherung.lesen(file);
    if (modus === 'ersetzen') await Data.alleLoeschen();
    let n = 0;
    for (const f of info.photos || []) {
      const bytes = z.get('photos/' + f.id + '.jpg');
      if (!bytes) continue;
      const blob = new Blob([bytes], { type: 'image/jpeg' });
      let thumb = blob, w = f.w, h = f.h;
      try { const b = await U.bildVerkleinern(blob); thumb = b.thumb; w = b.w; h = b.h; } catch (e) { /* Vorschau = Original */ }
      await Data._put('photos', { id: f.id, full: blob, thumb, w, h, ts: f.ts || Date.now() });
      if (fortschritt) fortschritt(++n, info.photos.length);
    }
    for (const p of info.plants || []) await Data.savePlant(p);
    for (const e of info.entries || []) await Data.saveEntry(e);
    const m = info.meta || {};
    if (m.wunsch) await Data.setMeta('wunsch', [...new Set([...Data.wunsch(), ...m.wunsch])]);
    return { pflanzen: (info.plants || []).length, eintraege: (info.entries || []).length, fotos: (info.photos || []).length };
  },
  /** Datei speichern: auf dem Handy über das Teilen-Menü, sonst Download */
  async speichern(blob, name) {
    const file = new File([blob], name, { type: 'application/zip' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Gruenzeug-Sicherung' }); return 'geteilt'; }
      catch (e) { if (e && e.name === 'AbortError') return 'abgebrochen'; }
    }
    const a = U.el('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 20000);
    return 'download';
  },
};

<script>
/* GRUENZEUG – Wissen: Grundlagen der Pflanzenpflege. Abschnitte: Zeilen mit „- “ sind Aufzählungen, **fett** ist erlaubt.
   Themen mit privat: true erscheinen nur im Grow-Logbuch (hinter der PIN). */

Gruen.thema({
  id: 'grundregeln', titel: 'Die zehn Grundregeln', icon: 'blatt', kurz: 'Was fast alle Pflanzen gemeinsam brauchen – und was sie am häufigsten umbringt.',
  merksaetze: ['Zu viel Wasser tötet mehr Pflanzen als zu wenig.', 'Licht ist das Wichtigste, Dünger nur eine Zugabe.', 'Beobachten schlägt jeden Kalender.'],
  abschnitte: [
    { h: 'Die Regeln', text: '1. **Erst fühlen, dann gießen.** Finger oder Holzstäbchen in die Erde, nicht nach Kalender.\n2. **Der Topf braucht ein Abzugsloch.** Staunässe ist der häufigste Pflanzentod.\n3. **Hell ist besser als dunkel.** Fast jede Pflanze nimmt mehr Licht, als man glaubt.\n4. **Luft statt Nässe.** Wurzeln brauchen Sauerstoff: lockere Erde, nicht zu große Töpfe.\n5. **Im Winter weniger gießen und nicht düngen.** Pflanzen wachsen langsamer.\n6. **Nicht ständig umstellen.** Viele Pflanzen verlieren Blätter nach einem Umzug.\n7. **Neue Pflanzen in Quarantäne.** 2–3 Wochen allein, bevor sie zu den anderen kommen.\n8. **Blätter kontrollieren.** Einmal pro Woche die Unterseiten ansehen: Schädlinge früh erkennen.\n9. **Weniger düngen als auf der Packung steht.** Die Hälfte reicht oft.\n10. **Nicht alles auf einmal ändern.** Eine Änderung, dann abwarten und beobachten.' },
  ],
  siehe: ['giessen', 'licht', 'substrat'],
});

Gruen.thema({
  id: 'giessen', titel: 'Gießen richtig', icon: 'tropfen', kurz: 'Fingerprobe, Topfgewicht, Methoden – und warum Kalender nicht funktionieren.',
  merksaetze: ['Erst die Erde prüfen, dann gießen – nie nach Kalender.', 'Durchdringend gießen, Überschuss abgießen.', 'Im Winter deutlich seltener.'],
  abschnitte: [
    { h: 'Wann gießen?', text: 'Die einfachste Methode ist die **Fingerprobe**: Finger 3–5 cm tief in die Erde. Fühlt sie sich trocken an, ist es Zeit; ist sie noch feucht, warte.\nGut funktioniert auch das **Gewicht**: Hebe den Topf kurz nach dem Gießen an und wieder, wenn er trocken ist. Nach einigen Malen merkst du den Unterschied sofort.\nEin **Holzstäbchen** (zum Beispiel Schaschlikspieß) in der Erde zeigt Feuchte: kommt es dunkel und feucht heraus, noch nicht gießen.' },
    { h: 'Wie gießen?', text: '- **Von oben** gleichmäßig, bis Wasser unten herausläuft. Der Überschuss nach 10–15 Minuten aus Untersetzer oder Übertopf entfernen.\n- **Tauchen**: Topf in Wasser stellen, bis keine Luftblasen mehr aufsteigen. Gut für sehr trockene Ballen und Orchideen.\n- **Von unten**: Untersetzer füllen und 15 Minuten saugen lassen. Gut für Usambaraveilchen, Fleischfresser.\nAlle drei sind richtig – entscheidend ist, dass überschüssiges Wasser abfließen kann.' },
    { h: 'Wie viel?', text: 'Lieber **selten und durchdringend** als oft und wenig. Wenig Wasser reicht nur an die Oberfläche, die Wurzeln unten bleiben trocken und die Oberseite dauerfeucht.' },
    { h: 'Nach Pflanzentyp', text: '- **Sukkulenten, Kakteen, Bogenhanf, ZZ**: ganz abtrocknen lassen.\n- **Aroideen** (Monstera, Philodendron, Anthurium): obere 3–5 cm trocknen lassen.\n- **Calathea, Farne, Fittonia**: gleichmäßig leicht feucht, nie nass.\n- **Orchideen** (Phalaenopsis): tauchen, dann gut abtropfen, Wurzeln silbrig → gießen.\n- **Fleischfresser**: immer feucht, nur weiches Wasser.' },
    { h: 'Winter', text: 'Bei weniger Licht und Wärme verdunstet weniger. Die Erde braucht deutlich länger zum Trocknen – prüfe öfter, gieße seltener.' },
  ],
  siehe: ['wasserqualitaet', 'substrat', 'urlaub'],
});

Gruen.thema({
  id: 'wasserqualitaet', titel: 'Wasserqualität', icon: 'tropfen', kurz: 'Kalk, Chlor, Regenwasser: Wann Leitungswasser reicht und wann nicht.',
  merksaetze: ['Abstehen lassen entfernt Chlor, aber keinen Kalk.', 'Fleischfresser und Calathea brauchen weiches Wasser.', 'Regenwasser ist fast immer ideal.'],
  abschnitte: [
    { h: 'Leitungswasser', text: 'Für die meisten Zimmerpflanzen ist Leitungswasser in Ordnung. Wichtig ist die **Härte**: Hartes, kalkreiches Wasser lagert Kalk in der Erde ab und treibt den pH-Wert nach oben. Dann werden Nährstoffe schlechter aufgenommen und Blattspitzen braun.\nAbstehen lassen bringt Raumtemperatur und lässt Chlor entweichen, ändert aber nichts am Kalk.' },
    { h: 'Weiches Wasser', text: '- **Regenwasser**: ideal, kalkfrei, solange es nicht von belasteten Dächern kommt.\n- **Osmosewasser**: sehr rein, für Fleischfresser. Für andere Pflanzen mit etwas Leitungswasser mischen oder mit Dünger ergänzen.\n- **Destilliertes Wasser**: nur für empfindliche Spezialisten.\n- **Wasserfilter** (Tischfilter): mildert Kalk etwas.' },
    { h: 'Empfindliche Pflanzen', text: 'Fleischfresser, Calathea, Maranta, Orchideen und Farne reagieren auf Kalk und Salze mit braunen Spitzen. Dort lohnt Regen- oder Osmosewasser.' },
    { h: 'Temperatur', text: 'Lauwarmes Wasser (Raumtemperatur) ist am besten. Eiskaltes Wasser verursacht Wurzelschock.' },
  ],
  siehe: ['giessen'],
});

Gruen.thema({
  id: 'substrat', titel: 'Substrat und Erde', icon: 'topf', kurz: 'Aus welchen Zutaten Pflanzerde besteht und welche Mischung zu welcher Pflanze passt.',
  merksaetze: ['Gute Erde hält Wasser und lässt trotzdem Luft an die Wurzeln.', 'Mischen schlägt Fertigerde.', 'Je dicker die Blätter, desto mineralischer das Substrat.'],
  abschnitte: [
    { h: 'Die Zutaten', text: '- **Blumenerde**: Grundlage, speichert Wasser, enthält Nährstoffe.\n- **Kokosfaser / Kokoserde**: speichert Wasser, locker, torffrei.\n- **Perlite**: weiße, leichte Körner, sorgen für Luft.\n- **Bims / Lavagrus / Zeolith**: schwere mineralische Körner, belüften und stabilisieren.\n- **Pinienrinde / Orchideenrinde**: grobe Stücke, ideal für Aufsitzer wie Orchideen und Aroideen.\n- **Aktivkohle**: hilft gegen Gerüche, mildert Fäulnis.\n- **Sphagnum-Moos**: speichert viel Wasser und bleibt luftig. Siehe eigenes Thema.\n- **Leca / Blähton**: Tonkügelchen für Semi-Hydro.' },
    { h: 'Mischungen zum Ausprobieren', text: '- **Allrounder (Monstera, Philodendron)**: 40 % Blumenerde, 30 % Rinde, 20 % Perlite oder Bims, 10 % Kokos.\n- **Sukkulenten & Kakteen**: 30 % Erde, 70 % mineralisch (Bims, Perlite, Sand).\n- **Orchideen**: grobe Pinienrinde, etwas Perlite und Holzkohle, evtl. Sphagnum.\n- **Calathea, Farne**: humose Erde mit Kokos und etwas Perlite, feuchter gehalten.\n- **Fleischfresser**: nährstoffarmer Torf und Perlite, kein Dünger – nur mit weichem Wasser.' },
    { h: 'Mehr Luft, weniger Fäulnis', text: 'Je mehr Wurzeln Luft bekommen, desto weniger Fäulnis droht. Zu feine, torfige Erde verdichtet sich mit der Zeit. Grobe Anteile (Rinde, Bims) halten das Substrat offen.' },
    { h: 'Austauschen', text: 'Erde verbraucht sich: Nach 1–2 Jahren hat sie weniger Struktur und weniger Nährstoffe. Spätestens dann umtopfen oder die oberste Schicht erneuern.' },
  ],
  siehe: ['sphagnum', 'umtopfen', 'semi-hydro'],
});

Gruen.thema({
  id: 'sphagnum', titel: 'Sphagnum-Moos und Moos', icon: 'blatt', kurz: 'Wasserspeicher, Bewurzelungshilfe und Substrat: wofür man Moos braucht.',
  merksaetze: ['Sphagnum speichert ein Vielfaches seines Gewichts an Wasser und bleibt trotzdem luftig.', 'Immer nur feucht, nie nass einsetzen.', 'Moos ist nicht gleich Moos: Sphagnum ≠ Torf ≠ Dekomoos.'],
  abschnitte: [
    { h: 'Was ist Sphagnum?', text: 'Sphagnum ist ein Torfmoos. Seine Zellen speichern das bis zu **20-Fache** des Trockengewichts an Wasser und lassen trotzdem Luft durch. Außerdem ist es leicht sauer und hemmt Bakterien und Pilze. Deshalb ist es unter Sammlern so beliebt.\nIm Handel gibt es **getrocknetes Sphagnum** (kurzfasrig oder langfasrig). Vor dem Verwenden einweichen und gut ausdrücken: es soll **feucht wie ein ausgedrückter Schwamm** sein.' },
    { h: 'Wofür man es nutzt', text: '- **Stecklinge bewurzeln**: Knoten in feuchtes Moos in einen durchsichtigen Behälter legen. Das Moos hält Feuchte und Luft – oft schneller und mit kräftigeren Wurzeln als in Wasser.\n- **Luftabsenker (Air Layering)**: Stängel mit Moos einwickeln, mit Folie umhüllen, Wurzeln bilden sich an der Pflanze.\n- **Moosstab**: Ein Stab aus Moos für Kletterpflanzen. Die Luftwurzeln wachsen hinein und die Blätter werden größer.\n- **Substratbeimischung**: 10–30 % Sphagnum in Aroid- oder Orchideensubstrat hält die Feuchte besser.\n- **Orchideen**: oben in die Rinde gelegt oder als Hauptsubstrat für Orchideen, die nicht austrocknen sollen.\n- **Fleischfresser**: reines Sphagnum als Substrat für viele Arten.' },
    { h: 'Moos und Moos', text: '- **Sphagnum**: für Wurzelbildung und Substrat.\n- **Torf**: Substrat aus abgestorbenem Moor, nährstoffarm und sauer; aus Umweltgründen oft ersetzt.\n- **Dekomoos / Kugelmoos**: zum Abdecken und Gestalten, nicht zum Wurzeln.\n- **Lebendes Moos (Terrarium)**: Kissenmoos, Sternmoos – braucht Licht und hohe Luftfeuchte.' },
    { h: 'Fehler vermeiden', text: '- Zu nass einsetzen: Moos wird fest und fault.\n- Zu trocken lassen: Moos wird hart und nimmt kein Wasser mehr auf.\n- Kaufe getrocknetes Moos aus nachhaltiger Quelle; Wildentnahme schadet den Mooren.' },
  ],
  siehe: ['vermehrung', 'substrat'],
});

Gruen.thema({
  id: 'licht', titel: 'Licht', icon: 'sonne', kurz: 'Fensterrichtung, Entfernung, Pflanzenlampen und Sonnenbrand.',
  merksaetze: ['Licht ist der wichtigste Wachstumsfaktor.', 'Schon einen Meter vom Fenster ist es deutlich dunkler.', 'Im Winter sinkt das Licht stark.'],
  abschnitte: [
    { h: 'Wie viel Licht?', text: 'Richtwerte (Lux, sehr grob):\n- **Wenig Licht**: 500–2.500 lx – Bogenhanf, ZZ, Efeutute überleben, wachsen aber kaum.\n- **Mittel**: 2.500–10.000 lx – die meisten Zimmerpflanzen.\n- **Viel**: 10.000–25.000+ lx – Sukkulenten, Kakteen, Hoyas, bunte Pflanzen.\nHelles Tageslicht draußen hat oft über 50.000 lx. Fensterscheibe, Gardinen und Entfernung reduzieren das stark.' },
    { h: 'Fensterrichtung (Nordhalbkugel)', text: '- **Süd**: hellster Platz, im Sommer teils zu heiß – ideal für Sukkulenten.\n- **Ost**: milde Morgensonne – gut für viele Pflanzen.\n- **West**: Nachmittagssonne, warm und hell.\n- **Nord**: wenig Licht – nur für Schattenpflanzen.' },
    { h: 'Entfernung zum Fenster', text: 'Mit jedem Meter Abstand nimmt das Licht stark ab. Ein Platz zwei Meter neben dem Fenster ist oft viel dunkler als er wirkt. Pflanzen zeigen es: lange Abstände zwischen den Blättern, kleine Blätter, blasse Farbe.' },
    { h: 'Pflanzenlampen', text: 'Vollspektrum-LED-Lampen sind effizient und kühl. Für Zimmerpflanzen reichen 10–30 W pro Pflanzengruppe in 20–40 cm Abstand, 10–14 Stunden am Tag. Eine Zeitschaltuhr hilft.\nLichtmess-Apps im Handy sind ungenau, aber ein grober Anhaltspunkt.' },
    { h: 'Sonnenbrand', text: 'Pflanzen, die plötzlich in volle Sonne kommen, verbrennen: helle bis braune, trockene Flecken. Langsam gewöhnen, besonders nach dem Winter oder bei neu gekauften Pflanzen. Panaschierte Pflanzen verbrennen leichter.' },
  ],
  siehe: ['winter', 'variegation'],
});

Gruen.thema({
  id: 'luftfeuchte', titel: 'Luftfeuchte', icon: 'thermo', kurz: 'Wann sie wichtig ist, wie man sie misst und was wirklich hilft.',
  merksaetze: ['Ein Hygrometer kostet wenige Euro und ersetzt Raten.', 'Sprühen bringt kaum etwas – Luftbefeuchter und Gruppierung schon.', 'Viele Pflanzen kommen mit 40–50 % klar.'],
  abschnitte: [
    { h: 'Messen', text: 'Ein kleines Hygrometer zeigt die Luftfeuchte. Im Winter liegt sie in beheizten Räumen oft bei 30–40 %. Für die meisten robusten Pflanzen ist das ok, für Calathea, Alocasia, Farne und Orchideen ist es zu trocken.' },
    { h: 'Was hilft', text: '- **Pflanzen gruppieren**: sie verdunsten Wasser und befeuchten sich gegenseitig.\n- **Luftbefeuchter**: die verlässlichste Lösung.\n- **Vitrine oder Terrarium**: schafft ein eigenes Klima.\n- **Wasserschalen oder Kieselsteinschale**: bringt wenig, aber etwas.\n- **Bad oder Küche**: von Natur aus feuchter.' },
    { h: 'Sprühen?', text: 'Sprühen erhöht die Feuchte nur für Minuten. Auf manchen Pflanzen verursacht es Flecken oder Pilze. Besser: abwischen und gießen.' },
    { h: 'Vorsicht', text: 'Zu hohe Feuchte ohne Luftbewegung begünstigt Schimmel und Mehltau. Ein kleiner Ventilator oder Lüften hilft.' },
  ],
  siehe: ['winter'],
});

Gruen.thema({
  id: 'duengen', titel: 'Düngen', icon: 'flasche', kurz: 'Wann, womit und wie viel: lieber weniger als zu viel.',
  merksaetze: ['Gedüngt wird nur in der Wachstumszeit (Frühling–Sommer).', 'Lieber halbe Dosis, dafür regelmäßig.', 'Nicht düngen bei kranken, frisch umgetopften oder ruhenden Pflanzen.'],
  abschnitte: [
    { h: 'Was ist drin?', text: 'Dünger enthält Stickstoff (N) für Blattwachstum, Phosphor (P) für Wurzeln und Blüten, Kalium (K) für Festigkeit. Ein ausgewogener Flüssigdünger (zum Beispiel 7-5-7) passt für fast alle Zimmerpflanzen.' },
    { h: 'Wann und wie viel?', text: '- Von **April bis September** alle 2–4 Wochen düngen.\n- Im **Herbst und Winter** nicht oder höchstens ein Viertel der Dosis.\n- **Halbe Dosis** der Packungsangabe reicht meistens.\n- Nur auf **leicht feuchte** Erde geben, nie auf trockene.' },
    { h: 'Zu viel Dünger', text: 'Salze sammeln sich in der Erde: weißer Rand am Topf, braune Blattspitzen, Wachstumsstopp. Abhilfe: Erde mehrfach mit klarem Wasser durchspülen oder umtopfen.' },
    { h: 'Zeichen von Mangel', text: '- **Ältere Blätter vergilben gleichmäßig**: Stickstoffmangel.\n- **Neue Blätter hell mit grünen Adern**: Eisen- oder Magnesiummangel, oft durch zu hohen pH.\n- **Alles klein und blass**: häufiger Lichtmangel, nicht Düngermangel.' },
    { h: 'Dünger-Arten', text: '- **Flüssigdünger** ins Gießwasser: einfach, gut dosierbar.\n- **Düngestäbchen / Langzeitdünger**: zuverlässig, aber schlecht anpassbar.\n- **Organisch** (Wurmhumus, Guano): schonend, wirkt langsam.' },
  ],
  siehe: ['umtopfen', 'winter'],
});

Gruen.thema({
  id: 'umtopfen', titel: 'Umtopfen', icon: 'topf', kurz: 'Wann es sich lohnt, welche Topfgröße und warum Drainage-Schichten nichts bringen.',
  merksaetze: ['Nur ein bis zwei Nummern größer: 2–4 cm Durchmesser mehr.', 'Beste Zeit: Frühjahr.', 'Eine Schicht Blähton unten hilft nicht – sie verschlechtert eher den Wasserabzug.'],
  abschnitte: [
    { h: 'Wann?', text: '- Wurzeln wachsen aus dem Abzugsloch oder drücken den Ballen hoch.\n- Wasser läuft sofort durch, ohne einzuziehen.\n- Die Erde ist verdichtet, riecht muffig oder verbraucht.\n- Die Pflanze ist deutlich zu groß für den Topf.\nIm Normalfall alle 1–2 Jahre, bei schnellen Pflanzen (Monstera) jährlich, bei langsamen (Sansevieria, ZZ) seltener.' },
    { h: 'Wie?', text: '1. Pflanze am Stamm halten und aus dem Topf lösen, den Ballen vorsichtig lockern.\n2. Faule oder tote Wurzeln wegschneiden, lange Wurzeln leicht kürzen.\n3. Neuen Topf nur **2–4 cm größer** wählen (zu große Töpfe bleiben nass).\n4. Frisches Substrat einfüllen, Pflanze auf gleicher Höhe wie zuvor setzen.\n5. Leicht angießen, bei Bedarf nach einigen Tagen noch einmal.' },
    { h: 'Drainage-Schicht?', text: 'Eine Schicht Blähton oder Steine im Topfboden verbessert den Wasserabzug **nicht**. Im Gegenteil: Wasser staut sich direkt oberhalb der Schicht und die Wurzeln stehen höher im Nassen. Besser: ein Abzugsloch und durchgehend durchlässiges Substrat.' },
    { h: 'Topf-Material', text: '- **Plastik**: speichert Wasser, leicht, gut für durstige Pflanzen.\n- **Ton / Terrakotta**: atmet, trocknet schneller, schwer – gut für Sukkulenten.\n- **Keramik**: schön, aber oft ohne Loch; dann als Übertopf verwenden.' },
    { h: 'Nach dem Umtopfen', text: 'Pflanze einige Tage ruhen lassen: kein Dünger für 4–6 Wochen und nicht sofort in starke Sonne.' },
  ],
  siehe: ['substrat', 'duengen'],
});

Gruen.thema({
  id: 'vermehrung', titel: 'Vermehrung', icon: 'schere', kurz: 'Stecklinge, Ableger, Teilung und Moos: so wird aus einer Pflanze eine Sammlung.',
  merksaetze: ['Bei den meisten Aroideen braucht der Steckling einen Knoten (Nodus).', 'Moos bewurzelt oft besser als Wasser.', 'Geduld: Wurzeln dauern Wochen.'],
  abschnitte: [
    { h: 'Kopfstecklinge', text: 'Trieb mit Knoten und mindestens einem Blatt unter dem Knoten schneiden. Bei Monstera, Philodendron und Efeutute sitzt der Knoten am Stängel – daraus entstehen die Wurzeln.\nIn Wasser, feuchtes Moos oder Perlite stellen, hell, warm (22–26 °C), ohne direkte Sonne. Wurzeln erscheinen meist nach 1–4 Wochen.' },
    { h: 'Wasser, Erde oder Moos?', text: '- **Wasser**: einfach, man sieht Wurzeln, aber die Wasserwurzeln müssen sich später an Erde gewöhnen.\n- **Feuchtes Moos / Perlite**: Wurzeln sind erdetauglich, weniger Umstellung.\n- **Erde**: direkt, aber man sieht nichts und muss gleichmäßig feucht halten.' },
    { h: 'Ableger und Teilung', text: '- **Kindel / Ableger** (Grünlilie, Pilea, Aloe): mit Wurzeln abtrennen und eintopfen.\n- **Teilung**: beim Umtopfen den Wurzelballen teilen (Spathiphyllum, Calathea, Bogenhanf).\n- **Rhizom-Pflanzen**: Rhizom mit Auge und Wurzel zerschneiden.' },
    { h: 'Blattstecklinge', text: 'Funktionieren bei Sukkulenten (Geldbaum), Usambaraveilchen, Begonien und Peperomien: Blatt abnehmen, antrocknen lassen, auf Erde legen oder Stiel stecken.' },
    { h: 'Luftabsenker', text: 'Bei Pflanzen, die nicht leicht bewurzeln (Ficus, große Philodendren): Stängel anritzen, mit feuchtem Sphagnum umwickeln und mit Folie umhüllen. Wenn Wurzeln durchscheinen, unterhalb abschneiden und eintopfen.' },
    { h: 'Samen', text: 'Aus Samen vermehrt man Kakteen, Lithops, Fleischfresser und viele Palmen. Es braucht Geduld und eine feuchte, warme Umgebung. Kaufe Samen nur aus seriösen Quellen.' },
  ],
  siehe: ['sphagnum', 'variegation'],
});

Gruen.thema({

  merksaetze: ['Weniger gießen, nicht düngen.', 'Heller stellen, Fensterscheiben reinigen.', 'Kältezug am Fenster meiden.'],

    { h: 'Was tun?', text: '- **Heller stellen**: so nah ans Fenster, wie es ohne Kälte geht.\n- **Pflanzenlampe**: für Pflanzen mit hohem Lichtbedarf.\n- **Fenster putzen**: spart Licht.\n- **Gießen reduzieren**: nach Fingerprobe, nicht nach Kalender.\n- **Dünger pausieren**.\n- **Luftfeuchte beobachten** und bei Bedarf erhöhen.\n- **Zugluft meiden**: beim Lüften Pflanzen vom Fenster wegstellen.' },

    { h: 'Kälteempfindliche Pflanzen', text: 'Pflanzen, die an kalten Fensterscheiben oder im Durchzug stehen, werfen Blätter ab. Abstand zur Scheibe halten und nicht über Heizkörper stellen.' },
  ],
  siehe: ['licht', 'luftfeuchte'],
});

Gruen.thema({

  merksaetze: ['Neue Pflanzen 2–3 Wochen getrennt halten.', 'Gründlich kontrollieren: Blattunterseiten, Erde, Stängel.', 'Im Zweifel behandeln, bevor sie zu den anderen kommt.'],

    { h: 'So gehst du vor', text: '1. Pflanze in einem eigenen Raum oder zumindest weit weg von anderen aufstellen.\n2. Blätter (auch Unterseiten), Stängel und Erde mit Lupe und Handylicht kontrollieren.\n3. Bei wertvollen Pflanzen austopfen und Wurzeln prüfen (Wurzelläuse, Fäule).\n4. Vorbeugend mit milder Seifenlösung abwaschen oder Gelbtafeln aufstellen.\n5. 2–3 Wochen beobachten, bevor sie zur Sammlung kommt.' },
    { h: 'Tauschbörsen und Stecklinge', text: 'Stecklinge aus fremden Sammlungen genauso behandeln: Blätter gründlich kontrollieren, Stecklinge einzeln bewurzeln und separat halten.' },

Gruen.thema({

Gruen.thema({
  id: 'variegation', titel: 'Variegation und Besonderheiten', icon: 'stern', kurz: 'Panaschierte Pflanzen sind begehrt, aber heikel: Was dahintersteckt.',
  merksaetze: ['Weiße Anteile haben kein Chlorophyll – die Pflanze braucht mehr Licht.', 'Instabile Panaschierung kann zurückschlagen.', 'Rein weiße oder rosa Blätter überleben oft nicht.'],
  abschnitte: [
    { h: 'Was ist Variegation?', text: 'Variegation (Panaschierung) bedeutet, dass Teile der Blätter weniger oder gar kein Chlorophyll haben und deshalb weiß, gelb, cremefarben oder rosa wirken. Das kann genetisch bedingt (stabil) oder zufällig (instabil) sein.' },
    { h: 'Typen', text: '- **Marmoriert / gesprenkelt**: Muster aus Flecken und Streifen, zum Beispiel Thai Constellation.\n- **Sektorial**: ganze Blatthälften oder -teile sind weiß – bei Monstera Albo üblich.\n- **Randpanaschierung**: heller Blattrand.\n- **Gewebekultur**: im Labor stabil vermehrt, so verbreitet sich heute etwa die Thai Constellation.' },
    { h: 'Pflege', text: 'Panaschierte Pflanzen brauchen mehr Licht, weil sie weniger Chlorophyll haben. Aber **keine pralle Sonne**: weiße Stellen verbrennen leicht. Gleichmäßig gießen und mäßig düngen.' },
    { h: 'Rückschlag und Rückschnitt', text: 'Instabile Panaschierung kann plötzlich wieder grün werden oder zu viel Weiß bilden. Dann hilft **Rückschnitt**: Trieb bis zu einem Knoten mit gutem Muster kürzen. Neue Blätter wachsen häufig wieder bunt.' },
    { h: 'Besonderheiten sammeln', text: 'Besonders begehrt: große, gleichmäßig panaschierte Blätter (Albo, Pink Princess, Variegata). Dokumentiere in deinem Logbuch Fotos und Austriebe – so siehst du, wie sich die Zeichnung entwickelt.' },
  ],
  siehe: ['raritaeten', 'licht'],
});

Gruen.thema({

  merksaetze: ['Eine Umstellung braucht saubere Wurzeln und Geduld.', 'Wasser im Reservoir nur bis ca. ein Drittel der Topfhöhe.', 'Mit speziellem Hydro-Dünger arbeiten.'],

  merksaetze: ['Photoperiodische Sorten blühen erst bei langen Nächten (12/12).', 'Autoflowers blühen nach Alter, unabhängig vom Licht.', 'Alle Zeitangaben sind Richtwerte und hängen von Sorte und Bedingungen ab.'],

Gruen.thema({

Gruen.thema({

  merksaetze: ['Training bedeutet Stress: danach Erholung geben.', 'Autoflowers nur sanft trainieren (LST).', 'Nie mehrere starke Eingriffe gleichzeitig.'],
  abschnitte: [
    { h: 'Methoden', text: '- **LST (Low Stress Training)**: Triebe sanft herunterbinden, damit mehr Spitzen Licht bekommen.\n- **Topping**: Haupttrieb oberhalb eines Knotens kappen, es entstehen zwei Haupttriebe.\n- **FIMing**: Spitze nur teilweise abschneiden, mehr Triebe möglich.\n- **Supercropping**: Stängel knicken (ohne zu brechen), um Wuchs zu bremsen.\n- **Entlaubung**: störende Blätter entfernen, damit Licht und Luft ans Innere kommen. Nur sparsam.\n- **Lollipopping**: untere, kaum belichtete Triebe entfernen.' },
    { h: 'Zeitpunkt', text: 'Training macht man in der vegetativen Phase, wenn die Pflanze 4–6 Knoten hat. Nach dem Eingriff 3–7 Tage erholen lassen. In der Blüte nur noch behutsam eingreifen.' },
  ],

});

Gruen.thema({

    { h: 'Vorgehen', text: '1. pH von Wasser und Substrat prüfen.\n2. Bei Überdüngung: mit klarem Wasser durchspülen.\n3. Dosis anpassen, nach einigen Tagen die neuen Blätter beurteilen (alte Schäden verschwinden nicht).' },

Gruen.thema({
  id: 'grow-ernte', privat: true, titel: 'Ernte, Trocknen, Curing', icon: 'schere', kurz: 'Den richtigen Zeitpunkt erkennen, schonend trocknen und lagern.',
  merksaetze: ['Zu früh geerntet ist besser als zu spät, wenn Schimmel droht – aber Reife nicht erzwingen.', 'Trocknen langsam und dunkel.', 'Curing in Gläsern, regelmäßig lüften.'],
  abschnitte: [
    { h: 'Erntezeitpunkt', text: 'Mit einer Juwelierlupe (30–60×) die Trichome ansehen: klar = noch nicht reif, milchig-trüb = reif, bernsteinfarben = später, eher entspannende Wirkung. Die Mehrheit trüb mit etwas Bernstein ist ein häufiger Zeitpunkt.' },
    { h: 'Trocknen', text: '- Pflanzen oder Äste kopfüber im **dunklen, belüfteten** Raum aufhängen.\n- Ziel: etwa **15–20 °C** und **55–62 % Luftfeuchte** (die „60/60-Regel“).\n- Dauer: **7–14 Tage**. Fertig, wenn dünne Stängel knacken statt biegen.\n- Kein direkter Luftzug auf die Blüten.' },

});

Gruen.thema({

  merksaetze: ['In der Blüte nichts mehr spritzen, was auf die Blüten kommt.', 'Vorbeugen: Hygiene und gute Luft.', 'Neue Pflanzen und Stecklinge zunächst isolieren.'],
  abschnitte: [
    { h: 'Häufige Schädlinge', text: '- **Trauermücken**: Larven fressen Wurzeln. Gelbtafeln, Erde abtrocknen lassen, Nematoden, Bti.\n- **Spinnmilben**: feine Punkte und Gespinst. Raubmilben vorbeugend, Luftfeuchte beachten.\n- **Thripse**: silbrige Streifen, Blautafeln, Raubmilben.\n- **Blattläuse**: Neuaustrieb. Marienkäfer, Seifenlösung.\nEs gelten dieselben Maßnahmen wie bei Zimmerpflanzen, siehe Bereich Schädlinge.' },
    { h: 'Schimmel in der Blüte', text: 'Hohe Luftfeuchte und dichte Blüten führen zu Botrytis und Mehltau. Vorbeugen mit Luftzirkulation, Entlaubung und Luftfeuchte unter 50 %.' },
    { h: 'Stress-Zeichen', text: '- **Hitzestress**: Blätter krümmen sich nach oben (Kanu-Form).\n- **Lichtstress**: gebleichte Spitzen nahe der Lampe.\n- **Wasserstress**: hängende Blätter, bei Nässe oft Wurzelprobleme.\n- **Hermaphroditen**: Pollensäcke an Pflanzen unter Stress – entfernen, wenn Bestäubung unerwünscht.' },
    { h: 'Hygiene', text: 'Werkzeuge reinigen, Zeltboden sauber halten, welke Blätter entfernen, Hände waschen, keine Straßenkleidung im Zelt bei Befallsgefahr.' },

});

const ICON_LEXIKON_KAT = { 'Aronstabgewächse': 'blatt', 'Sukkulenten & Kakteen': 'sonne', 'Farne': 'blatt', 'Palmen': 'blatt', 'Orchideen': 'stern', 'Fleischfresser': 'kaefer', 'Blühpflanzen': 'stern', 'Feigen & Bäume': 'blatt', 'Hängepflanzen': 'blatt', 'Buntblatt': 'blatt' };

const App = {
  seiten: [],            // Stapel: { bau: Funktion, el, tab }
  tabs: [
    { id: 'heute', label: 'Heute', icon: 'heute' },
    { id: 'sammlung', label: 'Sammlung', icon: 'sammlung' },
    { id: 'lexikon', label: 'Lexikon', icon: 'lexikon' },
    { id: 'wissen', label: 'Wissen', icon: 'wissen' },
    { id: 'mehr', label: 'Mehr', icon: 'mehr' },
  ],
  tabBauer: {},          // id → Seitenfunktion (von den Bildschirm-Dateien eingetragen)
  aktTab: 'heute',
  _bereit: false,

  icon(name, groesse) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', '1.8'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');

  },

  /* ---------- Start & Tabs ---------- */
  init() {
    const root = document.getElementById('app');
    App.stackEl = U.el('div', { class: 'stack' });
    App.tabbarEl = U.el('nav', { class: 'tabbar', 'aria-label': 'Hauptmenü' });
    for (const t of App.tabs) {
      const b = U.el('button', { 'data-tab': t.id, onclick: () => App.tab(t.id) }, App.icon(t.icon), t.label);
      App.tabbarEl.append(b);
    }
    root.append(App.stackEl, App.tabbarEl);
    window.addEventListener('popstate', () => { if (App.seiten.length > 1) App._abbauen(); });
    App._bereit = true;
    App.tab(Einst.get('tab', 'heute'));
  },
  tab(id) {
    if (!App.tabBauer[id]) id = 'heute';
    App.aktTab = id;
    Einst.set('tab', id);
    for (const b of App.tabbarEl.children) b.classList.toggle('on', b.dataset.tab === id);

  },
  _neueSeite(bau, animiert) {
    const s = { bau, el: U.el('div', { class: 'page' + (animiert ? ' rein' : '') }) };
    App.seiten.push(s);
    App.stackEl.append(s.el);
    App._zeichnen(s);
    App.seiten.forEach((x) => { x.el.style.display = x === s ? '' : 'none'; });
    App._tabbarSichtbar();
  },
  _tabbarSichtbar() { App.tabbarEl.style.display = ''; },
  oeffne(bau) {
    history.pushState({ gz: App.seiten.length }, '');
    App._neueSeite(bau, true);
  },
  /** Oberste Seite durch eine andere ersetzen (z. B. nach dem Anlegen) */
  ersetze(bau) {
    const alt = App.seiten.pop();
    if (alt) alt.el.remove();
    App._neueSeite(bau, false);
  },
  zurueck() {
    if (App.seiten.length > 1) { if (history.state && history.state.gz != null) history.back(); else App._abbauen(); }
  },
  _abbauen() {
    const s = App.seiten.pop();
    if (s) s.el.remove();
    const t = App.seiten[App.seiten.length - 1];
    if (t) { t.el.style.display = ''; App._zeichnen(t, true); }
    App._tabbarSichtbar();
  },
  /** Alle Seiten im Stapel neu zeichnen (nach Datenänderung). Nur die oberste ist sichtbar. */
  neu() {
    const s = App.seiten[App.seiten.length - 1];
    if (s) App._zeichnen(s, true);
  },
  _zeichnen(s, scrollBehalten) {
    const alt = s.el.querySelector('.body');
    const y = scrollBehalten && alt ? alt.scrollTop : 0;
    let d;
    try { d = s.bau(s); } catch (e) { console.error(e); d = { titel: 'Fehler', inhalt: U.el('div', { class: 'box rot' }, U.el('b', { text: 'Diese Seite konnte nicht gebaut werden.' }), String(e && e.message || e)) }; }
    const stapel = App.seiten.indexOf(s);
    s.privat = !!d.privat;
    s.el.className = 'page' + (s.el.classList.contains('rein') ? ' rein' : '') + (d.ohneTab ? ' ohne-tab' : '');
    const kopf = U.el('header', { class: 'bar' + (d.kleinTitel ? ' klein-titel' : '') });
    if (stapel > 0 || d.zurueck) kopf.append(U.el('button', { class: 'ib', 'aria-label': 'Zurück', onclick: () => (d.zurueckFn ? d.zurueckFn() : App.zurueck()) }, App.icon('zurueck')));
    const tt = U.el('div', { class: 'titel' }, d.sub ? U.el('div', { class: 'sub', text: d.sub }) : null, U.el('h1', { text: d.titel || '' }));
    if (d.titelKlick) { tt.style.cursor = 'default'; tt.addEventListener('click', d.titelKlick); }
    kopf.append(tt);
    if (d.aktionen && d.aktionen.length) {
      const a = U.el('div', { class: 'aktionen' });
      for (const x of d.aktionen) a.append(U.el('button', { class: 'ib', 'aria-label': x.label, onclick: x.fn }, App.icon(x.icon)));
      kopf.append(a);
    }
    const body = U.el('main', { class: 'body' }, d.inhalt);
    s.el.replaceChildren(kopf, body);
    if (d.fab) s.el.append(U.el('button', { class: 'fab', 'aria-label': d.fab.label, onclick: d.fab.fn }, App.icon(d.fab.icon || 'plus')));
    if (y) body.scrollTop = y;
    if (d.nachher) d.nachher(body);
  },

  /* ---------- Sheet (Formulare, Auswahl) ---------- */
  /** opt: {titel, inhalt: Node, speichern: 'Text'|null, onSpeichern: async()=>false|undefined, extra: [Buttons], onZu} → {zu} */
  sheet(opt) {
    const bg = U.el('div', { class: 'sheet-bg' });
    let zu = false;
    const schliessen = () => { if (zu) return; zu = true; bg.remove(); if (opt.onZu) opt.onZu(); };
    const kopf = U.el('div', { class: 'kopf-s' }, U.el('h2', { text: opt.titel || '' }), U.el('button', { class: 'ib', 'aria-label': 'Schließen', onclick: schliessen }, App.icon('x')));
    const inhalt = U.el('div', { class: 'inhalt' }, opt.inhalt);
    const panel = U.el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' }, U.el('div', { class: 'griff-oben' }), kopf, inhalt);
    if (opt.speichern || opt.extra) {
      const fuss = U.el('div', { class: 'fuss' });
      (opt.extra || []).forEach((b) => fuss.append(b));
      if (opt.speichern) {
        const sp = U.el('button', { class: 'btn', text: opt.speichern });
        sp.onclick = async () => {
          sp.disabled = true;
          try { const r = await opt.onSpeichern(); if (r !== false) schliessen(); } catch (e) { console.error(e); App.toast('Fehler: ' + (e && e.message || e)); }
          sp.disabled = false;
        };
        fuss.append(sp);
      }
      panel.append(fuss);
    }
    bg.append(panel);
    bg.addEventListener('click', (e) => { if (e.target === bg) schliessen(); });
    document.body.append(bg);
    return { zu: schliessen, el: panel };
  },
  bestaetigen(titel, text, opt) {
    opt = opt || {};
    return new Promise((res) => {
      let s;
      const ende = (v) => { s.zu(); res(v); };
      const inh = U.el('div', null, U.el('p', { text }));
      const ab = U.el('button', { class: 'btn ghost', text: opt.abbrechen || 'Abbrechen', onclick: () => ende(false) });
      const ok = U.el('button', { class: 'btn ' + (opt.gefahr ? 'gefahr' : ''), text: opt.ok || 'OK', onclick: () => ende(true) });
      s = App.sheet({ titel, inhalt: inh, extra: [ab, ok], onZu: () => res(false) });
    });
  },
  toast(text, ms) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const t = U.el('div', { class: 'toast', role: 'status', text });
    document.body.append(t);
    setTimeout(() => t.remove(), ms || 2400);
  },

  /* ---------- Bilder ---------- */
  /** <img> für ein gespeichertes Foto; src wird nachgeladen */
  bild(id, thumb, klasse) {
    const img = U.el('img', { class: 'bild ' + (klasse || ''), alt: '', loading: 'lazy', decoding: 'async' });
    Data.url(id, thumb).then((u) => { if (u) img.src = u; else img.remove(); }).catch(() => {});
    return img;
  },
  /** Farbiger Platzhalter ohne Foto: Farbton aus dem Namen */
  platzhalter(name, klasse) {
    const h = U.hash(name || '') % 5;
    const farben = [['#dfe8d6', '#4d7a58'], ['#eadfce', '#a56a3d'], ['#d8e4e0', '#3f7a6d'], ['#e8dcd8', '#a65a48'], ['#e4e3cf', '#7c7a35']];
    const d = U.el('div', { class: 'ph ' + (klasse || '') });
    d.style.background = farben[h][0]; d.style.color = farben[h][1];
    d.append(App.icon('sammlung'));
    return d;
  },
  /** Foto oder Platzhalter */
  titelbild(plant, thumb, klasse) {
    return plant.titelFoto ? App.bild(plant.titelFoto, thumb, klasse) : App.platzhalter(plant.name, klasse);
  },
  /** Vollbild mit Wischen. fotos: Liste von Foto-IDs; extra: {text(i), aktion:{label, fn(id)}} */
  lupe(fotos, start, extra) {
    extra = extra || {};
    const spur = U.el('div', { class: 'spur' });
    const zaehler = U.el('span', { text: '' });
    const unten = U.el('div', { class: 'unten' });
    const zu = () => { ov.remove(); document.removeEventListener('keydown', taste); };
    const ov = U.el('div', { class: 'lupe' }, spur,
      U.el('div', { class: 'oben' }, U.el('button', { class: 'ib', 'aria-label': 'Schließen', onclick: zu }, App.icon('x')), zaehler),
      unten);
    const taste = (e) => { if (e.key === 'Escape') zu(); };
    document.addEventListener('keydown', taste);
    fotos.forEach((id) => {
      const f = U.el('div', { class: 'folie' });
      Data.url(id, false).then((u) => { if (u) f.append(U.el('img', { src: u, alt: '' })); });
      spur.append(f);
    });
    const aktuell = () => Math.max(0, Math.min(fotos.length - 1, Math.round(spur.scrollLeft / Math.max(1, spur.clientWidth))));
    const upd = () => {
      const i = aktuell();
      zaehler.textContent = fotos.length > 1 ? (i + 1) + ' / ' + fotos.length : '';
      unten.replaceChildren(U.el('span', { text: extra.text ? extra.text(i, fotos[i]) : '' }));
      if (extra.aktion) unten.append(U.el('button', { class: 'btn klein sekundaer', text: extra.aktion.label, onclick: async () => { await extra.aktion.fn(fotos[aktuell()]); zu(); } }));
    };
    spur.addEventListener('scroll', () => { clearTimeout(spur._t); spur._t = setTimeout(upd, 60); });
    document.body.append(ov);
    spur.scrollLeft = (start || 0) * spur.clientWidth;
    upd();
  },
  /** Einfaches Liniendiagramm. punkte: [{x: iso-Datum, y: Zahl}] */
  diagramm(punkte, einheit) {
    const W = 320, H = 150, L = 34, R = 10, T = 12, B = 22;
    const xs = punkte.map((p) => U.num(p.x)), ys = punkte.map((p) => p.y);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const ya = y0 === y1 ? y0 - 1 : y0 - (y1 - y0) * 0.1, yb = y0 === y1 ? y1 + 1 : y1 + (y1 - y0) * 0.1;
    const X = (v) => L + (x1 === x0 ? (W - L - R) / 2 : ((v - x0) / (x1 - x0)) * (W - L - R));
    const Y = (v) => T + (1 - (v - ya) / (yb - ya)) * (H - T - B);
    const NS = 'http://www.w3.org/2000/svg';
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 ' + W + ' ' + H); s.setAttribute('class', 'diagramm'); s.setAttribute('role', 'img');
    const add = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; s.append(e); return e; };
    for (let i = 0; i <= 2; i++) {
      const v = ya + ((yb - ya) * i) / 2, y = Y(v);
      add('line', { x1: L, x2: W - R, y1: y, y2: y, class: 'gitter-l' });
      add('text', { x: L - 5, y: y + 4, 'text-anchor': 'end' }, U.fmt(v, 0));
    }
    const d = punkte.map((p, i) => (i ? 'L' : 'M') + X(U.num(p.x)).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join('');
    if (punkte.length > 1) add('path', { d: d + 'L' + X(x1).toFixed(1) + ' ' + (H - B) + 'L' + X(x0).toFixed(1) + ' ' + (H - B) + 'Z', class: 'flaeche' });
    add('path', { d, class: 'linie' });
    punkte.forEach((p) => add('circle', { cx: X(U.num(p.x)), cy: Y(p.y), r: 3.6 }));
    add('text', { x: L, y: H - 5, 'text-anchor': 'start' }, U.datum(punkte[0].x, true));
    add('text', { x: W - R, y: H - 5, 'text-anchor': 'end' }, U.datum(punkte[punkte.length - 1].x, true));
    return s;
  },

  /* ---------- kleine Bausteine ---------- */
  punkte(n, max) {
    const w = U.el('span', { class: 'punkte', 'aria-label': n + ' von ' + (max || 4) });
    for (let i = 1; i <= (max || 4); i++) w.append(U.el('i', { class: i <= n ? 'an' : '' }));
    return w;
  },
  pille(text, art, icon) { return U.el('span', { class: 'pille ' + (art || '') }, icon ? App.icon(icon) : null, text); },
  abschnitt(titel, aktion) {
    return U.el('div', { class: 'abschnitt' }, U.el('h2', { text: titel }), aktion ? U.el('button', { class: 'mehr', text: aktion.text, onclick: aktion.fn }) : null);
  },
  leer(icon, titel, text, knopf) {
    return U.el('div', { class: 'leer' }, App.icon(icon), U.el('h3', { text: titel }), U.el('p', { text }),
      knopf ? U.el('button', { class: 'btn', onclick: knopf.fn }, knopf.icon ? App.icon(knopf.icon) : null, knopf.text) : null);
  },
  zeile(titel, sub, icon, fn) {
    const pfeil = App.icon('weiter');
    pfeil.setAttribute('class', 'pfeil');
    return U.el('button', { class: 'zeile', onclick: fn }, icon ? App.icon(icon) : null,
      U.el('div', { class: 't' }, U.el('b', { text: titel }), sub ? U.el('span', { text: sub }) : null), pfeil);
  },
  schalter(titel, sub, an, fn) {
    const sw = U.el('span', { class: 'sw' + (an ? ' an' : '') });
    const b = U.el('button', { class: 'schalter', role: 'switch', 'aria-checked': an ? 'true' : 'false' }, U.el('div', { class: 't' }, U.el('b', { text: titel }), sub ? U.el('span', { text: sub }) : null), sw);
    b.onclick = () => { an = !an; sw.classList.toggle('an', an); b.setAttribute('aria-checked', an ? 'true' : 'false'); fn(an); };
    return b;
  },
  /** Tab-Leiste (Segment) → Node; opt: [{id,label}] */
  segment(opt, aktiv, fn) {
    const w = U.el('div', { class: 'segment', role: 'tablist' });
    for (const o of opt) w.append(U.el('button', { class: o.id === aktiv ? 'on' : '', role: 'tab', text: o.label, onclick: () => fn(o.id) }));
    return w;
  },
};
